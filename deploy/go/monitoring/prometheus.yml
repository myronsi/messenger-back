global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]
  - job_name: worker
    static_configs:
      - targets: ["worker:8081"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: livekit
    static_configs:
      - targets: ["livekit:6789"]

# The Go backend on one host (#124): api and worker from the released image, the migrations as one-shot
# steps, and, with COMPOSE_PROFILES=stores, single-node stores for staging. Production points .env at its
# own clusters instead (docs/deployment.md). deploy.sh runs it; see docs/deploy-go.md.
#
# Python deployment has been retired. This is the production stack.
name: messenger-go

x-app: &app
  image: ${BACKEND_IMAGE:-unset}
  # The whole .env: the backend's settings are documented in .env.example and docs/go-backend.md.
  env_file:
    - .env
    - path: .env.notifications
      required: false
  restart: unless-stopped
  # The image has no shell for a healthcheck; deploy.sh checks /readyz and /healthz from the host.
  volumes:
    - geoip-data:/geoip:ro

x-migrate: &migrate
  image: migrate/migrate:v4.20.1
  entrypoint: ["sh", "/migrate.sh", "/migrations"]
  profiles: ["migrate"]
  restart: "no"

services:
  api:
    <<: *app
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8080}:8080"

  worker:
    <<: *app
    command: ["/app/worker"]
    ports:
      - "127.0.0.1:${WORKER_PORT:-8081}:8081"

  # --- Audio calls (COMPOSE profile calls): started by deploy.sh only with CALLS_ENABLED=true. ---

  # LiveKit with embedded TURN (docs/calls.md#deployment). Bridge network with explicit ports: the API reaches
  # it as http://livekit:7880, its webhooks reach http://api:8080, and the signalling and metrics ports stay on
  # loopback. Published media ports are the same inside and outside, because LiveKit advertises them to
  # browsers; only TURN/TLS behind nginx on 443 differs (see its ports entry).
  # It gets only the settings below, never the whole .env.
  livekit:
    image: livekit/livekit-server:v1.13.10
    profiles: ["calls"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    # Set by deploy.sh to the hash of livekit/livekit.yaml, so a changed file recreates the container (and
    # ends running calls) while an unchanged one leaves it running.
    labels:
      messenger.livekit-config: ${LIVEKIT_CONFIG_SHA256:-}
    environment:
      LIVEKIT_KEYS: "${CALLS_API_KEY:-}: ${CALLS_API_SECRET:-}"
      LIVEKIT_WEBHOOK_API_KEY: ${CALLS_API_KEY:-}
      NODE_IP: ${CALLS_NODE_IP:-}
      LIVEKIT_ROOM_MAX_PARTICIPANTS: ${CALLS_MAX_PARTICIPANTS:-10}
      LIVEKIT_RTC_TCP_PORT: ${CALLS_TCP_PORT:-7881}
      LIVEKIT_RTC_UDP_PORT_START: ${CALLS_UDP_PORT_START:-50000}
      LIVEKIT_RTC_UDP_PORT_END: ${CALLS_UDP_PORT_END:-50003}
      LIVEKIT_TURN_DOMAIN: ${CALLS_TURN_DOMAIN:-}
      LIVEKIT_TURN_TLS_PORT: ${CALLS_TURN_TLS_PORT:-5349}
      LIVEKIT_TURN_UDP_PORT: ${CALLS_TURN_UDP_PORT:-3478}
      LIVEKIT_TURN_RELAY_RANGE_START: ${CALLS_TURN_RELAY_PORT_START:-50004}
      LIVEKIT_TURN_RELAY_RANGE_END: ${CALLS_TURN_RELAY_PORT_END:-50100}
      LIVEKIT_TURN_CERT: /etc/livekit/turn.crt
      LIVEKIT_TURN_KEY: /etc/livekit/turn.key
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
      - type: bind
        source: ${CALLS_TURN_CERT_FILE:-/dev/null}
        target: /etc/livekit/turn.crt
        read_only: true
      - type: bind
        source: ${CALLS_TURN_KEY_FILE:-/dev/null}
        target: /etc/livekit/turn.key
        read_only: true
    ports:
      # Signalling (wss://calls.<domain> through the host's nginx) and Prometheus metrics: loopback only.
      - "127.0.0.1:${CALLS_HTTP_PORT:-7880}:7880/tcp"
      - "127.0.0.1:${CALLS_METRICS_PORT:-6789}:6789/tcp"
      # Public (Security Group): ICE/TCP, ICE/UDP, TURN/UDP and the TURN relay ports.
      - "${CALLS_TCP_PORT:-7881}:${CALLS_TCP_PORT:-7881}/tcp"
      - "${CALLS_UDP_PORT_START:-50000}-${CALLS_UDP_PORT_END:-50003}:${CALLS_UDP_PORT_START:-50000}-${CALLS_UDP_PORT_END:-50003}/udp"
      - "${CALLS_TURN_UDP_PORT:-3478}:${CALLS_TURN_UDP_PORT:-3478}/udp"
      - "${CALLS_TURN_RELAY_PORT_START:-50004}-${CALLS_TURN_RELAY_PORT_END:-50100}:${CALLS_TURN_RELAY_PORT_START:-50004}-${CALLS_TURN_RELAY_PORT_END:-50100}/udp"
      # TURN/TLS: 0.0.0.0:5349 with its own Security Group rule, or 127.0.0.1:5349 behind nginx's stream
      # block on 443 (then CALLS_TURN_TLS_PORT=443, the port browsers are told).
      - "${CALLS_TURN_TLS_PUBLISH:-0.0.0.0:5349}:${CALLS_TURN_TLS_PORT:-5349}/tcp"
    # Media must not starve messaging and the stores on the 2 vCPU / 8 GiB host: a hard cap, and half the CPU
    # weight of the other containers when they compete.
    cpus: ${CALLS_CPUS:-1.0}
    cpu_shares: 512
    mem_limit: ${CALLS_MEM_LIMIT:-1g}
    memswap_limit: ${CALLS_MEM_LIMIT:-1g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # The logs name rooms, participant identities and client addresses: keep them small and short-lived.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # --- One-shot steps, run by deploy.sh before api and worker start. ---

  postgres-migrate:
    <<: *migrate
    environment:
      MIGRATE_DATABASE: ${DATABASE_URL:-}
    volumes:
      - ./migrate.sh:/migrate.sh:ro
      - ./migrations/postgres:/migrations:ro

  scylla-migrate:
    <<: *migrate
    environment:
      MIGRATE_DATABASE: ${SCYLLA_MIGRATE_URL:-}
    volumes:
      - ./migrate.sh:/migrate.sh:ro
      - ./migrations/scylla:/migrations:ro

  geoip-init:
    image: curlimages/curl:8.22.0
    profiles: ["geoip"]
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "/scripts/update-dbip.sh"]
    command: ["/data/dbip-city-lite.mmdb", "--if-missing"]
    volumes:
      - ./geoip:/scripts:ro
      - geoip-data:/data

  # A custom-format dump of DATABASE_URL to stdout (deploy.sh keeps it in backups/).
  postgres-backup:
    image: postgres:18-alpine
    profiles: ["backup"]
    restart: "no"
    environment:
      DATABASE_URL: ${BACKUP_DATABASE_URL:-${DATABASE_URL:-}}
    entrypoint: ["sh", "-c", "exec pg_dump --format=custom --no-owner \"$$DATABASE_URL\""]

  # --- Single-node stores (COMPOSE_PROFILES=stores): staging only, no ports on the host. ---

  postgres:
    image: postgres:18-alpine
    profiles: ["stores"]
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    profiles: ["stores"]
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scylla:
    image: scylladb/scylla:2026.1
    profiles: ["stores"]
    command: ["--smp", "1", "--memory", "1G", "--overprovisioned", "1", "--developer-mode", "1"]
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # The keyspace golang-migrate needs. A cluster gets its own, with replication factor 3 (docs/deployment.md).
  scylla-keyspace:
    image: scylladb/scylla:2026.1
    profiles: ["stores"]
    restart: "no"
    entrypoint: ["cqlsh", "scylla", "-e"]
    command: ["CREATE KEYSPACE IF NOT EXISTS messenger WITH replication = {'class': 'NetworkTopologyStrategy', 'datacenter1': 1}"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    profiles: ["stores"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # Plain HTTP inside the compose network, which has no published port.
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-}
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:1.0.1
    profiles: ["stores"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage-init:
    image: amazon/aws-cli:2.37.9
    profiles: ["stores"]
    restart: "no"
    entrypoint: ["sh", "/init/create-buckets.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://object-storage:9000
      S3_BUCKETS: ${S3_BUCKET:-messenger-media}
    volumes:
      - ./object-storage:/init:ro

volumes:
  postgres-data:
  redis-data:
  scylla-data:
  elasticsearch-data:
  object-storage-data:
  geoip-data:

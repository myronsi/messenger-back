version: "2"
sql:
  - engine: postgresql
    # sqlc reads the golang-migrate files and ignores the *.down.sql ones.
    schema: migrations/postgres
    queries: internal/store/postgres/queries
    gen:
      go:
        package: sqlcdb
        out: internal/store/postgres/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true

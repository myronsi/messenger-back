name: Label API changes

# pull_request_target so the label can be set on pull requests from forks. The workflow
# never checks out or runs code from the pull request: labeler only reads the changed file names.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          sync-labels: true

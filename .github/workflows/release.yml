name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      # 0.x releases are the Python backend (Dockerfile, deploy.yml); 1.x and later the Go backend
      # (go.Dockerfile, deploy-go.yml). See docs/deploy-go.md.
      python: ${{ startsWith(steps.release.outputs.tag_name, 'v0.') }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v0.5.0 -> 0.5.0, 0.5 and latest (pre-releases get neither 0.5 nor latest). The v0.5.0 tag is
      # kept because deploy.yml and rollbacks address images by the release tag.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.tag_name, '-') }}
      - name: Python or Go
        id: kind
        env:
          PYTHON: ${{ needs.release-please.outputs.python }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "$PYTHON" = true ]; then
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "scope=python" >> "$GITHUB_OUTPUT"
          else
            echo "file=go.Dockerfile" >> "$GITHUB_OUTPUT"
            echo "scope=go" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ steps.kind.outputs.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=${{ steps.kind.outputs.version }}
          cache-from: type=gha,scope=${{ steps.kind.outputs.scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.kind.outputs.scope }}

  # Publishes the API contract as @myronsi/messenger-api: the stable version after a release when
  # info.version is not on npm yet, otherwise a `next` snapshot if api/ changed in this commit.
  # npm Trusted Publishing accepts one workflow per package, and this is the one (see api-publish.yml).
  contract:
    needs: release-please
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/api-publish.yml
    with:
      channel: ${{ needs.release-please.outputs.release_created == 'true' && 'release' || 'next' }}

  # Attaches the images-only compose file with the image pinned to this release, so a frontend can
  # start the matching backend with all its stores. It is the Python stack, so Python releases only.
  stack:
    needs: [release-please, image]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Upload compose.stack.yaml to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sed "s#/messenger-back:master}#/messenger-back:${version}}#" deploy/compose.stack.yaml > "$RUNNER_TEMP/compose.stack.yaml"
          grep -q "messenger-back:${version}}" "$RUNNER_TEMP/compose.stack.yaml"
          gh release upload "$TAG" "$RUNNER_TEMP/compose.stack.yaml" --clobber --repo "$GITHUB_REPOSITORY"

  # Every merge to master also publishes snapshot images: the Python backend as master and sha-<short sha>
  # (the frontend's compatibility tests use them), the Go backend as go-master and go-sha-<short sha>.
  snapshot-image:
    strategy:
      # One failing build must not cancel the other: the frontend's tests rely on the Python snapshots.
      fail-fast: false
      matrix:
        include:
          - { file: Dockerfile, prefix: "", scope: python }
          - { file: go.Dockerfile, prefix: go-, scope: go }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch,prefix=${{ matrix.prefix }}
            type=sha,prefix=${{ matrix.prefix }}sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=master
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}

  # The production environment only accepts deployments from `edge`, so the release
  # commit is moved there and the deploy workflow is dispatched on that branch.
  promote:
    needs: [release-please, image, contract, stack]
    if: ${{ needs.release-please.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Move edge to the release commit and deploy from it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/edge" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/edge -f sha="$GITHUB_SHA"
          gh workflow run deploy.yml --repo "${{ github.repository }}" --ref edge -f tag="$TAG"

  # Go releases deploy to staging, every one of them (pre-releases included). Production gets a Go
  # release only once the switch has happened and the repository variable GO_PRODUCTION is true
  # (docs/switchover.md); until then it keeps the Python backend.
  promote-go:
    needs: [release-please, image, contract]
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.python != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Deploy to staging
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run deploy-go.yml --repo "${{ github.repository }}" --ref master -f tag="$TAG" -f environment=staging
      - name: Deploy to production (after the switch, stable releases only)
        if: ${{ vars.GO_PRODUCTION == 'true' && !contains(needs.release-please.outputs.tag_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/git/refs/heads/edge" -f sha="$GITHUB_SHA" -F force=true \
            || gh api -X POST "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/edge -f sha="$GITHUB_SHA"
          gh workflow run deploy-go.yml --repo "${{ github.repository }}" --ref edge -f tag="$TAG" -f environment=production

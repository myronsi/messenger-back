name: Go

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Built with the Go version of the job, so it can always analyse this module.
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }} run ./...
      - run: go vet ./...
      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Generated code (openapi.yaml, sqlc) is up to date
        run: |
          go generate ./...
          git diff --exit-code

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The database tests create and drop a database of their own for every test.
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/postgres?sslmode=disable
      # The auth tests use a private key namespace per test.
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # The message store tests create a keyspace of their own and drop it afterwards.
      TEST_SCYLLA_HOSTS: 127.0.0.1:9042
      # The S3 storage tests create a bucket of their own.
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: ci-access
      TEST_S3_SECRET_KEY: ci-only-secret
      # The search tests use an index alias of their own.
      TEST_ELASTIC_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A service container cannot take the command-line flags ScyllaDB needs on a small runner.
      - name: Start ScyllaDB
        run: ./deploy/ci/start-scylla.sh
      - name: Start S3 (RustFS)
        run: ./deploy/ci/start-s3.sh
      - name: Start Elasticsearch
        run: ./deploy/ci/start-elastic.sh
      # Voice messages are measured with ffprobe and ffmpeg (the image ships static builds).
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The migrations create the schema on an empty database, roll back and apply again, with the real tool.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: messenger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@127.0.0.1:5432/messenger?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: make migrate-postgres
      - run: make migrate-postgres-down
      - run: make migrate-postgres
      - name: Start ScyllaDB
        run: ./deploy/ci/start-scylla.sh
      - name: ScyllaDB migrations (up, down, up)
        env:
          SCYLLA_HOSTS: 127.0.0.1:9042
          SCYLLA_KEYSPACE: messenger
        run: |
          docker exec scylla cqlsh -e "CREATE KEYSPACE messenger WITH replication = {'class': 'NetworkTopologyStrategy', 'replication_factor': 1}"
          make migrate-scylla
          make migrate-scylla-down
          make migrate-scylla

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          # Vulnerabilities of the standard library are fixed in Go patch releases.
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: go.Dockerfile
          push: false
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,scope=go,mode=max

  # The development stack from compose.dev.yaml starts and every store answers /readyz.
  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Create .env with generated secrets
        run: go run deploy/dev/genenv.go
      - name: Start the stack
        run: docker compose -f compose.dev.yaml up --build --detach --wait
      - name: The API reports every store ready
        run: |
          # The distroless images have no Compose healthcheck, so --wait does not cover the listeners.
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors --retry-connrefused http://127.0.0.1:8080/readyz
          curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors --retry-connrefused http://127.0.0.1:8081/healthz
      - name: Start again (the init steps are idempotent)
        run: docker compose -f compose.dev.yaml up --detach --wait
      - name: Logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs --no-color --tail 200
      - name: Stop
        if: always()
        run: docker compose -f compose.dev.yaml down --volumes
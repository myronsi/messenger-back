name: Deploy (Go)

# Deploys a Go release (1.x) with deploy/go: dispatched by the release workflow, to staging for every Go
# release and to production (from edge) once GO_PRODUCTION is true. Run it manually to roll back to an
# earlier tag. Python releases (0.x) go through deploy.yml. See docs/deploy-go.md.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Released Go tag to deploy, for example v1.0.0-alpha.1
        required: true
        type: string
      environment:
        description: Where to deploy
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-go-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.environment }}
      APP_DIR: ${{ vars.GO_DEPLOY_PATH || '/opt/messenger-go' }}
    steps:
      # Staging has secrets of its own (STAGING_SSH_*), production the existing SSH_*. The set is picked
      # here, without any fallback from one to the other: a missing staging secret fails the run instead
      # of reaching the production host.
      - name: Check the request and pick the SSH settings
        env:
          GO_PRODUCTION: ${{ vars.GO_PRODUCTION }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST: ${{ secrets.SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          case "$TAG" in
            v0.*) echo "::error::$TAG is a Python release; deploy it with deploy.yml"; exit 1 ;;
            v[1-9]*) ;;
            *) echo "::error::$TAG is not a release tag"; exit 1 ;;
          esac
          if [ "$TARGET" = production ] && [ "$GO_PRODUCTION" != true ]; then
            echo "::error::Production runs the Python backend until the switch (docs/switchover.md); GO_PRODUCTION is not true"
            exit 1
          fi
          case "$TARGET" in
            staging) host=$STAGING_SSH_HOST user=$STAGING_SSH_USER key=$STAGING_SSH_KEY known=$STAGING_SSH_KNOWN_HOSTS ;;
            production) host=$PROD_SSH_HOST user=$PROD_SSH_USER key=$PROD_SSH_KEY known=$PROD_SSH_KNOWN_HOSTS ;;
            *) echo "::error::unknown environment $TARGET"; exit 1 ;;
          esac
          if [ -z "$host" ] || [ -z "$user" ] || [ -z "$key" ] || [ -z "$known" ]; then
            echo "::error::The $TARGET environment lacks its SSH secrets (docs/deploy-go.md)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$key" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$known" > ~/.ssh/known_hosts
          printf 'Host deploy\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' "$host" "$user" > ~/.ssh/config
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
      # migrations/ is replaced as a whole, so it always is this release's: a rollback must not find the
      # migrations of a later release there. .env, v1.env, backups/ and reports/ are not in the bundle.
      - name: Upload the stack, its scripts and the migrations
        run: |
          bash deploy/go/bundle.sh "$RUNNER_TEMP/bundle"
          tar -C "$RUNNER_TEMP/bundle" -czf - . | ssh deploy "mkdir -p '$APP_DIR' && rm -rf '$APP_DIR/migrations' && tar -xzf - -C '$APP_DIR'"
      - name: Log in to GHCR on the server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | ssh deploy "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
      - name: Deploy
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: ssh deploy "bash '$APP_DIR/deploy.sh' '$APP_DIR' '$IMAGE_REPO:$TAG'"

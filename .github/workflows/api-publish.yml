name: Publish API contract

# Publishes @myronsi/messenger-api to npmjs.com. Called only by release.yml on every push to master:
#   next:    a merge that changes api/ -> <info.version>-next.<run number> under the `next` dist-tag
#   release: after a backend release -> info.version under `latest`
#            (a pre-release such as 2.0.0-alpha.1 goes under `alpha`), only if that version is not on npm yet,
#            that is, only if the contract changed since the last publish.
# Authentication is npm Trusted Publishing (OIDC), there is no token. npm validates the workflow that started
# the run, so the trusted publisher on npmjs.com must be repository myronsi/messenger-back, workflow release.yml.
# This is why the file has no triggers of its own: a second entry point would need a second trusted publisher.
on:
  workflow_call:
    inputs:
      channel:
        description: release or next
        type: string
        default: release

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'myronsi/messenger-back'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CHANNEL: ${{ inputs.channel || 'next' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Trusted Publishing needs npm 11.5.1 or newer, which Node 24 ships.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - name: Decide version and dist-tag
        id: plan
        run: |
          set -euo pipefail
          contract="$(node -p "require('./package.json').version")"
          if [ "$CHANNEL" = "next" ]; then
            version="$(node scripts/next-version.mjs "$GITHUB_RUN_NUMBER")"
            tag=next
          else
            version="$contract"
            case "$version" in
              *-*) pre="${version#*-}"; tag="${pre%%.*}" ;;
              *) tag=latest ;;
            esac
          fi
          publish=true
          if [ "$CHANNEL" = "next" ] && git diff --quiet HEAD^ HEAD -- .; then
            echo "::notice::api/ did not change in this commit, no snapshot"
            publish=false
          elif npm view "@myronsi/messenger-api@${version}" version >/dev/null 2>&1; then
            echo "::notice::@myronsi/messenger-api@${version} is already on npm, the contract did not change"
            publish=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          # verbose shows why a Trusted Publishing token exchange is rejected, npm hides it otherwise
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          # Only the package version of the next channel differs from info.version; dist/ already carries API_VERSION.
          # check and build ran above, and the check would reject that intentional difference, so no lifecycle scripts.
          if [ "$VERSION" != "$(node -p "require('./package.json').version")" ]; then
            npm version "$VERSION" --no-git-tag-version
          fi
          npm publish --ignore-scripts --provenance --access public --tag "$TAG"

services:
  backend:
    build:
      context: .
    # Deploys set BACKEND_IMAGE in .env to the released GHCR image.
    image: ${BACKEND_IMAGE:-messenger-back:local}
    # Only the reverse proxy (nginx) should be able to reach the backend. For local testing from
    # another device on the network, set BACKEND_BIND=0.0.0.0 in .env.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see README)}
      # Set when a reverse proxy serves the API under a prefix such as /api (see README).
      COOKIE_PATH_PREFIX: ${COOKIE_PATH_PREFIX:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      WS_ALLOW_QUERY_TOKEN: ${WS_ALLOW_QUERY_TOKEN:-true}
      DATABASE_URL: postgresql://messenger:messenger@postgres:5432/messenger
    volumes:
      - messenger_static:/app/static
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - messenger_postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  messenger_postgres:
  messenger_static:

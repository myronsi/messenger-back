services:
  backend:
    build:
      context: .
    environment:
      MESSENGER_DB_PATH: /app/data/messenger.db
      MESSENGER_STATIC_PATH: /app/static
    ports:
      - "8000:8000"
    volumes:
      - messenger_data:/app/data
      - messenger_static:/app/static
    restart: unless-stopped

volumes:
  messenger_data:
  messenger_static:

  /link-preview:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: getLinkPreview
      summary: Preview of a web page for a link in a message
      description: |
        Reads the page's Open Graph data (`og:title`, `og:description`, `og:site_name`, `og:image`; falling back to
        `<title>`, `description` and `twitter:image`). Only public `http`/`https` addresses on ports 80 and 443
        are fetched. Answers are cached for a day (a page without a preview for an hour). `image.url` points to
        `GET /link-preview/image`, so clients never load third-party images directly. `404` when the page has
        no preview or cannot be fetched.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /link-preview/image:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: getLinkPreviewImage
      summary: The image of a link preview, through the server
      description: |
        Use the `image.url` of a link preview as it is; `sig` proves the server made it. PNG, JPEG, GIF and WebP
        up to 5 MB, sent with `X-Content-Type-Options: nosniff`.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: sig
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Image content
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /maps/tiles/{z}/{x}/{y}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: z
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 19 }
      - name: x
        in: path
        required: true
        description: Tile column, `0` to `2^z - 1`
        schema: { type: integer, minimum: 0 }
      - name: y
        in: path
        required: true
        description: Tile row, `0` to `2^z - 1`
        schema: { type: integer, minimum: 0 }
    get:
      tags: [maps]
      operationId: getMapTile
      summary: A 256 px map tile, through the server
      description: |
        For the map a client shows while picking a place. The server fetches OpenStreetMap tiles and caches them, so
        the viewer never contacts the tile provider. Clients must show "© OpenStreetMap contributors" on the map,
        request only the tiles of the visible area and never download tiles ahead (no offline maps). At most 600
        tiles per minute per user (`429`). `503` when the provider cannot be reached and no copy is cached.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: PNG tile
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The tile provider is unavailable
  /maps/static:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [maps]
      operationId: getStaticMap
      summary: The map image of a location message
      description: |
        Use `MessageLocation.map.url` as it is; `sig` proves the server made it. A 640 x 320 JPEG at zoom 16 with a
        pin in the middle, made from OpenStreetMap tiles. Clients show "© OpenStreetMap contributors" on it. `503`
        when the image is not made yet and the tile provider cannot be reached.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: sig
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: JPEG image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: The tile provider is unavailable


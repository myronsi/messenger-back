  /emoji/items/{emoji_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/EmojiId"
    get:
      tags: [emoji]
      operationId: getCustomEmoji
      summary: One custom emoji
      description: "Any signed-in user. For tooltips of `c:<id>` reactions and to open the pack (`pack_slug`)."
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The emoji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomEmoji" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /emoji/items/{emoji_id}/image:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/EmojiId"
    get:
      tags: [emoji]
      operationId: getCustomEmojiImage
      summary: The image of a custom emoji
      description: |
        Any signed-in user; a WebP (still or animated) of 128 x 128 px, or for older emoji a PNG or a GIF. Cached
        as immutable. `404` once the emoji or its pack is deleted: clients then show the token's `:shortcode:` text.
      parameters:
        - name: variant
          in: query
          description: "`inline`: the emoji at 64 px for text; the 128 px image when the emoji has none."
          schema:
            type: string
            enum: [inline]
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a short-lived signed URL in object storage
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/emoji:

  /calls/config:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [calls]
      operationId: getCallConfig
      summary: Whether calls are available and their limits
      description: |
        `enabled` is `false` when the server has no media service configured or calls are switched off; clients then
        hide every call control. `video_enabled` and `screen_share_enabled` say whether the camera and screen sharing
        controls are offered; the media grant allows only the sources that are switched on. Clients must also check that the browser supports call encryption before offering
        calls.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Call availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/call-identity:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [calls]
      operationId: setCallIdentity
      summary: Register this session's call identity public key
      description: |
        One key per session (see `docs/calls-e2ee.md`). Registering a different key replaces the old one; if the
        session is in a call, the call's epoch increases. The private key never leaves the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallIdentityRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Stored
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [calls]
      operationId: listMyCalls
      summary: Calls that are not over and involve the current user
      description: |
        Calls ringing the user and calls the user has joined, newest first. Clients load this after every
        (re)connect, because realtime events are best effort.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Current calls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /chats/{chat_id}/call:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [calls]
      operationId: getChatCall
      summary: The chat's call that is not over
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The current call of the chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
    post:
      tags: [calls]
      operationId: startChatCall
      summary: Start a call in the chat, or get the one already running
      description: |
        Starts ringing the other members. A chat has at most one call that is not over: when one exists it is
        returned with `200` and the client joins it instead. `client_request_id` makes retries idempotent for
        24 hours. Starting does not join: the caller then calls `POST /calls/{call_id}/join`.

        Refused with `403` (`calls_not_allowed`) when the peer of a direct chat has calls turned off or one user
        blocked the other, `503` (`calls_unavailable`) when calls are off on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCallRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A call was already running in the chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "201":
          description: The new call, ringing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    get:
      tags: [calls]
      operationId: getCall
      summary: A call of one of the user's chats
      description: Ended calls stay readable for 90 days.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/join:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: joinCall
      summary: Answer or join a call with this session
      description: |
        Answers a ringing call or joins a running group call, and returns a short-lived media grant for this
        session. The session must have a call identity (`422`, `call_identity_required`). A user is in at most one
        call with one session: `409` (`already_in_call`) unless `takeover` is `true`, which moves the user's
        participation to this session (the other session is removed from the media room). Other `409` codes:
        `call_ended`, `call_full`. The epoch of the call increases. The body is optional: no body, an empty body
        and `{}` all join without takeover.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCallRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallJoin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/grant:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: renewCallGrant
      summary: A fresh media grant for the session that joined
      description: For reconnecting to the media server. Only the session that joined gets one (`409` otherwise).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/decline:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: declineCall
      summary: Decline a ringing call
      description: |
        Stops the ringing on all of the user's devices. In a direct call this ends the call (`declined`); in a group
        call only this user's invitation ends. Declining a call that no longer rings changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Declined
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/leave:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: leaveCall
      summary: Leave the call
      description: |
        A direct call ends when either side leaves. A group call ends when the last participant has left and the
        short reconnect grace has passed. The caller leaving a call nobody answered cancels it (`cancelled`).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Left
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/end:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: endCall
      summary: End the call for everyone
      description: |
        Allowed for the initiator, for both members of a direct call, and for the owner, admins and moderators of a
        group (`403` otherwise). Everyone is removed from the media room.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Ended
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/keys:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    get:
      tags: [calls]
      operationId: getCallKeys
      summary: Key envelopes addressed to this session in the current epoch
      description: For catching up after a reconnect; the same envelopes also arrive as `call_keys` events.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The envelopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallKeyEnvelopeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
    post:
      tags: [calls]
      operationId: sendCallKeys
      summary: Send this session's sealed sender key to the other participants
      description: |
        Relays opaque HPKE envelopes (see `docs/calls-e2ee.md`). Only the session that joined may send, only for the
        current epoch (`409`, `stale_epoch`), and only to sessions on the roster of that epoch (`422`). The server
        never sees a plaintext key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCallKeysRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Relayed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from login or refresh.
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh cookie set by login; scoped to `/api/v2/auth`.

  headers:
    RefreshCookie:
      description: HttpOnly, Secure, SameSite refresh cookie scoped to `/api/v2/auth/refresh`, so the browser sends it only to the refresh endpoint. Login and refresh set it; logout clears it (expired cookie).
      schema: { type: string }

  parameters:
    ConnectionProviderPath:
      name: provider
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ConnectionProvider" }
    QrLoginRequestId:
      name: requestId
      in: path
      required: true
      description: ID of a QR sign-in request, from the QR code link `/qr/<request_id>`.
      schema: { type: string, minLength: 32, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    After:
      name: after
      in: query
      description: Opaque `next_cursor` of the previous page
      schema: { $ref: "#/components/schemas/Cursor" }
    ChatId:
      name: chat_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PlaylistId:
      name: playlist_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ImportId:
      name: import_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ImportSenderKey:
      name: sender_key
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ImportSenderKey" }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    InviteLinkId:
      name: link_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    InviteToken:
      name: token
      in: path
      required: true
      schema: { $ref: "#/components/schemas/InviteToken" }
    PublicNameParam:
      name: public_name
      in: path
      required: true
      schema: { $ref: "#/components/schemas/PublicName" }
    ReportOutcomeId:
      name: outcome_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AttachmentRef" }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StickerPackId:
      name: pack_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    StickerId:
      name: sticker_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    EmojiPackId:
      name: pack_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    EmojiId:
      name: emoji_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    StickerPackSlug:
      name: slug
      in: path
      required: true
      schema: { $ref: "#/components/schemas/StickerPackSlug" }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: call_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Version of the client app, for logs and the per-client metric.
      schema: { type: string }
    DeviceProof:
      name: Device-Proof
      in: header
      required: false
      description: |
        Proof that the request comes from the device the session is bound to: a compact JWS (`typ` `dpop+jwt`,
        `alg` `ES256`, the public P-256 key as `jwk` in the protected header) over `htm` (HTTP method), `htu`
        (absolute request URL without query and fragment), `iat` (Unix seconds) and `jti` (unique per proof).
        A session created with a proof is bound to its key; an unbound session is bound at its first refresh
        with a proof. Refreshing a bound session without a proof of its key ends the session (`401`). Bad
        proofs are answered `400` (`invalid_request`), an `iat` more than 5 minutes off with `401`
        (`device_proof_stale`); the session survives, and the client may retry with its clock corrected by the
        `Date` response header.
      schema: { type: string, maxLength: 2048 }
    ClientApiVersion:
      name: X-Client-Api-Version
      in: header
      required: false
      description: Contract version the client was built with (`API_VERSION` of `@myronsi/messenger-api`). A different MAJOR or a version below `min_client_api_version` is answered with `426`; a malformed value with `400` (`invalid_client_version`).
      schema: { type: string }

  responses:
    ClientOutdated:
      description: "The `X-Client-Api-Version` header has another MAJOR version than the server or is below `min_client_api_version` (`client_outdated`). Not returned by `/meta`, which clients use to find out the current versions."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Malformed request, or a malformed `X-Client-Api-Version` header (`invalid_client_version`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TwoFactorRequired:
      description: |
        Missing, invalid or expired credentials, or `code: two_factor_required`. `two_factor_required` means every
        other credential in the request was valid, the account has two-factor on, and no `code` was sent. Nothing
        single-use (recovery key, email token, recovery request) was consumed: send the same request again with
        `code`. Invalid other credentials get the usual error of the operation instead, whatever the two-factor
        state, and a wrong `code` keeps its usual error. On operations that need an access token this 401 does not
        mean the session is lost; tell the two apart by `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed. `account_restricted` (with `restriction`) when the account status blocks the action.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Does not exist or is not visible to the current user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The state of the resource does not allow this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Upload exceeds the size limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: The content type is not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Syntactically valid but rejected values; `errors` lists the fields
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CallsUnavailable:
      description: |
        Calls are switched off on the server, or the server is at its call capacity (both `calls_unavailable`), or
        the media service or a store is away for a moment (`internal_error`). Retry after `Retry-After` when it is
        present; without it calls stay off until `GET /calls/config` reports them enabled.
      headers:
        Retry-After:
          description: Seconds until a retry may succeed
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    NotificationPreferences:
      type: object
      required:
        - enabled
        - sound
        - previews
      properties:
        enabled:
          type: boolean
        sound:
          type: boolean
        previews:
          type: boolean
        birthday_reminders:
          type: boolean
          description: |
            A push at 09:00 (in `Me.time_zone`) when someone you have a direct chat with has a birthday. Always sent
            by the server; when a `PUT` leaves it out, it stays as it is. Defaults to `true`.
        mentions_in_muted:
          type: boolean
          description: |
            A push when someone mentions you (`@username`, or `@all` from an owner or admin) in a chat you muted.
            Always sent by the server; when a `PUT` leaves it out, it stays as it is. Defaults to `true`.
    NotificationSettings:
      type: object
      required:
        - preferences
        - mutes
        - web_push
        - android_push
        - ios_push
        - vapid_public_key
      properties:
        preferences:
          $ref: "#/components/schemas/NotificationPreferences"
        mutes:
          type: array
          items:
            type: object
            required:
              - chat_id
              - until
            properties:
              chat_id:
                $ref: "#/components/schemas/Id"
              until:
                type: string
                format: date-time
        web_push:
          type: boolean
        android_push:
          type: boolean
        ios_push:
          type: boolean
        vapid_public_key:
          type: string
    NotificationDeviceRequest:
      type: object
      required:
        - platform
        - destination
      properties:
        platform:
          type: string
          enum:
            - web
            - android
            - ios
        destination:
          type: string
          minLength: 1
          maxLength: 4096
        p256dh:
          type: string
          maxLength: 128
        auth:
          type: string
          maxLength: 64
    NotificationDeviceRegistered:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    NotificationMuteRequest:
      type: object
      required:
        - duration
      properties:
        duration:
          type: string
          enum:
            - off
            - 1h
            - 8h
            - forever
    NotificationActivity:
      type: object
      required:
        - active
        - client_id
      properties:
        active:
          type: boolean
        client_id:
          type: string
          format: uuid

    # ---------------------------------------------------------- basics
    Id:
      type: string
      pattern: "^[0-9]{1,19}$"
      description: Decimal ID as a string (Snowflake IDs exceed 2^53).
      examples: ["7217400317439950848"]
    AttachmentRef:
      type: string
      format: uuid
      description: ID of an uploaded attachment (a UUID, unlike the decimal IDs of messages, users and chats).
      examples: ["5f0c8a64-2f2b-4c7e-9d0e-6b1f3a2c4d5e"]
    Cursor:
      type: [string, "null"]
      maxLength: 256
      description: Opaque cursor; `null` when there are no more results.
    Timestamp:
      type: string
      format: date-time
    Username:
      type: string
      pattern: "^[A-Za-z0-9_]{3,32}$"
    ClientTempId:
      type: string
      minLength: 1
      maxLength: 64
      description: Client-generated ID that makes sending idempotent and ties acks and errors to the send.
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. New codes can appear in MINOR versions; unknown
        codes must be treated like `internal_error`.
      enum:
        - invalid_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - two_factor_required
        - invalid_two_factor_code
        - token_expired
        - forbidden
        - not_found
        - conflict
        - already_exists
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - client_outdated
        - device_proof_stale
        - invalid_client_version
        - blocked_by_user
        - approval_required
        - user_verification_required
        - session_too_new
        - calls_unavailable
        - calls_not_allowed
        - call_identity_required
        - call_full
        - call_ended
        - already_in_call
        - stale_epoch
        - limit_reached
        - account_restricted
        - poll_closed
        - quiz_answered
        - internal_error
    Problem:
      type: object
      description: RFC 9457 problem details. `426 Upgrade Required` (`client_outdated`) uses the same format.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type (`about:blank` when `code` says it all).
          default: about:blank
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        errors:
          type: array
          description: Field errors for `validation_failed`.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: JSON pointer into the request body, or the parameter name.
              message: { type: string }
        min_client_api_version:
          type: string
          description: Present when `code` is `client_outdated`.
        api_version:
          type: string
          description: Present when `code` is `client_outdated`.
        restriction:
          allOf: [{ $ref: "#/components/schemas/AccountRestriction" }]
          description: Present when `code` is `account_restricted` (`403`); names what the account status blocks.
      additionalProperties: true
    Meta:
      type: object
      required: [backend_version, commit, api_version, min_client_api_version, connection_providers]
      properties:
        backend_version: { type: string, examples: ["1.0.3"] }
        commit: { type: string, examples: ["abc1234"] }
        api_version: { type: string, examples: ["2.0.0"] }
        min_client_api_version: { type: string, examples: ["2.0.0"] }
        connection_providers:
          type: array
          description: The connected-account providers this server offers.
          items: { $ref: "#/components/schemas/ConnectionProvider" }
    ConnectionProvider:
      type: string
      description: |
        Providers that sign the user in: `github`, `spotify`, `steam`, `xbox`, `discord`, `twitch`, `youtube`,
        `reddit`, `roblox`, `tiktok`. Verified with a published code: `bluesky`, `mastodon`, `website`. Clients show a generic
        icon for a provider they do not know.
      enum: [github, spotify, steam, xbox, discord, twitch, youtube, reddit, roblox, tiktok, bluesky, mastodon, website]
    Connection:
      type: object
      required: [id, provider, display_name, profile_url, verified_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        provider: { $ref: "#/components/schemas/ConnectionProvider" }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        profile_url:
          type: [string, "null"]
          description: The public https page of the account; `null` when the provider has none.
        verified_at: { $ref: "#/components/schemas/Timestamp" }
    ConnectionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 15
          items: { $ref: "#/components/schemas/Connection" }
    ConnectionOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 15
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    ConnectionStart:
      type: object
      required: [redirect_url]
      properties:
        redirect_url: { type: string }
    ConnectionClaimRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 300
          description: "A Bluesky handle (`alice.bsky.social`), a Mastodon account (`@alice@mastodon.social` or its URL), or a domain or URL."
    ConnectionChallenge:
      type: object
      required: [identifier, code, expires_at]
      properties:
        identifier:
          type: string
          description: The account or domain as the server understood it.
        code:
          type: string
          description: The text to publish, such as `messenger-verify=ab12cd34ef56gh78`.
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    # ------------------------------------------------------------ auth
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        display_name:
          type: string
          maxLength: 64
          description: Defaults to the username when it is missing, empty or only whitespace.
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        bio: { type: [string, "null"], maxLength: 500 }
        terms_version:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: |
            The version of the Terms of Use the user accepted: the date of those terms, such as `2026-11-19`. Stored
            with the time of registration. Required, together with `age_confirmed: true`, when the server requires
            terms acceptance (`422` with the field otherwise).
          examples: ["2026-11-19"]
        age_confirmed:
          type: boolean
          description: |
            The user confirmed being at least 13 years old, and that a parent or guardian agrees when under 16.
            `false` is refused with `422` and the field `age_confirmed`.
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, maxLength: 128, writeOnly: true }
    TwoFactorLoginRequest:
      type: object
      required: [login_challenge, code]
      properties:
        login_challenge: { type: string }
        code:
          type: string
          pattern: "^([0-9]{6}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{8})$"
          description: A code of the authenticator app, or an unused recovery code.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          minimum: 1
          description: Seconds until the access token expires
    RecoverWithKeyRequest:
      type: object
      required: [username, recovery_key, new_password]
      properties:
        username: { type: string, maxLength: 64 }
        recovery_key: { type: string, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }
        code: { type: string, maxLength: 128 }
    ReplaceRecoveryKeyRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128 }
        code: { type: string, maxLength: 128 }
    RecoveryKeyResult:
      type: object
      required: [recovery_key]
      properties:
        recovery_key: { type: string }
    RecoveryKeyStatus:
      type: object
      required: [exists, created_at, locked_until]
      properties:
        exists: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        locked_until: { type: [string, 'null'], format: date-time }
    SecurityEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, type, created_at, location]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              type: { type: string }
              created_at: { type: string, format: date-time }
              user_agent: { type: [string, "null"], maxLength: 512 }
              location:
                description: Approximate location of the client when the event happened; `null` when unknown.
                oneOf:
                  - $ref: "#/components/schemas/Location"
                  - type: "null"
    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          description: The one-time recovery key shown after registration.
          properties:
            recovery_key: { type: string, description: Shown once; only a keyed hash is stored }
            username: { $ref: "#/components/schemas/Username" }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, login_challenge]
      properties:
        two_factor_required: { type: boolean, const: true }
        login_challenge: { type: string }
    LoginResponse:
      oneOf:
        - $ref: "#/components/schemas/TokenResponse"
        - $ref: "#/components/schemas/TwoFactorChallenge"
    WebSocketTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          minimum: 1
          description: Seconds the ticket stays valid

    # -------------------------------------------------------------- me
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 128, writeOnly: true }
        new_password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 400
          description: |
            At most 64 characters, counting each custom emoji token (`<:shortcode:id>`) as its `:shortcode:` text.
            Tokens the user may not use become `:shortcode:`.
        bio:
          type: [string, "null"]
          maxLength: 4000
          description: At most 500 characters, counting custom emoji tokens as their `:shortcode:` text.
        pronouns:
          type: [string, "null"]
          maxLength: 40
          description: Free text; `null` or an empty string removes it.
        birthday:
          description: |
            `null` removes it. With a `year` the date must exist (no 29 February in other years); without one,
            29 February is allowed.
          oneOf:
            - $ref: "#/components/schemas/Birthday"
            - type: "null"
        time_zone: { $ref: "#/components/schemas/TimeZone" }
    SetAvatarRequest:
      type: object
      required: [attachment_id]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
    SecuritySettings:
      type: object
      required: [session_duration_days, two_factor_enabled]
      properties:
        session_duration_days: { type: integer, minimum: 1, maximum: 365 }
        two_factor_enabled: { type: boolean }
    UpdateSecuritySettingsRequest:
      type: object
      required: [session_duration_days]
      properties:
        session_duration_days: { type: integer, minimum: 1, maximum: 365 }
    Session:
      type: object
      required: [id, created_at, last_used_at, is_current, location]
      properties:
        id: { type: string, format: uuid }
        device:
          type: [string, "null"]
          description: Sanitised user agent
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        is_current: { type: boolean }
        location:
          description: Approximate location of the device when it signed in or last refreshed its token; `null` when unknown.
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
    Location:
      type: object
      description: |
        Approximate location of a client address, looked up in an offline GeoIP database (IP geolocation by
        DB-IP, https://db-ip.com, CC BY 4.0). The address itself is never exposed. Each field is `null` when the
        database does not know it; clients localise the country name from `country_code`.
      required: [city, country_code, country]
      properties:
        city: { type: [string, "null"], description: City name in English }
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code
        country: { type: [string, "null"], description: Country name in English }
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string }
        otpauth_uri: { type: string }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    TwoFactorRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: One-time codes for signing in without the authenticator app. Shown only once.
    DisableTwoFactorRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128, writeOnly: true }
        code:
          type: string
          pattern: "^([0-9]{6}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{8})$"
          description: A code of the authenticator app, or an unused recovery code.
    Visibility:
      type: string
      description: |
        Who may see the item. The exception lists apply to every value.
        `contacts` are the users you share a direct chat with that you opened or read in, or a group you created,
        joined by accepting an invitation, or read or wrote in. Being added to a group alone does not make its
        members your contacts.
        Deprecated: `everyone_except` and `nobody_except` are still accepted and stored as `everyone` and `nobody`;
        they are never returned.
      enum: [everyone, contacts, everyone_except, nobody_except, nobody]
    DirectMessagePolicy:
      type: string
      description: |
        Who may open a direct chat with the user. `everyone`; `contacts` (see `Visibility`); `wait_approval`: others
        send a request the user approves; `nobody`: no new direct chats and no requests (existing chats stay).
        Allow exceptions still let the listed users in.
        Deprecated: `shared_chats` is the old name of `contacts`; it is still accepted and never returned.
      enum: [everyone, shared_chats, wait_approval, contacts, nobody]
    GroupInvitePolicy:
      type: string
      description: |
        Who may add the user to a group. Defaults to `contacts`. Deprecated: `everyone_except` and `nobody_except`
        are still accepted and stored as `everyone` and `nobody`; they are never returned.
      enum: [everyone, contacts, everyone_except, nobody_except, nobody, wait_approval]
    CallPolicy:
      type: string
      description: Who may ring the user (`contacts` as in `Visibility`).
      enum: [everyone, contacts, nobody]
    SearchVisibility:
      type: string
      enum: [everyone, nobody]
    VoiceVideoPolicy:
      type: string
      description: Who may send the user voice messages and videos in a direct chat. Groups are not affected.
      enum: [everyone, contacts]
    ForwardLinkPolicy:
      type: string
      description: Who sees the link to the user's account (`ForwardedFrom.sender_id`) on copies of their forwarded messages.
      enum: [everyone, contacts, nobody]
    PrivacyExceptions:
      type: object
      description: User IDs per setting. An exception wins over the setting whatever its value; `allow` always lets the user in, `deny` always keeps them out.
      additionalProperties:
        type: object
        required: [allow, deny]
        properties:
          allow:
            type: array
            items: { $ref: "#/components/schemas/Id" }
          deny:
            type: array
            items: { $ref: "#/components/schemas/Id" }
    PrivacySettings:
      type: object
      required:
        - avatar_visibility
        - profile_visibility
        - presence_visibility
        - last_seen_visibility
        - birthday_visibility
        - read_receipts_enabled
        - direct_messages
        - group_invites
        - search_visibility
        - calls_enabled
        - calls_from
        - typing_indicators_enabled
        - voice_video_messages
        - forward_link
        - web_profile_visibility
        - exceptions
      properties:
        avatar_visibility: { $ref: "#/components/schemas/Visibility" }
        profile_visibility: { $ref: "#/components/schemas/Visibility" }
        presence_visibility:
          description: Who sees that the user is online now (`User.is_online`, `presence` events).
          allOf: [{ $ref: "#/components/schemas/Visibility" }]
        last_seen_visibility:
          description: Who sees when the user was last online (`User.last_seen`, `presence` events).
          allOf: [{ $ref: "#/components/schemas/Visibility" }]
        birthday_visibility:
          description: Who sees the birthday (`User.birthday`) and gets a reminder on the day. Defaults to `contacts`.
          allOf: [{ $ref: "#/components/schemas/Visibility" }]
        read_receipts_enabled: { type: boolean }
        direct_messages: { $ref: "#/components/schemas/DirectMessagePolicy" }
        group_invites: { $ref: "#/components/schemas/GroupInvitePolicy" }
        search_visibility: { $ref: "#/components/schemas/SearchVisibility" }
        calls_enabled:
          type: boolean
          deprecated: true
          description: "`false` exactly when `calls_from` is `nobody`. Use `calls_from`."
        calls_from:
          description: |
            Who may ring this user, with the `calls_from` exceptions. Calls are only possible from an existing direct
            chat or a shared group. A direct call to a user who does not allow the caller is refused; in a group call
            only the members who allow the caller are rung, the others can still join.
          allOf: [{ $ref: "#/components/schemas/CallPolicy" }]
        typing_indicators_enabled:
          type: boolean
          description: Whether other members see that this user is typing or recording a voice message. The user still sees theirs.
        voice_video_messages:
          description: |
            Who may send this user voice messages, and file messages with a video, in a direct chat. Others get
            `403` (`forbidden`, field `voice_video_messages`); their `Chat.peer.can_send_voice_video` is `false`.
          allOf: [{ $ref: "#/components/schemas/VoiceVideoPolicy" }]
        forward_link:
          description: |
            Who sees `ForwardedFrom.sender_id` when this user's messages are forwarded. Others get `null`; the name
            stays.
          allOf: [{ $ref: "#/components/schemas/ForwardLinkPolicy" }]
        web_profile_visibility: { $ref: "#/components/schemas/WebProfileVisibility" }
        exceptions: { $ref: "#/components/schemas/PrivacyExceptions" }
    UpdatePrivacySettingsRequest:
      type: object
      minProperties: 1
      properties:
        avatar_visibility: { $ref: "#/components/schemas/Visibility" }
        profile_visibility: { $ref: "#/components/schemas/Visibility" }
        presence_visibility: { $ref: "#/components/schemas/Visibility" }
        last_seen_visibility: { $ref: "#/components/schemas/Visibility" }
        birthday_visibility: { $ref: "#/components/schemas/Visibility" }
        read_receipts_enabled: { type: boolean }
        direct_messages: { $ref: "#/components/schemas/DirectMessagePolicy" }
        group_invites: { $ref: "#/components/schemas/GroupInvitePolicy" }
        search_visibility: { $ref: "#/components/schemas/SearchVisibility" }
        calls_enabled:
          type: boolean
          deprecated: true
          description: "`false` sets `calls_from` to `nobody`; `true` sets it to `everyone` when it was `nobody`. Ignored when `calls_from` is sent."
        calls_from: { $ref: "#/components/schemas/CallPolicy" }
        typing_indicators_enabled: { type: boolean }
        voice_video_messages: { $ref: "#/components/schemas/VoiceVideoPolicy" }
        forward_link: { $ref: "#/components/schemas/ForwardLinkPolicy" }
        web_profile_visibility: { $ref: "#/components/schemas/WebProfileVisibility" }
    PrivacyExceptionsRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Id" }

    # ----------------------------------------------------------- users
    User:
      type: object
      description: A user as visible to the requesting user; hidden fields are `null`.
      required: [id, username, display_name, avatar_url, bio, pronouns, birthday, music, background, is_online, last_seen, is_deleted, profile_version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profile_version:
          type: integer
          minimum: 0
          description: |
            Grows whenever the username, display name, bio, avatar, pronouns, birthday, profile music or profile
            background changes (not with presence). Clients keep a stored profile until a higher version arrives.
        pronouns:
          type: [string, "null"]
          maxLength: 40
          description: Free text such as "she/her". Visible like the bio (`profile_visibility`).
        birthday:
          description: Visible by `birthday_visibility`; `null` when not set or hidden.
          oneOf:
            - $ref: "#/components/schemas/Birthday"
            - type: "null"
        music:
          description: A short song on the profile, visible like the bio. Clients never play it on their own.
          oneOf:
            - $ref: "#/components/schemas/ProfileMusic"
            - type: "null"
        background:
          description: The banner and page background of the profile, visible like the bio.
          oneOf:
            - $ref: "#/components/schemas/ProfileBackground"
            - type: "null"
        username: { $ref: "#/components/schemas/Username" }
        display_name: { type: string }
        contact_name:
          type: [string, "null"]
          description: The requesting user's own name for this user, if set.
        avatar_url:
          type: [string, "null"]
          description: Path of the avatar, always same-origin (`/api/v2/users/{id}/avatar?rev={revision}`).
        bio: { type: [string, "null"] }
        is_online: { type: boolean }
        last_seen:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        is_deleted: { type: boolean }
        can_send_voice_video:
          type: boolean
          description: |
            Only on `Chat.peer` of a direct chat: whether the requesting user may send this user voice messages and
            videos (their `voice_video_messages` setting and exceptions). Absent everywhere else.
        account_label:
          allOf: [{ $ref: "#/components/schemas/AccountLabel" }]
          description: |
            `restricted` when the account is suspended by its automatic account status; clients show "Restricted
            account". Absent otherwise.
    AccountLabel:
      type: string
      enum: [restricted]
    ReportReason:
      type: string
      enum: [spam, scam, harassment, impersonation, inappropriate_profile, other]
    ReportUserRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ReportReason" }
        note:
          type: [string, "null"]
          maxLength: 500
          description: Optional details for the report. Never shown to the reported user.
        block:
          type: boolean
          default: true
          description: Also block the user.
      additionalProperties: false
    ContentReportReason:
      type: string
      description: The reasons of `ReportReason` plus `illegal`, a notice of illegal content.
      enum: [spam, scam, harassment, impersonation, inappropriate_profile, illegal, other]
    ContentReportRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ContentReportReason" }
        note:
          type: [string, "null"]
          maxLength: 1000
          description: |
            Details for moderation, never shown to the sender or the group. Required for `illegal`: why the content is
            illegal, for example which law it breaks.
      additionalProperties: false
    ModerationRemovalReason:
      type: object
      description: Why moderation removed something, shown only to its author.
      required: [code, text]
      properties:
        code: { $ref: "#/components/schemas/ModerationReason" }
        text:
          type: string
          maxLength: 1000
          description: |
            A short explanation written by moderation; may be empty. Show it as written by "Messenger moderation",
            never by a person's name.
    AccountStatusLevel:
      type: string
      description: |
        `good` no restrictions, `warned` no restrictions yet, `limited` no new contact with non-contacts and at most 5
        new direct chats a day, `restricted` also no groups, uploads, forwarded files, profile changes or sticker
        and emoji packs and hidden from search, `suspended` read-only (no sending, joining calls or managing groups).
        Unknown values must be treated like `restricted`.
      enum: [good, warned, limited, restricted, suspended]
    AccountRestriction:
      type: string
      description: An action the account status blocks. Unknown values must be shown as a generic restriction.
      enum: [start_direct, invite_to_group, call, create_group, upload, forward, edit_profile, publish_pack, search, send, manage_group, share_group, join_by_link]
    AccountStatus:
      type: object
      required: [status, since, restrictions, can_appeal, probation_until, review_requested_at, can_request_review]
      properties:
        status: { $ref: "#/components/schemas/AccountStatusLevel" }
        since:
          description: When the account reached this status; `null` when it never changed.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        restrictions:
          type: array
          items: { $ref: "#/components/schemas/AccountRestriction" }
        can_appeal: { type: boolean }
        probation_until:
          description: End of the running probation after an appeal; `null` when none runs.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        decided_by:
          $ref: "#/components/schemas/AccountStatusDecidedBy"
        reason_code:
          description: The guideline rule a person on the moderation team named; `null` for automatic statuses.
          oneOf:
            - $ref: "#/components/schemas/ModerationReason"
            - type: "null"
        reason_text:
          type: [string, "null"]
          maxLength: 1000
          description: |
            The explanation written for the user by the moderation team; `null` for automatic statuses. Show it as
            written by "Messenger moderation", never by a person's name.
        review_requested_at:
          description: |
            When the open request for a review by a person (`POST /me/account-status/review`) was made; `null` when
            none is open.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        can_request_review:
          type: boolean
          description: Whether `POST /me/account-status/review` is allowed now.
    AccountReviewRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: What the user wants the reviewer to know. Trimmed; must not be empty.
    AccountStatusDecidedBy:
      type: string
      description: |
        Who set the current status: `automatic` (reports, decay, appeal) or `staff` (reviewed by a person on the
        moderation team). Missing means `automatic`. Unknown values must be treated like `automatic`.
      enum: [automatic, staff]
    ModerationReason:
      type: string
      description: The guideline rule behind a moderation decision. Unknown values must be shown as `other`.
      enum: [spam, scam, harassment, impersonation, inappropriate_profile, illegal, other]
    ReportOutcomeKind:
      type: string
      description: |
        `action_taken` the moderation team acted on the report, `no_violation` it found no violation. Unknown values
        must be shown as a generic "your report was reviewed".
      enum: [action_taken, no_violation]
    ReportSubjectType:
      type: string
      description: What was reported. Unknown values must be shown without the subject.
      enum: [user, sticker_pack, emoji_pack]
    ReportOutcome:
      type: object
      required: [id, subject_type, subject_id, outcome, created_at, read]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        subject_type: { $ref: "#/components/schemas/ReportSubjectType" }
        subject_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: The reported user, sticker pack or emoji pack.
        outcome: { $ref: "#/components/schemas/ReportOutcomeKind" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        read: { type: boolean }
    ReportOutcomeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportOutcome" }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [created_at, time_zone, terms_version, terms_accepted_at]
          properties:
            created_at: { $ref: "#/components/schemas/Timestamp" }
            recovery_setup_required: { type: boolean }
            time_zone:
              allOf: [{ $ref: "#/components/schemas/TimeZone" }]
              description: The user's time zone; birthday reminders arrive at 09:00 in it. `UTC` until a client sets it.
            terms_version:
              type: [string, "null"]
              description: The version of the Terms of Use accepted at registration; `null` when none was recorded.
            terms_accepted_at:
              type: [string, "null"]
              format: date-time
              description: When the Terms of Use were accepted; `null` when no acceptance was recorded.
    TimeZone:
      type: string
      minLength: 1
      maxLength: 64
      description: An IANA time zone name such as `Europe/Berlin`.
      examples: [Europe/Berlin]
    Birthday:
      type: object
      required: [day, month, year]
      properties:
        day: { type: integer, minimum: 1, maximum: 31 }
        month: { type: integer, minimum: 1, maximum: 12 }
        year:
          type: [integer, "null"]
          minimum: 1900
          maximum: 2100
          description: Optional; `null` when the user keeps the year to themselves.
    ProfileMusic:
      type: object
      required: [attachment, title, artist]
      properties:
        attachment:
          allOf: [{ $ref: "#/components/schemas/Attachment" }]
          description: The clip (at most 30 s). `thumbnail_url` is the cover when the file had one.
        title: { type: [string, "null"], maxLength: 100 }
        artist: { type: [string, "null"], maxLength: 100 }
    ProfileBackgroundKind:
      type: string
      description: |
        `media` an uploaded image, GIF or short video (`attachment`), `preset` one of the clients' built-in
        gradients (`preset`), `color` one color or a gradient of two (`colors`).
      enum: [media, preset, color]
    BackgroundPreset:
      type: string
      pattern: "^[a-z0-9_-]{1,32}$"
      description: Name of a built-in gradient. Clients show their default background for a name they do not know.
    BackgroundColor:
      type: string
      pattern: "^#[0-9a-f]{6}$"
      examples: ["#3366ff"]
    ProfileBackground:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ProfileBackgroundKind" }
        attachment:
          allOf: [{ $ref: "#/components/schemas/Attachment" }]
          description: |
            Set for `media`. An image, an animated GIF or a muted video of at most 15 s; `thumbnail_url` is a still
            frame to show while it loads and when the viewer prefers reduced motion.
        preset: { $ref: "#/components/schemas/BackgroundPreset" }
        colors:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/BackgroundColor" }
    AppearanceSettings:
      type: object
      description: |
        The look of the app shared by the user's devices. A device may keep its own value for any field ("only on
        this device"); that choice is stored on the device, not here.
      required: [accent, font_size, density, corners]
      properties:
        accent:
          type: string
          pattern: "^[a-z0-9_-]{1,32}$"
          description: Name of a client accent color. Clients use their default for a name they do not know.
        font_size: { type: integer, minimum: 14, maximum: 20 }
        density: { type: string, enum: [comfortable, compact] }
        corners: { type: string, enum: [sharp, default, round] }
    RecentEmoji:
      type: string
      minLength: 1
      maxLength: 100
      description: A Unicode emoji or a custom emoji token, exactly as the client inserts it.
    ClientSettings:
      type: object
      required: [appearance, recent_emoji, recent_reactions, version, updated_at]
      properties:
        appearance:
          oneOf:
            - $ref: "#/components/schemas/AppearanceSettings"
            - type: "null"
        recent_emoji:
          type: array
          maxItems: 24
          description: Newest first.
          items: { $ref: "#/components/schemas/RecentEmoji" }
        recent_reactions:
          type: array
          maxItems: 8
          description: Newest first.
          items: { $ref: "#/components/schemas/RecentEmoji" }
        version:
          type: integer
          format: int64
          minimum: 0
          description: Goes up on every change; `0` when nothing was saved yet.
        updated_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    UpdateClientSettingsRequest:
      type: object
      minProperties: 1
      description: Only the parts to replace. Duplicates in the lists are dropped, keeping the first.
      properties:
        appearance: { $ref: "#/components/schemas/AppearanceSettings" }
        recent_emoji:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/RecentEmoji" }
        recent_reactions:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/RecentEmoji" }
    WallpaperPattern:
      type: string
      description: Dots or a grid drawn over a `color` background.
      enum: [none, dots, grid]
    Wallpaper:
      type: object
      description: |
        `preset` a built-in background of the clients (`preset`), `color` one color or a gradient of two (`colors`,
        optional `pattern`), `media` an uploaded photo (`attachment`) with `blur` in px and `dim` in percent. A `media`
        background without `dim` is dimmed automatically by the client (20 % in a dark theme, none in a light one).
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ProfileBackgroundKind" }
        preset: { $ref: "#/components/schemas/BackgroundPreset" }
        colors:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/BackgroundColor" }
        pattern: { $ref: "#/components/schemas/WallpaperPattern" }
        attachment: { $ref: "#/components/schemas/Attachment" }
        blur: { type: integer, minimum: 0, maximum: 20 }
        dim: { type: integer, minimum: 0, maximum: 60 }
    SetWallpaperRequest:
      type: object
      required: [kind]
      description: |
        `preset` needs `preset`; `color` needs `colors` and may have `pattern`; `media` needs `attachment_id` (an
        upload of the caller with purpose `chat_wallpaper`) and may have `blur` (default `0`) and `dim` (absent:
        automatic, see `Wallpaper`). Other fields must be absent (`422` otherwise).
      properties:
        kind: { $ref: "#/components/schemas/ProfileBackgroundKind" }
        preset: { $ref: "#/components/schemas/BackgroundPreset" }
        colors:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/BackgroundColor" }
        pattern: { $ref: "#/components/schemas/WallpaperPattern" }
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        blur: { type: integer, minimum: 0, maximum: 20 }
        dim: { type: integer, minimum: 0, maximum: 60 }
    SetChatWallpaperRequest:
      allOf:
        - $ref: "#/components/schemas/SetWallpaperRequest"
        - type: object
          properties:
            for_both:
              type: boolean
              default: false
              description: Direct chats with another person only. Also sets it as the other person's background.
    WallpaperEntry:
      type: object
      required: [chat_id, wallpaper, set_by, updated_at]
      properties:
        chat_id:
          description: The chat, or `null` for the default of all chats.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        wallpaper: { $ref: "#/components/schemas/Wallpaper" }
        set_by:
          description: Who set it; the other person when they used `for_both`.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    WallpaperList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WallpaperEntry" }
    PlaylistName:
      type: string
      minLength: 1
      maxLength: 60
      description: Trimmed by the server; empty after trimming is `422`.
    PlaylistSummary:
      type: object
      required: [id, name, track_count, version, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        track_count: { type: integer, minimum: 0, maximum: 1000 }
        version:
          type: integer
          format: int64
          minimum: 1
          description: Goes up on every change of the name or the tracks.
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    PlaylistTrack:
      type: object
      required: [attachment_id, title, available]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        attachment:
          description: Set only when `available`.
          allOf: [{ $ref: "#/components/schemas/Attachment" }]
        available:
          type: boolean
          description: |
            `false` when the caller can no longer open the file (left the chat, the message was deleted). Clients show
            the track greyed out; the server does not serve it.
        chat_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        artist: { type: string }
        duration_seconds: { type: number, minimum: 0 }
    Playlist:
      allOf:
        - $ref: "#/components/schemas/PlaylistSummary"
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              maxItems: 1000
              items: { $ref: "#/components/schemas/PlaylistTrack" }
    PlaylistList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/PlaylistSummary" }
    PlaylistTrackInput:
      type: object
      required: [attachment_id, title]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        chat_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        title: { type: string, minLength: 1, maxLength: 200 }
        artist: { type: string, maxLength: 200 }
        duration_seconds: { type: number, minimum: 0, maximum: 86400 }
    CreatePlaylistRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/PlaylistName" }
        tracks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PlaylistTrackInput" }
    RenamePlaylistRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/PlaylistName" }
    ReplacePlaylistTracksRequest:
      type: object
      required: [version, tracks]
      properties:
        version: { type: integer, format: int64, minimum: 1 }
        tracks:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/PlaylistTrackInput" }
    SetBackgroundRequest:
      type: object
      required: [kind]
      description: |
        `media` needs `attachment_id` (uploaded with purpose `profile_background`), `preset` needs `preset`, `color`
        needs `colors`; other fields must be absent (`422` otherwise).
      properties:
        kind: { $ref: "#/components/schemas/ProfileBackgroundKind" }
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        preset: { $ref: "#/components/schemas/BackgroundPreset" }
        colors:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/BackgroundColor" }
    SetMusicRequest:
      type: object
      required: [attachment_id]
      properties:
        attachment_id:
          allOf: [{ $ref: "#/components/schemas/AttachmentRef" }]
          description: An upload of the caller with purpose `profile_music`.
        title:
          type: [string, "null"]
          maxLength: 100
          description: Shown title. Clients fill it in from `Attachment.tags` of the upload and let the user edit it.
        artist:
          type: [string, "null"]
          maxLength: 100
          description: Shown artist, filled in the same way.
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    AvatarVersion:
      type: object
      required: [id, url, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        url: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ContactNameRequest:
      type: object
      required: [contact_name]
      properties:
        contact_name: { type: string, minLength: 1, maxLength: 64 }

    # ----------------------------------------------------- attachments
    AttachmentKind:
      type: string
      enum: [image, audio, voice, video, file]
    UploadPurpose:
      type: string
      description: |
        `message`: an animated WebP keeps its frames (at most 300); the server removes its metadata and checks every
        frame. `avatar` and `profile_background` take only still WebP (`415` otherwise).

        `sticker`: a PNG, JPEG or still WebP of at most 5 MB. The server fits it into 512 x 512 px with a transparent
        border and stores a WebP (`413` when that is still over 512 KB). Only its uploader can load it until it is
        added to a pack.

        A sticker can also be made from a video (`kind: video`: MP4, WebM or MOV), an animated GIF or an animated WebP
        of at most 15 MB. The server keeps at most 3 s of it (from `start_ms` to `end_ms`, or the first 3 s), crops it to the square
        `crop_x`, `crop_y`, `crop_size` when given (otherwise it fits the clip into the square with a transparent
        border), drops the sound and stores a looping animated WebP of at most 512 x 512 px (`413` when it is still
        over 1 MB at the lowest quality). The sticker then has `is_animated: true`.

        `profile_music`: an audio file of at most 20 MB. The server keeps at most 30 s of it (from `start_ms` to
        `end_ms`, or the first 30 s), stored as AAC, reads the title and artist into `tags` and the embedded cover
        into `thumbnail_url`. Use it with `PUT /me/music`.

        `profile_background`: an image (10 MB), an animated GIF (15 MB) or a video of at most 15 s (15 MB). Use it
        with `PUT /me/background` or `PUT /groups/{chat_id}/background`.

        `emoji`: a PNG, JPEG, still WebP or GIF of at most 8 MB. The server scales it into 128 x 128 px (a GIF frame
        by frame) and refuses it with `413` when the result is still over 256 KB. Use it with
        `POST /emoji/packs/{pack_id}/emoji`.

        `chat_wallpaper`: a still image (JPEG, PNG, WebP or HEIC) of at most 10 MB; no GIF or video. Use it with
        `PUT /me/wallpapers/default` or `PUT /chats/{chat_id}/wallpaper`. Its uploader can load it, and the other
        person of a direct chat once it was set there for both.
      enum: [message, avatar, sticker, profile_music, profile_background, emoji, chat_wallpaper]
    UploadAttachmentRequest:
      type: object
      required: [file, purpose]
      properties:
        file:
          type: string
          format: binary
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        kind: { $ref: "#/components/schemas/AttachmentKind" }
        duration_ms:
          type: integer
          minimum: 0
          description: Length of a voice message
        waveform:
          type: array
          description: Amplitude samples (0-255) of a voice message
          maxItems: 128
          items: { type: integer, minimum: 0, maximum: 255 }
        start_ms:
          type: integer
          minimum: 0
          description: "`profile_music`, and `sticker` from a video or GIF: where the kept part starts."
        end_ms:
          type: integer
          minimum: 1
          description: |
            `profile_music`: where the kept part ends, at most 30 s after `start_ms`. `sticker` from a video or GIF: at
            most 3 s after `start_ms`.
        crop_x:
          type: number
          minimum: 0
          maximum: 1
          description: "`sticker` from a video or GIF: left edge of the square crop, as a fraction of the width."
        crop_y:
          type: number
          minimum: 0
          maximum: 1
          description: "`sticker` from a video or GIF: top edge of the square crop, as a fraction of the height."
        crop_size:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: |
            `sticker` from a video or GIF: side of the square crop, as a fraction of the shorter side. Send all three
            crop fields or none; the square must lie inside the frame.
    Attachment:
      type: object
      required: [id, kind, filename, content_type, size, url]
      properties:
        id: { $ref: "#/components/schemas/AttachmentRef" }
        kind: { $ref: "#/components/schemas/AttachmentKind" }
        filename: { type: string }
        content_type:
          type: string
          description: Detected by the server
        size:
          type: integer
          minimum: 0
          description: Bytes
        url:
          type: string
          description: Same-origin path (`/api/v2/attachments/{id}/content`) set by the server.
          readOnly: true
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        thumbnail_url:
          type: [string, "null"]
          readOnly: true
          description: A WebP of at most 480 px (older uploads a JPEG of at most 320 px); for audio the embedded cover.
        display_url:
          type: [string, "null"]
          readOnly: true
          description: At most 1600 px to show in an image viewer instead of the original; `null` for small images and GIFs, which are shown as they are.
        placeholder:
          type: [string, "null"]
          maxLength: 64
          readOnly: true
          description: A ThumbHash (base64) of the image or video poster, to draw a blurred preview before the thumbnail arrives.
        processing:
          readOnly: true
          description: |
            Whether the server is still making an optimized copy of a video, GIF or audio file. Clients play `url`
            meanwhile and swap to the new copy on `attachment_updated`. `null` when there is nothing to do.
          oneOf:
            - $ref: "#/components/schemas/MediaProcessing"
            - type: "null"
        source_url:
          type: [string, "null"]
          readOnly: true
          description: The file as uploaded, when `url` serves an optimized copy; `null` otherwise.
        animation_url:
          type: [string, "null"]
          readOnly: true
          description: A GIF as a muted, looping MP4, much smaller than the GIF; `null` until made or for other files.
        panel_url:
          type: [string, "null"]
          readOnly: true
          description: Stickers only; a still 128 px WebP for pickers and lists.
        message_url:
          type: [string, "null"]
          readOnly: true
          description: Stickers only; a 320 px WebP for messages.
        duration_ms: { type: [integer, "null"], minimum: 0 }
        waveform:
          type: [array, "null"]
          items: { type: integer, minimum: 0, maximum: 255 }
        tags:
          description: Audio files (not voice messages) and `profile_music` uploads; what the file says about itself.
          $ref: "#/components/schemas/AudioTags"
        drawing:
          description: |
            What the sender drew on this image of this message. Clients show the image with the drawing on top
            and never without it. Absent when the image has no drawing. The same image can carry another drawing
            in another message.
          $ref: "#/components/schemas/Drawing"
    AudioTags:
      type: object
      required: [title, artist]
      properties:
        title: { type: [string, "null"], maxLength: 100 }
        artist: { type: [string, "null"], maxLength: 100 }
        album: { type: [string, "null"], maxLength: 100 }
    MediaProcessing:
      type: string
      enum: [queued, running, done, failed]
    PlaybackUrl:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: Same-origin path with the playback token; set it as `src` of a media element.
        expires_at: { type: string, format: date-time }
    CreateUploadSessionRequest:
      type: object
      required: [purpose, filename, size]
      additionalProperties: false
      properties:
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        kind:
          type: string
          enum: [image, audio, video, file]
        filename: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          format: int64
          minimum: 1
          description: Bytes of the whole file; at most the upload limit of its kind.
    UploadSession:
      type: object
      required: [id, size, chunk_size, received, expires_at]
      properties:
        id: { type: string, format: uuid }
        size: { type: integer, format: int64 }
        chunk_size: { type: integer, description: Bytes per chunk (8 MiB). }
        received: { type: integer, format: int64, description: Bytes stored so far; the next `offset`. }
        expires_at:
          type: string
          format: date-time
          description: When the session is deleted unless more chunks arrive.
    Drawing:
      type: object
      description: |
        Strokes and text labels on an image. Coordinates, widths and sizes are fractions of the image as it is
        shown (0 is the left or top edge, 1 the right or bottom edge), so the drawing fits any display size.
        Items are drawn in order. The server rounds numbers to four decimals.
      required: [version, items]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1, maximum: 1 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/DrawingItem" }
    DrawingItem:
      type: object
      required: [type, color]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [stroke, text]
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        width:
          type: number
          format: double
          minimum: 0.001
          maximum: 0.2
          description: Stroke only. Line width as a fraction of the image width.
        points:
          type: array
          minItems: 2
          maxItems: 10000
          description: Stroke only. Flat list of x, y pairs. A drawing has at most 10000 numbers in all its strokes.
          items: { type: number, format: double, minimum: 0, maximum: 1 }
        x: { type: number, format: double, minimum: 0, maximum: 1, description: Text only. Left edge of the label. }
        y: { type: number, format: double, minimum: 0, maximum: 1, description: Text only. Top edge of the label. }
        size:
          type: number
          format: double
          minimum: 0.01
          maximum: 0.5
          description: Text only. Font height as a fraction of the image height.
        text: { type: string, minLength: 1, maxLength: 200, description: Text only. }
      if:
        properties:
          type: { const: stroke }
      then:
        required: [width, points]
        properties:
          width: { type: number }
          points: { type: array }
          x: { not: {} }
          y: { not: {} }
          size: { not: {} }
          text: { not: {} }
      else:
        required: [x, y, size, text]
        properties:
          x: { type: number }
          y: { type: number }
          size: { type: number }
          text: { type: string }
          width: { not: {} }
          points: { not: {} }
    AttachmentDrawing:
      type: object
      required: [attachment_id, drawing]
      additionalProperties: false
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        drawing: { $ref: "#/components/schemas/Drawing" }
    MediaKind:
      type: string
      description: |
        `image` photos, `visual` photos and videos, `audio` audio files and voice messages, `voice` voice messages only,
        `file` other files (documents, archives), `link` messages whose text or caption contains a web link.
      enum: [image, audio, visual, file, voice, link]

    # -------------------------------------------------------- messages
    MessageType:
      type: string
      description: |
        `poll`, `contact` and `location` carry their data in `Message.poll`, `Message.contact` and
        `Message.location`. For older clients their `content` holds a short plain-text summary: `📊 <question>`,
        `👤 @<username>`, or `📍 <place name> <OpenStreetMap link>`.
      enum: [text, file, voice, system, sticker, poll, contact, location]
    Sticker:
      type: object
      description: |
        One sticker of a pack. `image` is a WebP or PNG of at most 512 x 512 px with transparency, animated when
        `is_animated` is true (also stickers made from a video or GIF); any signed-in user can load it. The `panel`
        variant of an animated sticker is a still first frame. Clients show it without a bubble.
      required: [id, pack_id, emoji, is_animated, image]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        pack_id: { $ref: "#/components/schemas/Id" }
        pack_slug:
          allOf: [{ $ref: "#/components/schemas/StickerPackSlug" }]
          description: |
            The share link of the sticker's pack when a user made it; missing for built-in packs. A client that
            shows the pack of a sticker someone sent opens it with `GET /stickers/links/{slug}`.
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: The emoji the sticker stands for, for previews, notifications and search.
        is_animated: { type: boolean }
        image: { $ref: "#/components/schemas/Attachment" }
    StickerPackSlug:
      type: string
      pattern: "^[A-Za-z0-9]{8,32}$"
    StickerPack:
      type: object
      required: [id, title, is_official, is_installed, is_mine, is_hidden, stickers, version]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        version:
          type: integer
          minimum: 0
          description: Grows whenever the title or the stickers of the pack change.
        title: { type: string, minLength: 1, maxLength: 64 }
        is_official:
          type: boolean
          description: A built-in pack of the messenger, not made by a user.
        is_installed:
          type: boolean
          description: The pack is in the user's sticker panel.
        is_mine:
          type: boolean
          description: The user made the pack and may change it.
        is_hidden:
          type: boolean
          description: Hidden after reports; only the owner sees such a pack, and nobody can send from it.
        owner_id: { $ref: "#/components/schemas/Id" }
        slug:
          allOf: [{ $ref: "#/components/schemas/StickerPackSlug" }]
          description: The share link of a pack a user made; missing for built-in packs.
        stickers:
          type: array
          maxItems: 120
          items: { $ref: "#/components/schemas/Sticker" }
    StickerPackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/StickerPack" }
    CreateStickerPackRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 64 }
    UpdateStickerPackRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 64 }
    AddStickerRequest:
      type: object
      additionalProperties: false
      required: [attachment_id, emoji]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        emoji: { type: string, minLength: 1, maxLength: 32 }
    UpdateStickerRequest:
      type: object
      additionalProperties: false
      required: [emoji]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32 }
    ReorderStickersRequest:
      type: object
      additionalProperties: false
      required: [sticker_ids]
      properties:
        sticker_ids:
          type: array
          maxItems: 120
          items: { $ref: "#/components/schemas/Id" }
    CustomEmoji:
      type: object
      description: |
        A custom emoji. In text it is written as the token `<:shortcode:id>` (`<a:shortcode:id>` when animated) and
        drawn with `GET /emoji/items/{id}/image`; in reactions as `c:<id>`.
      required: [id, pack_id, shortcode, is_animated, url]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        pack_id: { $ref: "#/components/schemas/Id" }
        shortcode: { $ref: "#/components/schemas/EmojiShortcode" }
        is_animated: { type: boolean }
        url:
          type: string
          description: Same-origin path of the image (`/api/v2/emoji/items/{id}/image`).
        pack_slug:
          allOf: [{ $ref: "#/components/schemas/StickerPackSlug" }]
          description: The share link of the emoji's pack; missing for group emoji.
    EmojiShortcode:
      type: string
      pattern: "^[a-z0-9_]{2,32}$"
    EmojiPack:
      type: object
      required: [id, title, version, is_mine, is_installed, is_hidden, can_edit, emoji]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        title: { type: string, minLength: 1, maxLength: 64 }
        version:
          type: integer
          minimum: 0
          description: Grows whenever the title or the emoji of the pack change.
        slug:
          allOf: [{ $ref: "#/components/schemas/StickerPackSlug" }]
          description: The share link; missing for group emoji.
        chat_id:
          allOf: [{ $ref: "#/components/schemas/Id" }]
          description: Set for the group emoji of that group.
        owner_id: { $ref: "#/components/schemas/Id" }
        is_mine: { type: boolean }
        is_installed: { type: boolean }
        is_hidden:
          type: boolean
          description: Hidden after reports; only the owner sees and uses it.
        can_edit:
          type: boolean
          description: The user may add, rename and remove emoji (owner of the pack, or owner or admin of the group).
        emoji:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CustomEmoji" }
    EmojiPackList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EmojiPack" }
    EmojiPackTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 64 }
    AddCustomEmojiRequest:
      type: object
      additionalProperties: false
      required: [attachment_id, shortcode]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
        shortcode: { $ref: "#/components/schemas/EmojiShortcode" }
    UpdateCustomEmojiRequest:
      type: object
      additionalProperties: false
      required: [shortcode]
      properties:
        shortcode: { $ref: "#/components/schemas/EmojiShortcode" }
    StickerPackReportReason:
      type: string
      enum: [spam, violence, sexual, hate, copyright, other]
    ReportStickerPackRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/StickerPackReportReason" }
    StickerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Sticker" }
    Reaction:
      type: object
      required: [emoji, user_id]
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 32
          description: A Unicode emoji, or `c:<id>` for a custom emoji (`GET /emoji/items/{id}/image`).
        user_id: { $ref: "#/components/schemas/Id" }
    ReadReceipt:
      type: object
      required: [user_id, read_at]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        read_at: { $ref: "#/components/schemas/Timestamp" }
    ForwardedFrom:
      type: object
      required: [message_id, sender_id, sender_name]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        sender_id:
          description: |
            The original sender; `null` when their account is gone or their `forward_link` setting hides it from the
            requesting user. Clients then show `sender_name` as plain text, not as a link to a profile.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        sender_name: { type: string }
    ReplyPreview:
      type: object
      description: |
        What a reply shows of the message it answers, so a client can draw the quote without loading that
        message. Set on messages of history pages and `message` events when the recipient can see the answered
        message; absent when it is gone or hidden for them, and on chat-list previews and search results.
      required: [id, type, sender, content, attachment, is_deleted]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/MessageType" }
        sender:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        content:
          type: [string, "null"]
          maxLength: 100
          description: The first 100 characters of the text or caption; `null` when deleted or empty.
        attachment:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        is_deleted: { type: boolean }
        removed_by_moderation:
          type: boolean
          description: "`true` when moderation removed the answered message. Absent otherwise."
    SyncChangesPage:
      type: object
      required: [changes, next_cursor, has_more, reset_required]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/SyncChange" }
        next_cursor:
          type: string
          description: Send as `cursor` next time
        has_more:
          type: boolean
          description: More changes are waiting; ask again at once
        reset_required:
          type: boolean
          description: The cursor is too old; drop the stored messages and load them again
    SyncChange:
      type: object
      required: [type, chat_id]
      description: |
        `message_updated` carries the message as the caller sees it now (`message`). `message_deleted` names the
        message and its `scope`. `pins_changed`: load the pins of the chat again. `history_cleared`: drop the
        messages up to and including `before_message_id` (`scope` says for whom). `chat_hidden`: the caller
        deleted the chat for themselves up to `before_message_id`.
        `history_imported`: an imported history was added, removed or a sender confirmed; load the chat again.
      properties:
        type:
          type: string
          enum: [message_updated, message_deleted, pins_changed, history_cleared, chat_hidden, history_imported]
        chat_id: { $ref: "#/components/schemas/Id" }
        message_id: { $ref: "#/components/schemas/Id" }
        scope:
          type: string
          enum: [me, everyone]
        before_message_id: { $ref: "#/components/schemas/Id" }
        message: { $ref: "#/components/schemas/Message" }
    StorageKey:
      type: object
      required: [key, algorithm]
      properties:
        key:
          type: string
          description: 32 random bytes, base64url without padding
          pattern: "^[A-Za-z0-9_-]{43}$"
        algorithm:
          type: string
          enum: [A256GCM]
    Message:
      type: object
      required:
        - id
        - chat_id
        - type
        - sender
        - content
        - attachment
        - reply_to
        - forwarded_from
        - reactions
        - read_by
        - created_at
        - edited_at
        - is_deleted
      properties:
        id: { $ref: "#/components/schemas/Id" }
        chat_id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/MessageType" }
        sender:
          description: "`null` for system messages."
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        content:
          type: [string, "null"]
          maxLength: 4096
          description: |
            Text, the caption of a file, the emoji of a sticker, or the plain-text summary of a poll, contact or
            location (see `MessageType`); `null` when deleted.
        attachment:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        reply_preview:
          $ref: "#/components/schemas/ReplyPreview"
        forwarded_from:
          oneOf:
            - $ref: "#/components/schemas/ForwardedFrom"
            - type: "null"
        sticker:
          description: |
            The sticker of a `sticker` message; absent for other types and when deleted. `attachment` carries the
            same image, so older clients show a sticker as a picture.
          $ref: "#/components/schemas/Sticker"
        attachments:
          type: array
          description: Ordered images and videos of an album. The first item is also returned as attachment for older clients.
          minItems: 2
          maxItems: 10
          items: { $ref: "#/components/schemas/Attachment" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }
        read_by:
          type: array
          items: { $ref: "#/components/schemas/ReadReceipt" }
        created_at: 
          description: When the message was sent; for an imported message, when it was sent in the other messenger.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        edited_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        is_deleted: { type: boolean }
        import:
          $ref: "#/components/schemas/MessageImport"
        removed_by_moderation:
          type: boolean
          description: |
            `true` when moderation removed the message; it is then also `is_deleted`. Clients show "Removed by
            moderation" instead of the deleted placeholder. Absent otherwise.
        moderation_reason:
          allOf: [{ $ref: "#/components/schemas/ModerationRemovalReason" }]
          description: Why moderation removed the message; only for its sender, absent for everyone else.
        system_event:
          $ref: "#/components/schemas/SystemEvent"
        client_temp_id: { $ref: "#/components/schemas/ClientTempId" }
        mentions:
          type: array
          description: |
            Group members the text mentions by `@username` (ignoring case), found by the server when the message was
            sent or last edited; at most 20. Absent when there are none and in direct chats. Clients render every
            `@name` token as a link to `/@name`; these IDs only decide highlighting and notifications.
          maxItems: 20
          items: { $ref: "#/components/schemas/Id" }
        mentions_all:
          type: boolean
          description: "`true` when an owner or admin wrote `@all`; it mentions every member. Absent otherwise."
        poll:
          description: The poll of a `poll` message as the requesting user sees it; absent for other types, when deleted and in chat-list previews.
          $ref: "#/components/schemas/Poll"
        contact:
          description: The shared user of a `contact` message; absent for other types, when deleted and in chat-list previews.
          $ref: "#/components/schemas/ContactCard"
        location:
          description: The place of a `location` message; absent for other types and when deleted.
          $ref: "#/components/schemas/MessageLocation"
    PollCreate:
      type: object
      description: |
        A new poll. Option texts are trimmed and must differ (ignoring case). `quiz` makes it a quiz: one correct
        option, one answer per voter that cannot be changed; it cannot be combined with `multiple_answers`.
        `close_at` closes the poll automatically, 5 minutes to 30 days from now.
      required: [question, options]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 300 }
        options:
          type: array
          minItems: 2
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 100 }
        multiple_answers: { type: boolean, default: false }
        anonymous:
          type: boolean
          default: true
          description: |
            `false` lets everyone who sees the results list who voted for what. Anonymous votes are still stored
            with the voter, so each member votes once and can change the vote, but no one else sees them.
        quiz: { $ref: "#/components/schemas/PollQuizCreate" }
        close_at: { $ref: "#/components/schemas/Timestamp" }
    PollQuizCreate:
      type: object
      required: [correct_option]
      additionalProperties: false
      properties:
        correct_option:
          type: integer
          minimum: 0
          maximum: 9
          description: Index into `options`
        explanation: { type: string, minLength: 1, maxLength: 200 }
    Poll:
      type: object
      description: |
        A poll as the requesting user sees it. Results (`voter_count`, `total_voters`, `is_correct`, `explanation`)
        are `null` or absent until that user voted, unless they created the poll or it is closed. A poll is closed
        when `closed_at` is set; clients also treat it as closed once `close_at` has passed.
      required: [question, options, multiple_answers, anonymous, quiz, explanation, close_at, closed_at, total_voters, my_votes, can_close, version]
      properties:
        question: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/PollOption" }
        multiple_answers: { type: boolean }
        anonymous: { type: boolean }
        quiz: { type: boolean }
        explanation:
          type: [string, "null"]
          description: The explanation of a quiz once the user sees the results.
        close_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        closed_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        total_voters:
          type: [integer, "null"]
          minimum: 0
          description: People who voted, each counted once even with several answers.
        my_votes:
          type: array
          description: Indexes of the options the user voted for; empty when they have not voted.
          items: { type: integer, minimum: 0, maximum: 9 }
        can_close:
          type: boolean
          description: The user may close the poll now.
        version:
          type: integer
          minimum: 0
          description: Grows with every vote and when the poll closes; keep the poll with the highest version.
    PollOption:
      type: object
      required: [text, voter_count]
      properties:
        text: { type: string }
        voter_count: { type: [integer, "null"], minimum: 0 }
        is_correct:
          type: boolean
          description: Set on every option of a quiz once the user sees the results; absent otherwise.
    PollVoteRequest:
      type: object
      required: [options]
      additionalProperties: false
      properties:
        options:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: integer, minimum: 0, maximum: 9 }
    ContactCreate:
      type: object
      required: [user_id]
      additionalProperties: false
      properties:
        user_id:
          description: |
            A user whose profile the sender may open (`403` otherwise), the sender included; not a deleted account.
          allOf: [{ $ref: "#/components/schemas/Id" }]
    ContactCard:
      type: object
      required: [user_id, user]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        user:
          description: |
            The shared user as the requesting user may see them now, not as they were when the card was sent; `null`
            when the account is gone.
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    LocationCreate:
      type: object
      required: [latitude, longitude]
      additionalProperties: false
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy_m:
          type: integer
          minimum: 0
          maximum: 10000
          description: Accuracy of a measured position in metres; omit for a point picked on the map.
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: A name for the place, typed by the sender.
    MessageLocation:
      type: object
      description: Coordinates are rounded to 6 decimals (about 10 cm).
      required: [latitude, longitude, accuracy_m, title, map]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
        accuracy_m: { type: [integer, "null"], minimum: 0 }
        title: { type: [string, "null"], maxLength: 100 }
        map: { $ref: "#/components/schemas/MapImage" }
    MapImage:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          description: "`GET /maps/static` with the signed point; load it like other API images"
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
    LinkPreview:
      type: object
      required: [url, title, description, site_name, image]
      properties:
        url:
          type: string
          description: The page after redirects
        title: { type: [string, "null"], maxLength: 300 }
        description: { type: [string, "null"], maxLength: 500 }
        site_name: { type: [string, "null"], maxLength: 100 }
        image:
          oneOf:
            - $ref: "#/components/schemas/LinkPreviewImage"
            - type: "null"
    LinkPreviewImage:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          description: "`GET /link-preview/image` with the signed address of the page's image"
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
    SystemEventKind:
      type: string
      enum: [group_created, member_added, member_joined, member_removed, member_left, call, message_pinned, message_unpinned, history_imported, history_import_ended, imported_note, group_renamed, group_avatar_changed, owner_transferred, chat_wallpaper_set]
    SystemEvent:
      type: object
      description: |
        What a `system` message records; set on system messages only, whose `content` is then `null`. The names
        are the display names at the time of the event. `target` fields are set for `member_added`,
        `member_removed` and `owner_transferred` (the new owner; `actor` is the previous one). `call` is set for
        `call` messages: one per call, posted when the call ends, `actor` is the initiator. `message_id` and
        `snippet` are set for `message_pinned` and `message_unpinned`. `old_name` and `new_name` are set for
        `group_renamed`, `avatar_removed` for `group_avatar_changed`. `chat_wallpaper_set`: `actor` set a background
        for both people of a direct chat.
        `history_imported` opens and `history_import_ended` closes an imported history; both carry `import`, and
        `actor` is the importer. `imported_note` is a line of the export that is not a message; its text is `text`.
      required: [kind, actor_id, actor_name]
      properties:
        kind: { $ref: "#/components/schemas/SystemEventKind" }
        actor_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        actor_name: { type: string }
        target_id: { $ref: "#/components/schemas/Id" }
        target_name: { type: string }
        call: { $ref: "#/components/schemas/CallSummary" }
        message_id:
          description: The pinned or unpinned message.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        snippet:
          type: string
          maxLength: 64
          description: |
            Start of the pinned message's text at the time of the event (at most 60 characters plus `…`): the question
            of a poll, the place name of a location. Empty for a message without text and for a contact, which clients
            name by its `message_type`.
        message_type: { $ref: "#/components/schemas/MessageType" }
        old_name: { type: string, maxLength: 64 }
        new_name: { type: string, maxLength: 64 }
        avatar_removed:
          type: boolean
          description: "`true` when the group photo was removed, `false` when a new one was set."
        import: { $ref: "#/components/schemas/ImportSummary" }
        text:
          type: string
          maxLength: 4096
          description: The line of the export, for `imported_note`.
    MessagePage:
      type: object
      required: [items, next_cursor, prev_cursor]
      properties:
        items:
          type: array
          description: Oldest to newest
          items: { $ref: "#/components/schemas/Message" }
        next_cursor:
          description: |
            Continues in the direction of the request: pass it as `before` (older) for the
            default, `before` and `around` requests, or as `after` (newer) for `after` requests.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        prev_cursor:
          description: The opposite direction (`after` for the default request, `before` for an `after` request).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
    SearchHit:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        highlight:
          type: [string, "null"]
          description: |
            Plain-text excerpt of the matching text or file name; never HTML. The matched words are
            wrapped in U+E000 (start) and U+E001 (end), characters of the Unicode private use area,
            so a client can mark them without parsing markup. `null` when the message matched without
            an excerpt.
    UnsentMessage:
      type: object
      description: A send the server rejected for a reason that may pass later. Resend it with the same `client_temp_id`.
      required: [chat_id, client_temp_id, type, content, reply_to, attachments, error_code, created_at]
      properties:
        chat_id: { $ref: "#/components/schemas/Id" }
        client_temp_id: { $ref: "#/components/schemas/ClientTempId" }
        type:
          type: string
          enum: [text, file, voice, sticker, poll, contact, location]
        content: { type: [string, "null"] }
        reply_to:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        attachments:
          type: array
          description: Uploaded files of the send that still exist, in the order they were sent.
          items: { $ref: "#/components/schemas/Attachment" }
        sticker: { $ref: "#/components/schemas/Sticker" }
        poll:
          description: The poll of an unsent `poll` message, as it was sent.
          $ref: "#/components/schemas/PollCreate"
        contact:
          description: The contact of an unsent `contact` message, as it was sent.
          $ref: "#/components/schemas/ContactCreate"
        location:
          description: The place of an unsent `location` message, as it was sent.
          $ref: "#/components/schemas/LocationCreate"
        error_code: { $ref: "#/components/schemas/ErrorCode" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    MessageSearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    SendMessageRequest:
      type: object
      required: [client_temp_id, type]
      properties:
        client_temp_id: { $ref: "#/components/schemas/ClientTempId" }
        type:
          type: string
          enum: [text, file, voice, sticker, poll, contact, location]
        content:
          type: [string, "null"]
          maxLength: 4096
        poll:
          description: |
            The poll of a `poll` message. Poll, contact and location messages have no content, attachment, sticker or
            drawings; the server writes a plain-text summary into `content` for older clients. Send them with this
            operation; the WebSocket `message` event does not take them.
          $ref: "#/components/schemas/PollCreate"
        contact:
          description: The shared user of a `contact` message.
          $ref: "#/components/schemas/ContactCreate"
        location:
          description: The place of a `location` message.
          $ref: "#/components/schemas/LocationCreate"
        sticker_id:
          description: |
            The sticker of a `sticker` message, from any pack that is not deleted. Sticker messages have no content,
            attachment or drawings; the server sets `content` to the sticker's emoji. Send stickers with this
            operation; the WebSocket `message` event does not take them.
          $ref: "#/components/schemas/Id"
        attachment_id:
          description: Single upload ID for a file or voice message. Omit for albums.
          oneOf:
            - $ref: "#/components/schemas/AttachmentRef"
            - type: "null"
        attachment_ids:
          type: array
          description: Ordered IDs of two to ten image or video uploads for one file message.
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/AttachmentRef" }
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        drawings:
          type: array
          description: |
            Drawings on images of a `file` message, at most one per image. Each `attachment_id` must be one of the
            message's attachments. An image with a drawing may also be an image of the message in `reply_to`
            instead of the sender's own upload: that is how a member draws on an image someone sent.
          maxItems: 10
          items: { $ref: "#/components/schemas/AttachmentDrawing" }
      allOf:
        - if:
            properties:
              type: { const: poll }
          then:
            required: [poll]
            properties:
              poll: { $ref: "#/components/schemas/PollCreate" }
          else:
            properties:
              poll: { not: {} }
        - if:
            properties:
              type: { const: contact }
          then:
            required: [contact]
            properties:
              contact: { $ref: "#/components/schemas/ContactCreate" }
          else:
            properties:
              contact: { not: {} }
        - if:
            properties:
              type: { const: location }
          then:
            required: [location]
            properties:
              location: { $ref: "#/components/schemas/LocationCreate" }
          else:
            properties:
              location: { not: {} }
      if:
        properties:
          type: { enum: [file, voice] }
      then:
        properties:
          sticker_id: { not: {} }
        oneOf:
          - required: [attachment_id]
            properties:
              attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
              attachment_ids: { not: {} }
          - required: [attachment_ids]
            properties:
              type: { const: file }
              attachment_id: { not: {} }
              attachment_ids: { type: array }
      else:
        if:
          properties:
            type: { enum: [sticker, poll, contact, location] }
        then:
          properties:
            content: { not: {} }
            attachment_id: { not: {} }
            attachment_ids: { not: {} }
            drawings: { not: {} }
          if:
            properties:
              type: { const: sticker }
          then:
            required: [sticker_id]
            properties:
              sticker_id: { $ref: "#/components/schemas/Id" }
          else:
            properties:
              sticker_id: { not: {} }
        else:
          required: [content]
          properties:
            content: { type: string, minLength: 1, maxLength: 4096 }
            attachment_id: { not: {} }
            attachment_ids: { not: {} }
            drawings: { not: {} }
            sticker_id: { not: {} }
    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4096
          description: New text, or the new caption of a file. Empty removes a file's caption; a text message rejects it.
    ForwardMessageRequest:
      type: object
      required: [chat_ids]
      properties:
        chat_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    ForwardMessagesRequest:
      type: object
      required: [message_ids, chat_ids]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        chat_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    DeleteMessagesRequest:
      type: object
      required: [message_ids, scope]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        scope:
          type: string
          enum: [me, everyone]
    MarkReadRequest:
      type: object
      required: [message_id]
      properties:
        message_id:
          description: Everything up to and including this message is read.
          $ref: "#/components/schemas/Id"

    # ------------------------------------------------- chats and groups
    ChatType:
      type: string
      enum: [direct, group]
    GroupRole:
      type: string
      description: A moderator may delete other members' messages; owners and admins also manage the group.
      enum: [owner, admin, moderator, member]
    GroupRoleEvent:
      type: object
      description: A member got a new role; `owner` means the actor transferred ownership to them.
      required: [id, actor, target, role, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        actor:
          description: "`null` when the account is gone."
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        target: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/GroupRole" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    GroupRoleLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first, at most 100
          items: { $ref: "#/components/schemas/GroupRoleEvent" }
    Chat:
      type: object
      required:
        - id
        - type
        - name
        - avatar_url
        - peer
        - is_pinned
        - pin_position
        - is_archived
        - is_request
        - unread_count
        - unread_mentions_count
        - first_unread_message_id
        - last_read_message_id
        - last_message
        - pinned_message_count
        - created_at
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/ChatType" }
        name:
          type: string
          description: Display name of the peer or the group
        avatar_url: { type: [string, "null"] }
        peer:
          description: The other user of a direct chat (the caller in their "Saved Messages" chat); `null` for groups.
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        is_pinned: { type: boolean }
        pin_position:
          description: Order of a pinned chat among the caller's pinned chats, lowest first; `null` when not pinned.
          type: [integer, "null"]
        is_archived:
          type: boolean
          description: Whether the caller archived the chat (only for the caller).
        is_request:
          type: boolean
          description: |
            Whether the chat is in the caller's Requests folder: a stranger opened it, and the caller has not
            replied, accepted, pinned or archived it yet (only for the caller).
        unread_count: { type: integer, minimum: 0 }
        unread_mentions_count:
          type: integer
          minimum: 0
          description: |
            Unread messages that mention the caller (`GET /chats/{chat_id}/mentions`). Clients show an `@` badge while
            it is above 0. Always 0 in direct chats.
        first_unread_message_id:
          description: |
            The oldest message the caller has not read (the same messages `unread_count` counts: not their own,
            not system messages, not deleted); `null` when nothing is unread. Clients open the chat around it and
            show the "new messages" divider above it.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        last_read_message_id:
          description: The caller's read marker (`POST /chats/{chat_id}/read`); `null` before their first read.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        last_message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        my_role:
          description: Only for groups.
          oneOf:
            - $ref: "#/components/schemas/GroupRole"
            - type: "null"
        pinned_message_count:
          type: integer
          minimum: 0
          description: Pinned messages the caller sees (`GET /chats/{chat_id}/pins`); clients show the pinned bar above 0.
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ChatRequestCount:
      type: object
      required: [requests_count]
      properties:
        requests_count: { type: integer, minimum: 0 }
    ChatPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Chat" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    ClearHistoryRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [me, everyone]
    PinOrderRequest:
      type: object
      required: [chat_ids]
      properties:
        chat_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    PinScope:
      type: string
      description: "`me`: only for the caller. `everyone`: for every member of the chat."
      enum: [me, everyone]
    PinMessageRequest:
      type: object
      required: [scope]
      properties:
        scope: { $ref: "#/components/schemas/PinScope" }
    PinnedMessage:
      type: object
      required: [message, scope, pinned_by, pinned_at, can_unpin_for_everyone]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        scope: { $ref: "#/components/schemas/PinScope" }
        pinned_by:
          description: Who pinned it; the caller for `me`.
          allOf: [{ $ref: "#/components/schemas/Id" }]
        pinned_at: { $ref: "#/components/schemas/Timestamp" }
        can_unpin_for_everyone:
          type: boolean
          description: Whether `DELETE …/pin?scope=everyone` is allowed for the caller; always `false` for `me`.
    PinnedMessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Newest pin first
          items: { $ref: "#/components/schemas/PinnedMessage" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    ImportSource:
      type: string
      enum: [telegram, whatsapp]
    ChatImportState:
      type: string
      description: "`running`: messages are being added. `done`: finished. `removing`: being removed."
      enum: [running, done, removing]
    ImportSenderKey:
      type: string
      description: The client's key for one name of the export.
      pattern: "^[A-Za-z0-9_-]{1,64}$"
    ImportSenderState:
      type: string
      description: |
        `me`: the importer's own messages. `unassigned`: shown as text. `pending`: suggested for `user_id`, who has
        not answered. `confirmed`: `user_id` confirmed; the messages show their account. `declined`: the suggested
        member said no; shown as text.
      enum: [me, unassigned, pending, confirmed, declined]
    ChatImportSender:
      type: object
      required: [key, name, message_count, state, user_id]
      properties:
        key: { $ref: "#/components/schemas/ImportSenderKey" }
        name: { type: string, minLength: 1, maxLength: 128 }
        message_count: { type: integer, minimum: 0 }
        state: { $ref: "#/components/schemas/ImportSenderState" }
        user_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
    ChatImport:
      type: object
      required: [id, chat_id, source, state, message_count, file_count, first_at, last_at, next_index, imported_by, created_at, finished_at, senders]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        chat_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/ImportSource" }
        state: { $ref: "#/components/schemas/ChatImportState" }
        message_count: { type: integer, minimum: 1, maximum: 500000 }
        file_count: { type: integer, minimum: 0, maximum: 5000 }
        first_at: { $ref: "#/components/schemas/Timestamp" }
        last_at: { $ref: "#/components/schemas/Timestamp" }
        next_index:
          type: integer
          minimum: 0
          description: How many messages are stored; the `from_index` of the next batch.
        imported_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        senders:
          type: array
          items: { $ref: "#/components/schemas/ChatImportSender" }
    ChatImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChatImport" }
    StartChatImportSender:
      type: object
      required: [key, name, message_count]
      properties:
        key: { $ref: "#/components/schemas/ImportSenderKey" }
        name: { type: string, minLength: 1, maxLength: 128 }
        message_count: { type: integer, minimum: 0 }
        me:
          type: boolean
          description: The caller's own messages; at most one sender.
        user_id:
          description: A member of the chat suggested for this name; not with `me`.
          allOf: [{ $ref: "#/components/schemas/Id" }]
    StartChatImportRequest:
      type: object
      required: [source, message_count, file_count, first_at, last_at, senders]
      properties:
        source: { $ref: "#/components/schemas/ImportSource" }
        message_count: { type: integer, minimum: 1, maximum: 500000 }
        file_count: { type: integer, minimum: 0, maximum: 5000 }
        first_at: { $ref: "#/components/schemas/Timestamp" }
        last_at: { $ref: "#/components/schemas/Timestamp" }
        senders:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/StartChatImportSender" }
    ImportedMessageType:
      type: string
      description: |
        `note`: a line of the export that is not a message (for example that someone joined), shown as a system message.
        `sticker`: a sticker the importer may send (usually from a pack the importer made from the export's stickers),
        with `sticker_id` and no `content` or `attachment_ids`.
      enum: [text, file, voice, note, sticker]
    ImportedMessage:
      type: object
      required: [index, original_at, type]
      properties:
        index:
          type: integer
          minimum: 0
          description: Position in the import, counting from 0 without gaps.
        sender_key:
          description: Required except for `note`.
          allOf: [{ $ref: "#/components/schemas/ImportSenderKey" }]
        original_at:
          description: When the message was sent in the other messenger; between the import's `first_at` and `last_at`.
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
        type: { $ref: "#/components/schemas/ImportedMessageType" }
        content:
          type: [string, "null"]
          maxLength: 4096
        attachment_ids:
          type: array
          description: The importer's uploads; two to ten images or videos make an album.
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/AttachmentRef" }
        sticker_id:
          description: The sticker of a `sticker` message; the server sets `content` to the sticker's emoji.
          $ref: "#/components/schemas/Id"
        reply_to_index:
          type: integer
          minimum: 0
          description: "`index` of an earlier message of the import that this one answers."
    AddImportedMessagesRequest:
      type: object
      required: [from_index, messages]
      properties:
        from_index: { type: integer, minimum: 0 }
        messages:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/ImportedMessage" }
    ImportProgress:
      type: object
      required: [next_index]
      properties:
        next_index: { type: integer, minimum: 0 }
    AssignImportSenderRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
    DecideImportSenderRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [confirm, decline, withdraw]
    MessageImport:
      type: object
      description: Set on messages that came from an import.
      required: [import_id, source, original_at]
      properties:
        import_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/ImportSource" }
        original_at: { $ref: "#/components/schemas/Timestamp" }
        sender_name:
          type: string
          description: The name in the export; absent on system messages.
        sender_state:
          type: string
          description: |
            `me`: the importer's own message, `sender` is the importer. `confirmed`: the member confirmed the name,
            `sender` is that member. `unconfirmed`: `sender` is `null`; show `sender_name` as text. Absent on system
            messages.
          enum: [me, confirmed, unconfirmed]
    ImportSummary:
      type: object
      required: [import_id, source, message_count, first_at, last_at]
      properties:
        import_id: { $ref: "#/components/schemas/Id" }
        source: { $ref: "#/components/schemas/ImportSource" }
        message_count: { type: integer, minimum: 1 }
        first_at: { $ref: "#/components/schemas/Timestamp" }
        last_at: { $ref: "#/components/schemas/Timestamp" }
    CreateChatRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        initial_message:
          type: [string, "null"]
          maxLength: 4096
    GroupMemberPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
        total: { type: integer, minimum: 0 }
    CommonGroup:
      type: object
      required: [id, name, avatar_url, member_count]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        avatar_url: { type: [string, "null"] }
        member_count: { type: integer, minimum: 1 }
    CommonGroupPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CommonGroup" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    GroupMember:
      type: object
      required: [user, role, joined_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/GroupRole" }
        joined_at: { $ref: "#/components/schemas/Timestamp" }
    Group:
      type: object
      required: [id, name, description, avatar_url, background, owner_id, my_role, members, created_at, public_name]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
        avatar_url: { type: [string, "null"] }
        background:
          description: The banner and page background of the group profile; set by the owner and admins.
          oneOf:
            - $ref: "#/components/schemas/ProfileBackground"
            - type: "null"
        owner_id: { $ref: "#/components/schemas/Id" }
        my_role: { $ref: "#/components/schemas/GroupRole" }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        public_name:
          description: The group's public name (`/@name`); `null` for a private group.
          oneOf:
            - $ref: "#/components/schemas/PublicName"
            - type: "null"
    CreateGroupRequest:
      type: object
      required: [name, member_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
        member_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    UpdateGroupRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
    AddParticipantRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, moderator, member]
    TransferOwnerRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }

    # -------------------------------------------------------- requests
    PublicName:
      type: string
      description: |
        A username or a group's public name. One name space for both, unique ignoring case; links are `/@name` on the
        web app's origin.
      pattern: "^[A-Za-z0-9_]{3,32}$"
    InviteToken:
      type: string
      description: The secret part of an invite link `/join/{token}`.
      pattern: "^[A-Za-z0-9]{22}$"
    WebProfileVisibility:
      type: string
      description: |
        Whether people without an account (and link previews in other apps) see the profile card at `/@username`:
        display name, username, and the avatar and bio when `avatar_visibility` and `profile_visibility` are
        `everyone`. Defaults to `everyone`.
      enum: [everyone, nobody]
    PublicUser:
      type: object
      description: The card of a user for someone without an account. Never carries an ID, presence or other fields.
      required: [username, display_name, avatar_url, bio]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        display_name: { type: string }
        avatar_url:
          description: "`/api/v2/public/names/{username}/avatar?rev=…`; `null` when hidden or unset."
          type: [string, "null"]
        bio:
          description: "`null` when `profile_visibility` is not `everyone` or the bio is empty."
          type: [string, "null"]
    PublicGroup:
      type: object
      description: The card of a group for someone without an account. No members and no messages.
      required: [name, public_name, description, avatar_url, member_count]
      properties:
        name: { type: string }
        public_name:
          description: Set for a public group.
          oneOf:
            - $ref: "#/components/schemas/PublicName"
            - type: "null"
        description: { type: [string, "null"] }
        avatar_url:
          description: "A public avatar URL (`/api/v2/public/names/…/avatar` or `/api/v2/public/invites/…/avatar`), or `null`."
          type: [string, "null"]
        member_count: { type: integer, minimum: 0 }
    PublicNameKind:
      type: string
      description: Unknown values must be treated like `unavailable`.
      enum: [user, group, unavailable]
    PublicNameLookup:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/PublicNameKind" }
        user:
          description: Set when `kind` is `user`.
          $ref: "#/components/schemas/PublicUser"
        group:
          description: Set when `kind` is `group`.
          $ref: "#/components/schemas/PublicGroup"
    GroupPreview:
      type: object
      description: A group the caller may join, as seen before joining.
      required: [group, chat_id]
      properties:
        group: { $ref: "#/components/schemas/PublicGroup" }
        chat_id:
          description: The chat when the caller is already a member; `null` otherwise.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
    GroupPreviewPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupPreview" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    PublicNameAvailability:
      type: object
      required: [public_name, available]
      properties:
        public_name: { $ref: "#/components/schemas/PublicName" }
        available:
          type: boolean
          description: "`false` when a user or another group has the name (ignoring case) or it is reserved."
    InviteLink:
      type: object
      required: [id, token, name, created_by, created_at, expires_at, max_uses, use_count, revoked_at, is_active]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        token: { $ref: "#/components/schemas/InviteToken" }
        name:
          type: [string, "null"]
          maxLength: 64
        created_by:
          description: The user who created the link; `null` after that account was deleted.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at:
          description: "`null`: never expires."
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        max_uses:
          description: "`null`: no limit."
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
        use_count: { type: integer, minimum: 0 }
        revoked_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        is_active:
          type: boolean
          description: Not revoked, not expired and not used up.
    InviteLinkList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InviteLink" }
    CreateInviteLinkRequest:
      type: object
      properties:
        name:
          type: [string, "null"]
          maxLength: 64
        expires_at:
          description: In the future, at most 366 days ahead; `null` or absent for a link that never expires.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        max_uses:
          description: "`null` or absent for no limit."
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
    UpdateInviteLinkRequest:
      type: object
      minProperties: 1
      description: Fields left out stay as they are; `null` clears the expiry or the limit.
      properties:
        name:
          type: [string, "null"]
          maxLength: 64
        expires_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        max_uses:
          type: [integer, "null"]
          minimum: 1
          maximum: 100000
    SetPublicNameRequest:
      type: object
      required: [public_name]
      properties:
        public_name: { $ref: "#/components/schemas/PublicName" }
    GroupBan:
      type: object
      required: [user, banned_by, created_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        banned_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
    GroupBanPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupBan" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    MentionList:
      type: object
      required: [message_ids]
      properties:
        message_ids:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Id" }
    ApprovalRequestType:
      type: string
      enum: [direct_message, group_invite]
    ApprovalRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    ApprovalRequest:
      type: object
      required: [id, type, status, requester, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/ApprovalRequestType" }
        status: { $ref: "#/components/schemas/ApprovalRequestStatus" }
        requester: { $ref: "#/components/schemas/User" }
        group_name:
          type: [string, "null"]
          description: Only for `group_invite`
        preview:
          type: [string, "null"]
          description: First message of a direct-message request
        created_at: { $ref: "#/components/schemas/Timestamp" }

    DeviceRecoveryStart:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"
    DeviceRecoveryResult:
      type: object
      required:
        - request_id
        - match_number
        - expires_at
      properties:
        request_id:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        match_number:
          type: integer
          minimum: 10
          maximum: 99
        expires_at:
          type: string
          format: date-time
    DeviceRecoveryStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - used
            - expired
    DeviceRecoveryApproval:
      type: object
      required:
        - match_number
      properties:
        match_number:
          type: integer
          minimum: 10
          maximum: 99
        passkey:
          $ref: "#/components/schemas/PasskeyVerification"
        code:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
          deprecated: true
          description: Ignored. Older clients still send it.
    DeviceRecoveryApprovalOptions:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum: [passkey, session]
        challenge_id:
          type: string
          minLength: 32
          maxLength: 128
          description: "Present with `method: passkey`."
        public_key:
          type: object
          additionalProperties: true
          description: "WebAuthn request options, present with `method: passkey`."
        approvable_from:
          type: string
          format: date-time
          description: "Present with `method: session` while the session is too new to approve."
    DeviceRecoveryComplete:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    QrLoginStatus:
      type: string
      description: |
        `pending` until a signed-in device opens the request, `scanned` once it did, then `approved` or `denied`.
        `expired` when the request timed out or was used (only in poll answers).
      enum: [pending, scanned, approved, denied, expired]
    QrLoginStart:
      type: object
      required: [request_id, poll_token, url, expires_at]
      properties:
        request_id:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        poll_token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Secret of the requesting device; only a keyed hash is stored.
        url:
          type: string
          description: "`<RECOVERY_WEB_URL>/qr/<request_id>`, the content of the QR code."
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    QrLoginRequest:
      type: object
      required: [request_id, status, device, location, created_at, expires_at]
      properties:
        request_id: { type: string }
        status: { $ref: "#/components/schemas/QrLoginStatus" }
        device:
          type: [string, "null"]
          maxLength: 512
          description: User agent of the device that asks to sign in; `null` when it sent none.
        location:
          description: Approximate location of the device that asks to sign in; `null` when unknown.
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    QrLoginPollRequest:
      type: object
      required: [poll_token]
      properties:
        poll_token: { type: string, maxLength: 128, writeOnly: true }
    QrLoginPollResult:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, scanned, denied, expired]
        - allOf:
            - $ref: "#/components/schemas/TokenResponse"
            - type: object
              required: [status]
              properties:
                status: { type: string, const: approved }
    QrLoginApproval:
      type: object
      properties:
        code:
          type: string
          maxLength: 128
          description: An authenticator code or an unused recovery code; required when two-factor is on.

    PasskeyOptions:
      type: object
      required:
        - challenge_id
        - public_key
      properties:
        challenge_id: &a1
          type: string
          minLength: 32
          maxLength: 128
        public_key: &a2
          type: object
          additionalProperties: true
    PasskeyRegistration:
      type: object
      required:
        - password
        - name
      properties:
        password: &a4
          type: string
          maxLength: 128
          writeOnly: true
        code:
          type: string
          maxLength: 128
        name: &a3
          type: string
          minLength: 1
          maxLength: 64
    PasskeyVerification:
      type: object
      required:
        - challenge_id
        - credential
      properties:
        challenge_id: *a1
        credential: *a2
    PasskeyLoginOptions:
      type: object
      required: []
      properties:
        username:
          $ref: "#/components/schemas/Username"
    PasskeyRename:
      type: object
      required:
        - name
      properties:
        name: *a3
    PasskeyRemoval:
      type: object
      required: []
      properties:
        password: *a4
    Passkey:
      type: object
      required:
        - id
        - name
        - created_at
        - last_used_at
      properties:
        id:
          type: string
        name: *a3
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
    PasskeyPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    RecoveryEmailStatus:
      type: object
      required:
        - address
        - state
        - enabled
      properties:
        address:
          type: string
        state:
          type: string
          enum:
            - not_added
            - pending
            - verified
        enabled:
          type: boolean
    RecoveryOverview:
      type: object
      required:
        - recovery_key
        - other_devices
        - passkeys
        - passkeys_enabled
        - email
      properties:
        recovery_key:
          $ref: "#/components/schemas/RecoveryKeyStatus"
        other_devices:
          type: integer
          minimum: 0
        passkeys:
          type: integer
          minimum: 0
        passkeys_enabled:
          type: boolean
        email:
          $ref: "#/components/schemas/RecoveryEmailStatus"
    SetRecoveryEmail:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password: &a1
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        code: &a2
          type: string
          maxLength: 128
    RemoveRecoveryEmail:
      type: object
      required:
        - password
      properties:
        password: *a1
        code: *a2
    VerifyRecoveryEmail:
      type: object
      required:
        - token
      properties:
        token: &a3
          type: string
          minLength: 32
          maxLength: 128
    EmailResetRequest:
      type: object
      required:
        - username_or_email
      properties:
        username_or_email:
          type: string
          maxLength: 254
    EmailResetConfirmation:
      type: object
      required:
        - token
        - new_password
      properties:
        token: *a3
        new_password: *a1
        code: *a2
    EmailResetAccepted:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    # ----------------------------------------------------------- calls
    CallConfig:
      type: object
      required: [enabled, video_enabled, screen_share_enabled, max_participants, ring_timeout_seconds]
      properties:
        enabled: { type: boolean }
        video_enabled:
          type: boolean
          description: |
            Participants may publish their camera. Always `false` while `enabled` is `false`. Clients treat a missing
            field (older servers) as `false`.
        screen_share_enabled:
          type: boolean
          description: |
            Participants may share their screen, with its sound where the browser offers it. Several participants may
            share at the same time. Always `false` while `enabled` is `false`. Clients treat a missing field as
            `false`.
        max_participants:
          type: integer
          minimum: 2
          description: Most sessions joined to one call at the same time.
        ring_timeout_seconds:
          type: integer
          minimum: 1
          description: How long an invitation rings before it counts as missed.
    CallIdentityRequest:
      type: object
      required: [public_key]
      properties:
        public_key: { $ref: "#/components/schemas/CallIdentityKey" }
    CallIdentityKey:
      type: string
      description: |
        P-256 public key as an uncompressed point (65 bytes, first byte `0x04`), base64url without padding.
      minLength: 87
      maxLength: 87
      pattern: "^[A-Za-z0-9_-]+$"
    CallState:
      type: string
      description: "`ringing` until someone answers, `active` while people are in it, `ended` afterwards."
      enum: [ringing, active, ended]
    CallEndReason:
      type: string
      description: |
        Why the call ended: `completed` (people talked), `missed` (nobody answered in time), `declined` (the peer of a
        direct call declined), `cancelled` (the caller hung up before an answer), `failed` (the media service lost
        the call).
      enum: [completed, missed, declined, cancelled, failed]
    CallParticipantState:
      type: string
      description: "`left` and `declined` can become `joined` again in a group call."
      enum: [ringing, joined, declined, missed, left]
    CallParticipant:
      type: object
      required: [user_id, state, session_id, identity_key, joined_at]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/CallParticipantState" }
        session_id:
          description: The session that joined; `null` unless `state` is `joined`.
          oneOf:
            - { type: string, format: uuid }
            - type: "null"
        identity_key:
          description: Call identity of the joined session; `null` unless `state` is `joined`.
          oneOf:
            - $ref: "#/components/schemas/CallIdentityKey"
            - type: "null"
        joined_at:
          description: When the participant last joined; `null` if never.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    Call:
      type: object
      required:
        - id
        - chat_id
        - kind
        - state
        - end_reason
        - initiator_id
        - created_at
        - started_at
        - ended_at
        - ring_expires_at
        - epoch
        - version
        - max_participants
        - participants
      properties:
        id: { $ref: "#/components/schemas/Id" }
        chat_id: { $ref: "#/components/schemas/Id" }
        kind:
          type: string
          enum: [direct, group]
        state: { $ref: "#/components/schemas/CallState" }
        end_reason:
          oneOf:
            - $ref: "#/components/schemas/CallEndReason"
            - type: "null"
        initiator_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at:
          description: First answer; `null` while nobody answered.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        ended_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        ring_expires_at:
          description: When ringing invitations of this call turn into `missed`.
          $ref: "#/components/schemas/Timestamp"
        epoch:
          type: integer
          minimum: 0
          description: Key epoch; increases whenever the set of joined sessions or their identity keys change.
        version:
          type: integer
          minimum: 1
          description: Increases with every change of the call; ignore events with a lower version than one already seen.
        max_participants: { type: integer, minimum: 2 }
        participants:
          type: array
          description: Everyone invited or joined, the initiator first.
          items: { $ref: "#/components/schemas/CallParticipant" }
    CallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Call" }
    StartCallRequest:
      type: object
      required: [client_request_id]
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Idempotency key chosen by the client.
    JoinCallRequest:
      type: object
      properties:
        takeover:
          type: boolean
          default: false
          description: Move the user's participation from another session to this one.
    CallGrant:
      type: object
      required: [url, token, identity, expires_at]
      properties:
        url:
          type: string
          description: WebSocket URL of the media server (`wss://`).
        token:
          type: string
          description: Media access token for this call and session only; microphone audio only.
        identity:
          type: string
          description: The participant identity inside the media room (`<user_id>:<session_id>`).
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CallJoin:
      type: object
      required: [call, grant]
      properties:
        call: { $ref: "#/components/schemas/Call" }
        grant: { $ref: "#/components/schemas/CallGrant" }
    CallKeyEnvelope:
      type: object
      description: An HPKE Auth-mode envelope carrying one sender key (see `docs/calls-e2ee.md`).
      required: [epoch, sender_user_id, sender_session_id, recipient_session_id, enc, ciphertext]
      properties:
        epoch: { type: integer, minimum: 0 }
        sender_user_id: { $ref: "#/components/schemas/Id" }
        sender_session_id: { type: string, format: uuid }
        recipient_session_id: { type: string, format: uuid }
        enc:
          type: string
          description: HPKE encapsulated key, base64url without padding.
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        ciphertext:
          type: string
          description: Sealed sender key, base64url without padding.
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    CallKeyEnvelopeList:
      type: object
      required: [call_id, epoch, items]
      properties:
        call_id: { $ref: "#/components/schemas/Id" }
        epoch: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/CallKeyEnvelope" }
    SendCallKeysRequest:
      type: object
      required: [epoch, envelopes]
      properties:
        epoch: { type: integer, minimum: 0 }
        envelopes:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/OutgoingCallKeyEnvelope" }
    OutgoingCallKeyEnvelope:
      type: object
      required: [recipient_session_id, enc, ciphertext]
      properties:
        recipient_session_id: { type: string, format: uuid }
        enc:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        ciphertext:
          type: string
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    CallSummary:
      type: object
      description: The call a `call` system message records.
      required: [call_id, kind, outcome, duration_seconds]
      properties:
        call_id: { $ref: "#/components/schemas/Id" }
        kind:
          type: string
          enum: [direct, group]
        outcome: { $ref: "#/components/schemas/CallEndReason" }
        duration_seconds:
          description: From the first answer to the end; `null` if nobody answered.
          oneOf:
            - { type: integer, minimum: 0 }
            - type: "null"

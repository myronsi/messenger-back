  /auth/qr-login:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: createQrLogin
      summary: Start a sign-in with a QR code
      description: |
        Called by a device that is not signed in. Show `url` as a QR code and poll
        `POST /auth/qr-login/{requestId}/poll` with `poll_token` until the status is final. The request expires
        after 2 minutes. Keep `poll_token` in memory only; it is the secret that receives the session.
      security: []
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrLoginStart" }
              example:
                request_id: 3q2-7wEAAAD9W8b0kZ3lYfHk6gF1n9cQmR2pVx4sTtU
                poll_token: example-poll-token
                url: https://messenger.example.com/qr/3q2-7wEAAAD9W8b0kZ3lYfHk6gF1n9cQmR2pVx4sTtU
                expires_at: "2026-11-06T12:02:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/qr-login/{requestId}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/QrLoginRequestId"
    get:
      tags: [auth]
      operationId: getQrLogin
      summary: Show who asks to sign in with a QR code
      description: |
        Called by a signed-in device after it opened the link of the QR code. The first call moves the request from
        `pending` to `scanned` and binds it to the caller: other accounts get `404` from then on. Show `device` and
        `location` and let the user confirm that the sign-in is their own before approving. Unknown, expired and
        used requests answer `404`.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrLoginRequest" }
              example:
                request_id: 3q2-7wEAAAD9W8b0kZ3lYfHk6gF1n9cQmR2pVx4sTtU
                status: scanned
                device: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Firefox/140.0
                location: { city: Berlin, country_code: DE, country: Germany }
                created_at: "2026-11-06T12:00:00Z"
                expires_at: "2026-11-06T12:02:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/qr-login/{requestId}/poll:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/QrLoginRequestId"
    post:
      tags: [auth]
      operationId: pollQrLogin
      summary: Poll a QR sign-in and receive the session once approved
      description: |
        Called by the device that created the request, about once per second (at most 120 polls per 2 minutes per
        client address). While the request is open the answer is `pending` or `scanned`. The first poll after
        approval signs the device in exactly like a successful `POST /auth/login`: it sets the refresh cookie and
        returns `status: approved` with the token fields. Later polls, unknown requests, a wrong `poll_token` and
        expired requests all answer `expired`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrLoginPollRequest" }
      responses:
        "200":
          description: The current status, plus the session when it was just approved
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrLoginPollResult" }
              examples:
                waiting:
                  value: { status: scanned }
                approved:
                  value:
                    status: approved
                    access_token: example-access-token
                    token_type: Bearer
                    expires_in: 900
        "400": { $ref: "#/components/responses/BadRequest" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/qr-login/{requestId}/approve:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/QrLoginRequestId"
    post:
      tags: [auth]
      operationId: approveQrLogin
      summary: Sign the device of a QR code into this account
      description: |
        Single use. The request must be `pending` or `scanned`, not expired and not bound to another account
        (`404` otherwise; `409` when it was already approved or denied). The calling session must be active and
        used within `RECOVERY_APPROVAL_MAX_AGE` (`403 forbidden` otherwise). With two-factor on, send `code` (an
        authenticator code or an unused recovery code); without it the answer is `401 two_factor_required` and the
        request stays approvable. A wrong code answers `400 invalid_credentials`. The body may be omitted.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrLoginApproval" }
            example: { code: "123456" }
      responses:
        "204": { description: Approved; the new device receives its session on its next poll }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/qr-login/{requestId}/deny:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/QrLoginRequestId"
    post:
      tags: [auth]
      operationId: denyQrLogin
      summary: Refuse a QR sign-in
      description: The new device then polls `denied`. Same `404` and `409` rules as approving.
      responses:
        "204": { description: Denied }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }


  /calls/config:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [calls]
      operationId: getCallConfig
      summary: Whether audio calls are available and their limits
      description: |
        `enabled` is `false` when the server has no media service configured or calls are switched off; clients then
        hide every call control. Clients must also check that the browser supports call encryption before offering
        calls.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Call availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/call-identity:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [calls]
      operationId: setCallIdentity
      summary: Register this session's call identity public key
      description: |
        One key per session (see `docs/calls-e2ee.md`). Registering a different key replaces the old one; if the
        session is in a call, the call's epoch increases. The private key never leaves the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallIdentityRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Stored
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [calls]
      operationId: listMyCalls
      summary: Calls that are not over and involve the current user
      description: |
        Calls ringing the user and calls the user has joined, newest first. Clients load this after every
        (re)connect, because realtime events are best effort.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Current calls
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /chats/{chat_id}/call:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [calls]
      operationId: getChatCall
      summary: The chat's call that is not over
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The current call of the chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
    post:
      tags: [calls]
      operationId: startChatCall
      summary: Start a call in the chat, or get the one already running
      description: |
        Starts ringing the other members. A chat has at most one call that is not over: when one exists it is
        returned with `200` and the client joins it instead. `client_request_id` makes retries idempotent for
        24 hours. Starting does not join: the caller then calls `POST /calls/{call_id}/join`.

        Refused with `403` (`calls_not_allowed`) when the peer of a direct chat has calls turned off or one user
        blocked the other, `503` (`calls_unavailable`) when calls are off on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCallRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A call was already running in the chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "201":
          description: The new call, ringing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    get:
      tags: [calls]
      operationId: getCall
      summary: A call of one of the user's chats
      description: Ended calls stay readable for 90 days.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The call
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Call" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/join:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: joinCall
      summary: Answer or join a call with this session
      description: |
        Answers a ringing call or joins a running group call, and returns a short-lived media grant for this
        session. The session must have a call identity (`422`, `call_identity_required`). A user is in at most one
        call with one session: `409` (`already_in_call`) unless `takeover` is `true`, which moves the user's
        participation to this session (the other session is removed from the media room). Other `409` codes:
        `call_ended`, `call_full`. The epoch of the call increases. The body is optional: no body, an empty body
        and `{}` all join without takeover.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinCallRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallJoin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/grant:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: renewCallGrant
      summary: A fresh media grant for the session that joined
      description: For reconnecting to the media server. Only the session that joined gets one (`409` otherwise).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallGrant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/decline:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: declineCall
      summary: Decline a ringing call
      description: |
        Stops the ringing on all of the user's devices. In a direct call this ends the call (`declined`); in a group
        call only this user's invitation ends. Declining a call that no longer rings changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Declined
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/leave:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: leaveCall
      summary: Leave the call
      description: |
        A direct call ends when either side leaves. A group call ends when the last participant has left and the
        short reconnect grace has passed. The caller leaving a call nobody answered cancels it (`cancelled`).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Left
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/end:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    post:
      tags: [calls]
      operationId: endCall
      summary: End the call for everyone
      description: |
        Allowed for the initiator, for both members of a direct call, and for the owner, admins and moderators of a
        group (`403` otherwise). Everyone is removed from the media room.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Ended
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
  /calls/{call_id}/keys:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/CallId"
    get:
      tags: [calls]
      operationId: getCallKeys
      summary: Key envelopes addressed to this session in the current epoch
      description: For catching up after a reconnect; the same envelopes also arrive as `call_keys` events.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The envelopes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallKeyEnvelopeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }
    post:
      tags: [calls]
      operationId: sendCallKeys
      summary: Send this session's sealed sender key to the other participants
      description: |
        Relays opaque HPKE envelopes (see `docs/calls-e2ee.md`). Only the session that joined may send, only for the
        current epoch (`409`, `stale_epoch`), and only to sessions on the roster of that epoch (`422`). The server
        never sees a plaintext key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendCallKeysRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Relayed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/CallsUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from login or refresh.
    cookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly refresh cookie set by login; scoped to `/api/v2/auth`.

  headers:
    RefreshCookie:
      description: HttpOnly, Secure, SameSite refresh cookie scoped to `/api/v2/auth/refresh`, so the browser sends it only to the refresh endpoint. Login and refresh set it; logout clears it (expired cookie).
      schema: { type: string }

  parameters:
    QrLoginRequestId:
      name: requestId
      in: path
      required: true
      description: ID of a QR sign-in request, from the QR code link `/qr/<request_id>`.
      schema: { type: string, minLength: 32, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$" }
    Limit:
      name: limit
      in: query
      description: Page size
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    After:
      name: after
      in: query
      description: Opaque `next_cursor` of the previous page
      schema: { $ref: "#/components/schemas/Cursor" }
    ChatId:
      name: chat_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/AttachmentRef" }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: call_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }

    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: Version of the client app, for logs and the per-client metric.
      schema: { type: string }
    ClientApiVersion:
      name: X-Client-Api-Version
      in: header
      required: false
      description: Contract version the client was built with (`API_VERSION` of `@myronsi/messenger-api`). A different MAJOR or a version below `min_client_api_version` is answered with `426`; a malformed value with `400` (`invalid_client_version`).
      schema: { type: string }

  responses:
    ClientOutdated:
      description: "The `X-Client-Api-Version` header has another MAJOR version than the server or is below `min_client_api_version` (`client_outdated`). Not returned by `/meta`, which clients use to find out the current versions."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Malformed request, or a malformed `X-Client-Api-Version` header (`invalid_client_version`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing, invalid or expired credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TwoFactorRequired:
      description: |
        Missing, invalid or expired credentials, or `code: two_factor_required`. `two_factor_required` means every
        other credential in the request was valid, the account has two-factor on, and no `code` was sent. Nothing
        single-use (recovery key, email token, recovery request) was consumed: send the same request again with
        `code`. Invalid other credentials get the usual error of the operation instead, whatever the two-factor
        state, and a wrong `code` keeps its usual error. On operations that need an access token this 401 does not
        mean the session is lost; tell the two apart by `code`.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Does not exist or is not visible to the current user
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: The state of the resource does not allow this
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Upload exceeds the size limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: The content type is not allowed
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: Syntactically valid but rejected values; `errors` lists the fields
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until the next attempt is allowed
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CallsUnavailable:
      description: |
        Calls are switched off on the server, or the server is at its call capacity (both `calls_unavailable`), or
        the media service or a store is away for a moment (`internal_error`). Retry after `Retry-After` when it is
        present; without it calls stay off until `GET /calls/config` reports them enabled.
      headers:
        Retry-After:
          description: Seconds until a retry may succeed
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    NotificationPreferences:
      type: object
      required:
        - enabled
        - sound
        - previews
      properties:
        enabled:
          type: boolean
        sound:
          type: boolean
        previews:
          type: boolean
    NotificationSettings:
      type: object
      required:
        - preferences
        - mutes
        - web_push
        - android_push
        - ios_push
        - vapid_public_key
      properties:
        preferences:
          $ref: "#/components/schemas/NotificationPreferences"
        mutes:
          type: array
          items:
            type: object
            required:
              - chat_id
              - until
            properties:
              chat_id:
                $ref: "#/components/schemas/Id"
              until:
                type: string
                format: date-time
        web_push:
          type: boolean
        android_push:
          type: boolean
        ios_push:
          type: boolean
        vapid_public_key:
          type: string
    NotificationDeviceRequest:
      type: object
      required:
        - platform
        - destination
      properties:
        platform:
          type: string
          enum:
            - web
            - android
            - ios
        destination:
          type: string
          minLength: 1
          maxLength: 4096
        p256dh:
          type: string
          maxLength: 128
        auth:
          type: string
          maxLength: 64
    NotificationDeviceRegistered:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
    NotificationMuteRequest:
      type: object
      required:
        - duration
      properties:
        duration:
          type: string
          enum:
            - off
            - 1h
            - 8h
            - forever
    NotificationActivity:
      type: object
      required:
        - active
        - client_id
      properties:
        active:
          type: boolean
        client_id:
          type: string
          format: uuid

    # ---------------------------------------------------------- basics
    Id:
      type: string
      pattern: "^[0-9]{1,19}$"
      description: Decimal ID as a string (Snowflake IDs exceed 2^53).
      examples: ["7217400317439950848"]
    AttachmentRef:
      type: string
      format: uuid
      description: ID of an uploaded attachment (a UUID, unlike the decimal IDs of messages, users and chats).
      examples: ["5f0c8a64-2f2b-4c7e-9d0e-6b1f3a2c4d5e"]
    Cursor:
      type: [string, "null"]
      maxLength: 256
      description: Opaque cursor; `null` when there are no more results.
    Timestamp:
      type: string
      format: date-time
    Username:
      type: string
      pattern: "^[A-Za-z0-9_]{3,32}$"
    ClientTempId:
      type: string
      minLength: 1
      maxLength: 64
      description: Client-generated ID that makes sending idempotent and ties acks and errors to the send.
    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code. New codes can appear in MINOR versions; unknown
        codes must be treated like `internal_error`.
      enum:
        - invalid_request
        - validation_failed
        - unauthenticated
        - invalid_credentials
        - two_factor_required
        - invalid_two_factor_code
        - token_expired
        - forbidden
        - not_found
        - conflict
        - already_exists
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - client_outdated
        - invalid_client_version
        - blocked_by_user
        - approval_required
        - user_verification_required
        - session_too_new
        - calls_unavailable
        - calls_not_allowed
        - call_identity_required
        - call_full
        - call_ended
        - already_in_call
        - stale_epoch
        - internal_error
    Problem:
      type: object
      description: RFC 9457 problem details. `426 Upgrade Required` (`client_outdated`) uses the same format.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: URI reference identifying the problem type (`about:blank` when `code` says it all).
          default: about:blank
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: "#/components/schemas/ErrorCode" }
        errors:
          type: array
          description: Field errors for `validation_failed`.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: JSON pointer into the request body, or the parameter name.
              message: { type: string }
        min_client_api_version:
          type: string
          description: Present when `code` is `client_outdated`.
        api_version:
          type: string
          description: Present when `code` is `client_outdated`.
      additionalProperties: true
    Meta:
      type: object
      required: [backend_version, commit, api_version, min_client_api_version]
      properties:
        backend_version: { type: string, examples: ["1.0.3"] }
        commit: { type: string, examples: ["abc1234"] }
        api_version: { type: string, examples: ["2.0.0"] }
        min_client_api_version: { type: string, examples: ["2.0.0"] }

    # ------------------------------------------------------------ auth
    RegisterRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
        bio: { type: [string, "null"], maxLength: 500 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { $ref: "#/components/schemas/Username" }
        password: { type: string, maxLength: 128, writeOnly: true }
    TwoFactorLoginRequest:
      type: object
      required: [login_challenge, code]
      properties:
        login_challenge: { type: string }
        code:
          type: string
          pattern: "^([0-9]{6}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{8})$"
          description: A code of the authenticator app, or an unused recovery code.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in:
          type: integer
          minimum: 1
          description: Seconds until the access token expires
    RecoverWithKeyRequest:
      type: object
      required: [username, recovery_key, new_password]
      properties:
        username: { type: string, maxLength: 64 }
        recovery_key: { type: string, maxLength: 128 }
        new_password: { type: string, minLength: 8, maxLength: 128 }
        code: { type: string, maxLength: 128 }
    ReplaceRecoveryKeyRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128 }
        code: { type: string, maxLength: 128 }
    RecoveryKeyResult:
      type: object
      required: [recovery_key]
      properties:
        recovery_key: { type: string }
    RecoveryKeyStatus:
      type: object
      required: [exists, created_at, locked_until]
      properties:
        exists: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        locked_until: { type: [string, 'null'], format: date-time }
    SecurityEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, type, created_at, location]
            properties:
              id: { $ref: "#/components/schemas/Id" }
              type: { type: string }
              created_at: { type: string, format: date-time }
              user_agent: { type: [string, "null"], maxLength: 512 }
              location:
                description: Approximate location of the client when the event happened; `null` when unknown.
                oneOf:
                  - $ref: "#/components/schemas/Location"
                  - type: "null"
    RegisterResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          description: The one-time recovery key shown after registration.
          properties:
            recovery_key: { type: string, description: Shown once; only a keyed hash is stored }
            username: { $ref: "#/components/schemas/Username" }
    TwoFactorChallenge:
      type: object
      required: [two_factor_required, login_challenge]
      properties:
        two_factor_required: { type: boolean, const: true }
        login_challenge: { type: string }
    LoginResponse:
      oneOf:
        - $ref: "#/components/schemas/TokenResponse"
        - $ref: "#/components/schemas/TwoFactorChallenge"
    WebSocketTicket:
      type: object
      required: [ticket, expires_in]
      properties:
        ticket: { type: string }
        expires_in:
          type: integer
          minimum: 1
          description: Seconds the ticket stays valid

    # -------------------------------------------------------------- me
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128, writeOnly: true }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 128, writeOnly: true }
        new_password: { type: string, minLength: 8, maxLength: 128, writeOnly: true }
    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        bio: { type: [string, "null"], maxLength: 500 }
    SetAvatarRequest:
      type: object
      required: [attachment_id]
      properties:
        attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
    SecuritySettings:
      type: object
      required: [session_duration_days, two_factor_enabled]
      properties:
        session_duration_days: { type: integer, minimum: 1, maximum: 365 }
        two_factor_enabled: { type: boolean }
    UpdateSecuritySettingsRequest:
      type: object
      required: [session_duration_days]
      properties:
        session_duration_days: { type: integer, minimum: 1, maximum: 365 }
    Session:
      type: object
      required: [id, created_at, last_used_at, is_current, location]
      properties:
        id: { type: string, format: uuid }
        device:
          type: [string, "null"]
          description: Sanitised user agent
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        is_current: { type: boolean }
        location:
          description: Approximate location of the device when it signed in or last refreshed its token; `null` when unknown.
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
    Location:
      type: object
      description: |
        Approximate location of a client address, looked up in an offline GeoIP database (IP geolocation by
        DB-IP, https://db-ip.com, CC BY 4.0). The address itself is never exposed. Each field is `null` when the
        database does not know it; clients localise the country name from `country_code`.
      required: [city, country_code, country]
      properties:
        city: { type: [string, "null"], description: City name in English }
        country_code:
          type: [string, "null"]
          pattern: "^[A-Z]{2}$"
          description: ISO 3166-1 alpha-2 country code
        country: { type: [string, "null"], description: Country name in English }
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string }
        otpauth_uri: { type: string }
    TwoFactorCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }
    TwoFactorRecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
          description: One-time codes for signing in without the authenticator app. Shown only once.
    DisableTwoFactorRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, maxLength: 128, writeOnly: true }
        code:
          type: string
          pattern: "^([0-9]{6}|[0-9A-Fa-f]{8}-[0-9A-Fa-f]{8})$"
          description: A code of the authenticator app, or an unused recovery code.
    Visibility:
      type: string
      description: |
        Who may see the item. The exception lists apply to every value; `*_except` behave like `everyone` and `nobody`.
        `contacts` are the users you share a group with, or a direct chat that you opened or read in.
      enum: [everyone, contacts, everyone_except, nobody_except, nobody]
    DirectMessagePolicy:
      type: string
      enum: [everyone, shared_chats, wait_approval]
    GroupInvitePolicy:
      type: string
      enum: [everyone, contacts, everyone_except, nobody_except, nobody, wait_approval]
    SearchVisibility:
      type: string
      enum: [everyone, nobody]
    PrivacyExceptions:
      type: object
      description: User IDs per setting. An exception wins over the setting whatever its value; `allow` always lets the user in, `deny` always keeps them out.
      additionalProperties:
        type: object
        required: [allow, deny]
        properties:
          allow:
            type: array
            items: { $ref: "#/components/schemas/Id" }
          deny:
            type: array
            items: { $ref: "#/components/schemas/Id" }
    PrivacySettings:
      type: object
      required:
        - avatar_visibility
        - profile_visibility
        - presence_visibility
        - read_receipts_enabled
        - direct_messages
        - group_invites
        - search_visibility
        - calls_enabled
        - exceptions
      properties:
        avatar_visibility: { $ref: "#/components/schemas/Visibility" }
        profile_visibility: { $ref: "#/components/schemas/Visibility" }
        presence_visibility: { $ref: "#/components/schemas/Visibility" }
        read_receipts_enabled: { type: boolean }
        direct_messages: { $ref: "#/components/schemas/DirectMessagePolicy" }
        group_invites: { $ref: "#/components/schemas/GroupInvitePolicy" }
        search_visibility: { $ref: "#/components/schemas/SearchVisibility" }
        calls_enabled:
          type: boolean
          description: Whether others may ring this user. Calls are only possible from an existing direct chat or a shared group.
        exceptions: { $ref: "#/components/schemas/PrivacyExceptions" }
    UpdatePrivacySettingsRequest:
      type: object
      minProperties: 1
      properties:
        avatar_visibility: { $ref: "#/components/schemas/Visibility" }
        profile_visibility: { $ref: "#/components/schemas/Visibility" }
        presence_visibility: { $ref: "#/components/schemas/Visibility" }
        read_receipts_enabled: { type: boolean }
        direct_messages: { $ref: "#/components/schemas/DirectMessagePolicy" }
        group_invites: { $ref: "#/components/schemas/GroupInvitePolicy" }
        search_visibility: { $ref: "#/components/schemas/SearchVisibility" }
        calls_enabled: { type: boolean }
    PrivacyExceptionsRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Id" }

    # ----------------------------------------------------------- users
    User:
      type: object
      description: A user as visible to the requesting user; hidden fields are `null`.
      required: [id, username, display_name, avatar_url, bio, is_online, last_seen, is_deleted]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        username: { $ref: "#/components/schemas/Username" }
        display_name: { type: string }
        contact_name:
          type: [string, "null"]
          description: The requesting user's own name for this user, if set.
        avatar_url:
          type: [string, "null"]
          description: Path of the avatar, always same-origin (`/api/v2/users/{id}/avatar?rev={revision}`).
        bio: { type: [string, "null"] }
        is_online: { type: boolean }
        last_seen:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        is_deleted: { type: boolean }
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [created_at]
          properties:
            created_at: { $ref: "#/components/schemas/Timestamp" }
            recovery_setup_required: { type: boolean }
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    AvatarVersion:
      type: object
      required: [id, url, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        url: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ContactNameRequest:
      type: object
      required: [contact_name]
      properties:
        contact_name: { type: string, minLength: 1, maxLength: 64 }

    # ----------------------------------------------------- attachments
    AttachmentKind:
      type: string
      enum: [image, audio, voice, video, file]
    UploadPurpose:
      type: string
      enum: [message, avatar]
    UploadAttachmentRequest:
      type: object
      required: [file, purpose]
      properties:
        file:
          type: string
          format: binary
        purpose: { $ref: "#/components/schemas/UploadPurpose" }
        kind: { $ref: "#/components/schemas/AttachmentKind" }
        duration_ms:
          type: integer
          minimum: 0
          description: Length of a voice message
        waveform:
          type: array
          description: Amplitude samples (0-255) of a voice message
          maxItems: 128
          items: { type: integer, minimum: 0, maximum: 255 }
    Attachment:
      type: object
      required: [id, kind, filename, content_type, size, url]
      properties:
        id: { $ref: "#/components/schemas/AttachmentRef" }
        kind: { $ref: "#/components/schemas/AttachmentKind" }
        filename: { type: string }
        content_type:
          type: string
          description: Detected by the server
        size:
          type: integer
          minimum: 0
          description: Bytes
        url:
          type: string
          description: Same-origin path (`/api/v2/attachments/{id}/content`) set by the server.
          readOnly: true
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
        thumbnail_url: { type: [string, "null"], readOnly: true }
        display_url:
          type: [string, "null"]
          readOnly: true
          description: A JPEG of at most 1600 px to show in an image viewer instead of the original; `null` for small images and GIFs, which are shown as they are.
        duration_ms: { type: [integer, "null"], minimum: 0 }
        waveform:
          type: [array, "null"]
          items: { type: integer, minimum: 0, maximum: 255 }
    MediaKind:
      type: string
      enum: [image, audio, visual]

    # -------------------------------------------------------- messages
    MessageType:
      type: string
      enum: [text, file, voice, system]
    Reaction:
      type: object
      required: [emoji, user_id]
      properties:
        emoji: { type: string, minLength: 1, maxLength: 32 }
        user_id: { $ref: "#/components/schemas/Id" }
    ReadReceipt:
      type: object
      required: [user_id, read_at]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        read_at: { $ref: "#/components/schemas/Timestamp" }
    ForwardedFrom:
      type: object
      required: [message_id, sender_id, sender_name]
      properties:
        message_id: { $ref: "#/components/schemas/Id" }
        sender_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        sender_name: { type: string }
    ReplyPreview:
      type: object
      description: |
        What a reply shows of the message it answers, so a client can draw the quote without loading that
        message. Set on messages of history pages and `message` events when the recipient can see the answered
        message; absent when it is gone or hidden for them, and on chat-list previews and search results.
      required: [id, type, sender, content, attachment, is_deleted]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/MessageType" }
        sender:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        content:
          type: [string, "null"]
          maxLength: 100
          description: The first 100 characters of the text or caption; `null` when deleted or empty.
        attachment:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        is_deleted: { type: boolean }
    Message:
      type: object
      required:
        - id
        - chat_id
        - type
        - sender
        - content
        - attachment
        - reply_to
        - forwarded_from
        - reactions
        - read_by
        - created_at
        - edited_at
        - is_deleted
      properties:
        id: { $ref: "#/components/schemas/Id" }
        chat_id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/MessageType" }
        sender:
          description: "`null` for system messages."
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        content:
          type: [string, "null"]
          maxLength: 4096
          description: Text, or the caption of a file; `null` when deleted.
        attachment:
          oneOf:
            - $ref: "#/components/schemas/Attachment"
            - type: "null"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        reply_preview:
          $ref: "#/components/schemas/ReplyPreview"
        forwarded_from:
          oneOf:
            - $ref: "#/components/schemas/ForwardedFrom"
            - type: "null"
        attachments:
          type: array
          description: Ordered images and videos of an album. The first item is also returned as attachment for older clients.
          minItems: 2
          maxItems: 10
          items: { $ref: "#/components/schemas/Attachment" }
        reactions:
          type: array
          items: { $ref: "#/components/schemas/Reaction" }
        read_by:
          type: array
          items: { $ref: "#/components/schemas/ReadReceipt" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        edited_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        is_deleted: { type: boolean }
        system_event:
          $ref: "#/components/schemas/SystemEvent"
        client_temp_id: { $ref: "#/components/schemas/ClientTempId" }
    LinkPreview:
      type: object
      required: [url, title, description, site_name, image]
      properties:
        url:
          type: string
          description: The page after redirects
        title: { type: [string, "null"], maxLength: 300 }
        description: { type: [string, "null"], maxLength: 500 }
        site_name: { type: [string, "null"], maxLength: 100 }
        image:
          oneOf:
            - $ref: "#/components/schemas/LinkPreviewImage"
            - type: "null"
    LinkPreviewImage:
      type: object
      required: [url, width, height]
      properties:
        url:
          type: string
          description: "`GET /link-preview/image` with the signed address of the page's image"
        width: { type: [integer, "null"], minimum: 1 }
        height: { type: [integer, "null"], minimum: 1 }
    SystemEventKind:
      type: string
      enum: [group_created, member_added, member_joined, member_removed, member_left, call]
    SystemEvent:
      type: object
      description: |
        What a `system` message records; set on system messages only, whose `content` is then `null`. The names
        are the display names at the time of the event. `target` fields are set for `member_added` and
        `member_removed`. `call` is set for `call` messages: one per call, posted when the call ends, `actor` is the
        initiator.
      required: [kind, actor_id, actor_name]
      properties:
        kind: { $ref: "#/components/schemas/SystemEventKind" }
        actor_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        actor_name: { type: string }
        target_id: { $ref: "#/components/schemas/Id" }
        target_name: { type: string }
        call: { $ref: "#/components/schemas/CallSummary" }
    MessagePage:
      type: object
      required: [items, next_cursor, prev_cursor]
      properties:
        items:
          type: array
          description: Oldest to newest
          items: { $ref: "#/components/schemas/Message" }
        next_cursor:
          description: |
            Continues in the direction of the request: pass it as `before` (older) for the
            default, `before` and `around` requests, or as `after` (newer) for `after` requests.
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        prev_cursor:
          description: The opposite direction (`after` for the default request, `before` for an `after` request).
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
    SearchHit:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        highlight:
          type: [string, "null"]
          description: |
            Plain-text excerpt of the matching text or file name; never HTML. The matched words are
            wrapped in U+E000 (start) and U+E001 (end), characters of the Unicode private use area,
            so a client can mark them without parsing markup. `null` when the message matched without
            an excerpt.
    MessageSearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    SendMessageRequest:
      type: object
      required: [client_temp_id, type]
      properties:
        client_temp_id: { $ref: "#/components/schemas/ClientTempId" }
        type:
          type: string
          enum: [text, file, voice]
        content:
          type: [string, "null"]
          maxLength: 4096
        attachment_id:
          description: Single upload ID for a file or voice message. Omit for albums.
          oneOf:
            - $ref: "#/components/schemas/AttachmentRef"
            - type: "null"
        attachment_ids:
          type: array
          description: Ordered IDs of two to ten image or video uploads for one file message.
          minItems: 2
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/AttachmentRef" }
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
      if:
        properties:
          type: { enum: [file, voice] }
      then:
        oneOf:
          - required: [attachment_id]
            properties:
              attachment_id: { $ref: "#/components/schemas/AttachmentRef" }
              attachment_ids: { not: {} }
          - required: [attachment_ids]
            properties:
              type: { const: file }
              attachment_id: { not: {} }
              attachment_ids: { type: array }
      else:
        required: [content]
        properties:
          content: { type: string, minLength: 1, maxLength: 4096 }
          attachment_id: { not: {} }
          attachment_ids: { not: {} }
    EditMessageRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 4096
          description: New text, or the new caption of a file. Empty removes a file's caption; a text message rejects it.
    ForwardMessageRequest:
      type: object
      required: [chat_ids]
      properties:
        chat_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    ForwardMessagesRequest:
      type: object
      required: [message_ids, chat_ids]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        chat_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    DeleteMessagesRequest:
      type: object
      required: [message_ids, scope]
      properties:
        message_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        scope:
          type: string
          enum: [me, everyone]
    MarkReadRequest:
      type: object
      required: [message_id]
      properties:
        message_id:
          description: Everything up to and including this message is read.
          $ref: "#/components/schemas/Id"

    # ------------------------------------------------- chats and groups
    ChatType:
      type: string
      enum: [direct, group]
    GroupRole:
      type: string
      description: A moderator may delete other members' messages; owners and admins also manage the group.
      enum: [owner, admin, moderator, member]
    GroupRoleEvent:
      type: object
      description: A member got a new role; `owner` means the actor transferred ownership to them.
      required: [id, actor, target, role, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        actor:
          description: "`null` when the account is gone."
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        target: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/GroupRole" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    GroupRoleLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Newest first, at most 100
          items: { $ref: "#/components/schemas/GroupRoleEvent" }
    Chat:
      type: object
      required:
        - id
        - type
        - name
        - avatar_url
        - peer
        - is_pinned
        - unread_count
        - last_message
        - created_at
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/ChatType" }
        name:
          type: string
          description: Display name of the peer or the group
        avatar_url: { type: [string, "null"] }
        peer:
          description: The other user of a direct chat; `null` for groups.
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        is_pinned: { type: boolean }
        unread_count: { type: integer, minimum: 0 }
        last_message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"
        my_role:
          description: Only for groups.
          oneOf:
            - $ref: "#/components/schemas/GroupRole"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ChatPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Chat" }
        next_cursor: { $ref: "#/components/schemas/Cursor" }
    CreateChatRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        initial_message:
          type: [string, "null"]
          maxLength: 4096
    GroupMember:
      type: object
      required: [user, role, joined_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/GroupRole" }
        joined_at: { $ref: "#/components/schemas/Timestamp" }
    Group:
      type: object
      required: [id, name, description, avatar_url, owner_id, my_role, members, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
        avatar_url: { type: [string, "null"] }
        owner_id: { $ref: "#/components/schemas/Id" }
        my_role: { $ref: "#/components/schemas/GroupRole" }
        members:
          type: array
          items: { $ref: "#/components/schemas/GroupMember" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    CreateGroupRequest:
      type: object
      required: [name, member_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
        member_ids:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    UpdateGroupRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, "null"], maxLength: 500 }
    AddParticipantRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, moderator, member]
    TransferOwnerRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }

    # -------------------------------------------------------- requests
    ApprovalRequestType:
      type: string
      enum: [direct_message, group_invite]
    ApprovalRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    ApprovalRequest:
      type: object
      required: [id, type, status, requester, created_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        type: { $ref: "#/components/schemas/ApprovalRequestType" }
        status: { $ref: "#/components/schemas/ApprovalRequestStatus" }
        requester: { $ref: "#/components/schemas/User" }
        group_name:
          type: [string, "null"]
          description: Only for `group_invite`
        preview:
          type: [string, "null"]
          description: First message of a direct-message request
        created_at: { $ref: "#/components/schemas/Timestamp" }

    DeviceRecoveryStart:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/Username"
    DeviceRecoveryResult:
      type: object
      required:
        - request_id
        - match_number
        - expires_at
      properties:
        request_id:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        match_number:
          type: integer
          minimum: 10
          maximum: 99
        expires_at:
          type: string
          format: date-time
    DeviceRecoveryStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - used
            - expired
    DeviceRecoveryApproval:
      type: object
      required:
        - match_number
      properties:
        match_number:
          type: integer
          minimum: 10
          maximum: 99
        passkey:
          $ref: "#/components/schemas/PasskeyVerification"
        code:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 1024
          deprecated: true
          description: Ignored. Older clients still send it.
    DeviceRecoveryApprovalOptions:
      type: object
      required:
        - method
      properties:
        method:
          type: string
          enum: [passkey, session]
        challenge_id:
          type: string
          minLength: 32
          maxLength: 128
          description: "Present with `method: passkey`."
        public_key:
          type: object
          additionalProperties: true
          description: "WebAuthn request options, present with `method: passkey`."
        approvable_from:
          type: string
          format: date-time
          description: "Present with `method: session` while the session is too new to approve."
    DeviceRecoveryComplete:
      type: object
      required:
        - new_password
      properties:
        new_password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true

    QrLoginStatus:
      type: string
      description: |
        `pending` until a signed-in device opens the request, `scanned` once it did, then `approved` or `denied`.
        `expired` when the request timed out or was used (only in poll answers).
      enum: [pending, scanned, approved, denied, expired]
    QrLoginStart:
      type: object
      required: [request_id, poll_token, url, expires_at]
      properties:
        request_id:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        poll_token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Secret of the requesting device; only a keyed hash is stored.
        url:
          type: string
          description: "`<RECOVERY_WEB_URL>/qr/<request_id>`, the content of the QR code."
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    QrLoginRequest:
      type: object
      required: [request_id, status, device, location, created_at, expires_at]
      properties:
        request_id: { type: string }
        status: { $ref: "#/components/schemas/QrLoginStatus" }
        device:
          type: [string, "null"]
          maxLength: 512
          description: User agent of the device that asks to sign in; `null` when it sent none.
        location:
          description: Approximate location of the device that asks to sign in; `null` when unknown.
          oneOf:
            - $ref: "#/components/schemas/Location"
            - type: "null"
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    QrLoginPollRequest:
      type: object
      required: [poll_token]
      properties:
        poll_token: { type: string, maxLength: 128, writeOnly: true }
    QrLoginPollResult:
      oneOf:
        - type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [pending, scanned, denied, expired]
        - allOf:
            - $ref: "#/components/schemas/TokenResponse"
            - type: object
              required: [status]
              properties:
                status: { type: string, const: approved }
    QrLoginApproval:
      type: object
      properties:
        code:
          type: string
          maxLength: 128
          description: An authenticator code or an unused recovery code; required when two-factor is on.

    PasskeyOptions:
      type: object
      required:
        - challenge_id
        - public_key
      properties:
        challenge_id: &a1
          type: string
          minLength: 32
          maxLength: 128
        public_key: &a2
          type: object
          additionalProperties: true
    PasskeyRegistration:
      type: object
      required:
        - password
        - name
      properties:
        password: &a4
          type: string
          maxLength: 128
          writeOnly: true
        code:
          type: string
          maxLength: 128
        name: &a3
          type: string
          minLength: 1
          maxLength: 64
    PasskeyVerification:
      type: object
      required:
        - challenge_id
        - credential
      properties:
        challenge_id: *a1
        credential: *a2
    PasskeyLoginOptions:
      type: object
      required: []
      properties:
        username:
          $ref: "#/components/schemas/Username"
    PasskeyRename:
      type: object
      required:
        - name
      properties:
        name: *a3
    PasskeyRemoval:
      type: object
      required: []
      properties:
        password: *a4
    Passkey:
      type: object
      required:
        - id
        - name
        - created_at
        - last_used_at
      properties:
        id:
          type: string
        name: *a3
        created_at:
          type: string
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
    PasskeyPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"

    RecoveryEmailStatus:
      type: object
      required:
        - address
        - state
        - enabled
      properties:
        address:
          type: string
        state:
          type: string
          enum:
            - not_added
            - pending
            - verified
        enabled:
          type: boolean
    RecoveryOverview:
      type: object
      required:
        - recovery_key
        - other_devices
        - passkeys
        - passkeys_enabled
        - email
      properties:
        recovery_key:
          $ref: "#/components/schemas/RecoveryKeyStatus"
        other_devices:
          type: integer
          minimum: 0
        passkeys:
          type: integer
          minimum: 0
        passkeys_enabled:
          type: boolean
        email:
          $ref: "#/components/schemas/RecoveryEmailStatus"
    SetRecoveryEmail:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password: &a1
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        code: &a2
          type: string
          maxLength: 128
    RemoveRecoveryEmail:
      type: object
      required:
        - password
      properties:
        password: *a1
        code: *a2
    VerifyRecoveryEmail:
      type: object
      required:
        - token
      properties:
        token: &a3
          type: string
          minLength: 32
          maxLength: 128
    EmailResetRequest:
      type: object
      required:
        - username_or_email
      properties:
        username_or_email:
          type: string
          maxLength: 254
    EmailResetConfirmation:
      type: object
      required:
        - token
        - new_password
      properties:
        token: *a3
        new_password: *a1
        code: *a2
    EmailResetAccepted:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    # ----------------------------------------------------------- calls
    CallConfig:
      type: object
      required: [enabled, max_participants, ring_timeout_seconds]
      properties:
        enabled: { type: boolean }
        max_participants:
          type: integer
          minimum: 2
          description: Most sessions joined to one call at the same time.
        ring_timeout_seconds:
          type: integer
          minimum: 1
          description: How long an invitation rings before it counts as missed.
    CallIdentityRequest:
      type: object
      required: [public_key]
      properties:
        public_key: { $ref: "#/components/schemas/CallIdentityKey" }
    CallIdentityKey:
      type: string
      description: |
        P-256 public key as an uncompressed point (65 bytes, first byte `0x04`), base64url without padding.
      minLength: 87
      maxLength: 87
      pattern: "^[A-Za-z0-9_-]+$"
    CallState:
      type: string
      description: "`ringing` until someone answers, `active` while people are in it, `ended` afterwards."
      enum: [ringing, active, ended]
    CallEndReason:
      type: string
      description: |
        Why the call ended: `completed` (people talked), `missed` (nobody answered in time), `declined` (the peer of a
        direct call declined), `cancelled` (the caller hung up before an answer), `failed` (the media service lost
        the call).
      enum: [completed, missed, declined, cancelled, failed]
    CallParticipantState:
      type: string
      description: "`left` and `declined` can become `joined` again in a group call."
      enum: [ringing, joined, declined, missed, left]
    CallParticipant:
      type: object
      required: [user_id, state, session_id, identity_key, joined_at]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/CallParticipantState" }
        session_id:
          description: The session that joined; `null` unless `state` is `joined`.
          oneOf:
            - { type: string, format: uuid }
            - type: "null"
        identity_key:
          description: Call identity of the joined session; `null` unless `state` is `joined`.
          oneOf:
            - $ref: "#/components/schemas/CallIdentityKey"
            - type: "null"
        joined_at:
          description: When the participant last joined; `null` if never.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    Call:
      type: object
      required:
        - id
        - chat_id
        - kind
        - state
        - end_reason
        - initiator_id
        - created_at
        - started_at
        - ended_at
        - ring_expires_at
        - epoch
        - version
        - max_participants
        - participants
      properties:
        id: { $ref: "#/components/schemas/Id" }
        chat_id: { $ref: "#/components/schemas/Id" }
        kind:
          type: string
          enum: [direct, group]
        state: { $ref: "#/components/schemas/CallState" }
        end_reason:
          oneOf:
            - $ref: "#/components/schemas/CallEndReason"
            - type: "null"
        initiator_id: { $ref: "#/components/schemas/Id" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        started_at:
          description: First answer; `null` while nobody answered.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        ended_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        ring_expires_at:
          description: When ringing invitations of this call turn into `missed`.
          $ref: "#/components/schemas/Timestamp"
        epoch:
          type: integer
          minimum: 0
          description: Key epoch; increases whenever the set of joined sessions or their identity keys change.
        version:
          type: integer
          minimum: 1
          description: Increases with every change of the call; ignore events with a lower version than one already seen.
        max_participants: { type: integer, minimum: 2 }
        participants:
          type: array
          description: Everyone invited or joined, the initiator first.
          items: { $ref: "#/components/schemas/CallParticipant" }
    CallList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Call" }
    StartCallRequest:
      type: object
      required: [client_request_id]
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Idempotency key chosen by the client.
    JoinCallRequest:
      type: object
      properties:
        takeover:
          type: boolean
          default: false
          description: Move the user's participation from another session to this one.
    CallGrant:
      type: object
      required: [url, token, identity, expires_at]
      properties:
        url:
          type: string
          description: WebSocket URL of the media server (`wss://`).
        token:
          type: string
          description: Media access token for this call and session only; microphone audio only.
        identity:
          type: string
          description: The participant identity inside the media room (`<user_id>:<session_id>`).
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    CallJoin:
      type: object
      required: [call, grant]
      properties:
        call: { $ref: "#/components/schemas/Call" }
        grant: { $ref: "#/components/schemas/CallGrant" }
    CallKeyEnvelope:
      type: object
      description: An HPKE Auth-mode envelope carrying one sender key (see `docs/calls-e2ee.md`).
      required: [epoch, sender_user_id, sender_session_id, recipient_session_id, enc, ciphertext]
      properties:
        epoch: { type: integer, minimum: 0 }
        sender_user_id: { $ref: "#/components/schemas/Id" }
        sender_session_id: { type: string, format: uuid }
        recipient_session_id: { type: string, format: uuid }
        enc:
          type: string
          description: HPKE encapsulated key, base64url without padding.
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        ciphertext:
          type: string
          description: Sealed sender key, base64url without padding.
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    CallKeyEnvelopeList:
      type: object
      required: [call_id, epoch, items]
      properties:
        call_id: { $ref: "#/components/schemas/Id" }
        epoch: { type: integer, minimum: 0 }
        items:
          type: array
          items: { $ref: "#/components/schemas/CallKeyEnvelope" }
    SendCallKeysRequest:
      type: object
      required: [epoch, envelopes]
      properties:
        epoch: { type: integer, minimum: 0 }
        envelopes:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/OutgoingCallKeyEnvelope" }
    OutgoingCallKeyEnvelope:
      type: object
      required: [recipient_session_id, enc, ciphertext]
      properties:
        recipient_session_id: { type: string, format: uuid }
        enc:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        ciphertext:
          type: string
          maxLength: 256
          pattern: "^[A-Za-z0-9_-]+$"
    CallSummary:
      type: object
      description: The call a `call` system message records.
      required: [call_id, kind, outcome, duration_seconds]
      properties:
        call_id: { $ref: "#/components/schemas/Id" }
        kind:
          type: string
          enum: [direct, group]
        outcome: { $ref: "#/components/schemas/CallEndReason" }
        duration_seconds:
          description: From the first answer to the end; `null` if nobody answered.
          oneOf:
            - { type: integer, minimum: 0 }
            - type: "null"

openapi: 3.1.0
info:
  title: Messenger API
  version: 2.1.0-alpha.53
  summary: REST contract of the Messenger backend (v2).
  description: |
    Contract for the Go backend. The WebSocket protocol is described in `websocket/` and
    `websocket.md`; the entity schemas below are shared by both.

    ## Conventions

    - Base path `/api/v2`. Breaking changes need a new MAJOR version with a new base path
      (see `docs/api-compatibility.md`).
    - All IDs are **strings** in JSON. Message IDs are 64-bit Snowflake IDs, larger than
      JavaScript's safe integer limit (2^53), so they must never be parsed as numbers.
    - Timestamps are RFC 3339 UTC (`2026-10-04T12:00:00Z`).
    - Errors are `application/problem+json` (RFC 9457) with a stable `code`; clients switch on
      `code`, never on `title` or `detail`.
    - Lists use cursor pagination: `limit` plus `before`, `after` or `around`, and responses
      return `next_cursor` (and `prev_cursor` for messages). Cursors are opaque to clients
      except for message history, where they are message IDs.
    - Enums can grow in a MINOR version; clients must handle unknown values with a fallback.
    - Clients send `X-Client-Version` (app version) and `X-Client-Api-Version` (the contract
      version they were built with). A different MAJOR or a version below
      `min_client_api_version` gets `426` with `code: client_outdated`.
    - Files are never referenced by a client-supplied URL: upload with `POST /attachments`,
      then refer to the returned `attachment_id`.
    - Statuses any operation may answer, not repeated per operation: `413` (body over the size
      limit, `payload_too_large`) and `415` (a body that is not `application/json`,
      `unsupported_media_type`) for operations with a body; `500` (a bug) and `503` (a store is
      away; retry after `Retry-After`) for all.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v2
    description: Same origin as the web app (reverse proxy)
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Versions of the backend and the contract
  - name: auth
    description: Registration, login, tokens and account recovery
  - name: me
    description: The current user's profile, security and privacy
  - name: users
    description: Other users
  - name: chats
    description: Direct chats, pinning, read state and message history
  - name: groups
    description: Group chats and their members
  - name: messages
    description: Edit, delete and forward messages
  - name: attachments
    description: File and voice uploads
  - name: stickers
    description: Sticker packs, the sticker panel and recently sent stickers
  - name: emoji
    description: Custom emoji packs and group emoji
  - name: requests
    description: Approval requests (direct messages and group invites)
  - name: websocket
    description: Realtime connection (see `websocket.md`)
  - name: imports
    description: Chat histories imported from other messengers
  - name: calls
    description: Audio calls (see `docs/calls.md` and `docs/calls-e2ee.md`)
  - name: maps
    description: Map tiles and map images of location messages, served through the server (see `docs/maps.md`)
  - name: public
    description: Profile and group cards for people without an account, and link previews (see `docs/sharing.md`)

paths:
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Backend and contract versions
      description: No authentication. Cacheable for 60 seconds.
      security: []
      responses:
        "200":
          description: Versions
          headers:
            Cache-Control:
              description: "`public, max-age=60`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------- auth
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/DeviceProof"
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/DeviceProof"
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      description: Answers with a login challenge instead of tokens when two-factor authentication is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Signed in, or a two-factor challenge
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login/2fa:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/DeviceProof"
    post:
      tags: [auth]
      operationId: loginTwoFactor
      summary: Finish a login with a two-factor code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorLoginRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/DeviceProof"
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Get a new access token
      description: Uses the HttpOnly refresh cookie and rotates it.
      security:
        - cookieAuth: []
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: New access token
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Signed out; the refresh cookie is cleared
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/recover/key:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/DeviceProof"
    post:
      tags: [auth]
      operationId: recoverWithKey
      summary: Reset password with a single-use recovery key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverWithKeyRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/recovery-key:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [auth]
      operationId: getRecoveryKey
      summary: Get recovery-key status without revealing its hash
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryKeyStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [auth]
      operationId: replaceRecoveryKey
      summary: Create or regenerate a recovery key after password and second-factor confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceRecoveryKeyRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryKeyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/security-events:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [auth]
      operationId: listSecurityEvents
      summary: List the last 50 security events of this account
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /ws/ticket:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [websocket]
      operationId: createWebSocketTicket
      summary: Get a one-time ticket for the WebSocket
      description: |
        The ticket is valid for a few seconds and can be used once at
        `/api/v2/ws?ticket=…`; it replaces tokens in the URL.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSocketTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ me
  /me:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getMe
      summary: Current user
      responses:
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the profile
      description: Replaces `PUT /me` and `POST /me/bio` of v1. Only the sent fields change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Account deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: setMyAvatar
      summary: Set the avatar from an uploaded attachment
      description: "Replaces both avatar routes of v1. Upload the image with `POST /attachments` (`purpose: avatar`) first."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/avatars/{avatar_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: avatar_id
        in: path
        required: true
        description: "`id` of an `AvatarVersion` of the caller."
        schema: { $ref: "#/components/schemas/Id" }
    delete:
      tags: [me]
      operationId: deleteMyAvatar
      summary: Delete one of your avatars
      description: |
        Removes the avatar from your history. When it is the current one, the newest remaining avatar becomes
        current again; without one you get the default avatar. The image is deleted from storage once nothing
        uses it any more.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/music:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: setMyMusic
      summary: Set the profile music
      description: "Upload the file with `POST /attachments` (`purpose: profile_music`) first."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetMusicRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteMyMusic
      summary: Remove the profile music
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/background:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: setMyBackground
      summary: Set the profile background
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBackgroundRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteMyBackground
      summary: Remove the profile background
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/client-settings:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getClientSettings
      summary: Appearance and recent emoji shared by all of the caller's devices
      description: |
        `appearance` is `null` until a device saved it once. Theme and language are not part of it; they stay on each
        device.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateClientSettings
      summary: Change some of the synced settings
      description: |
        Send only the parts that changed; each part replaces the stored one (last write wins). `version` goes up on
        every change. Sends `client_settings_updated` with the result to all of the caller's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateClientSettingsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/wallpapers:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listWallpapers
      summary: The caller's chat backgrounds
      description: |
        The default background for all chats (`chat_id: null`) and every chat with its own background. A chat
        without an entry uses the default; without a default, clients show their built-in plain background.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Backgrounds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallpaperList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/wallpapers/default:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: setDefaultWallpaper
      summary: Set the background for all chats
      description: |
        For `media`, upload the image with purpose `chat_wallpaper` first. Sends `wallpaper_updated` to the caller's
        sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetWallpaperRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The stored background
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallpaperEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteDefaultWallpaper
      summary: Go back to the built-in background for all chats
      description: Chats with their own background keep it. Sends `wallpaper_updated` to the caller's sessions.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chats/{chat_id}/wallpaper:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [chats]
      operationId: setChatWallpaper
      summary: Set the background of one chat
      description: |
        Only the caller sees it, unless `for_both` is `true`: in a direct chat with another person this stores the
        same background for both of them (each can change or reset their own copy afterwards), posts the system line
        `chat_wallpaper_set` and sends `wallpaper_updated` to both. `for_both` is refused with `403` in groups and
        Saved Messages, and with `403` `blocked_by_user` when either person blocked the other. For `media`, upload
        the image with purpose `chat_wallpaper` first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetChatWallpaperRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The caller's background of this chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallpaperEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [chats]
      operationId: deleteChatWallpaper
      summary: Use the default background in this chat again
      description: Only the caller's copy is removed. Sends `wallpaper_updated` to the caller's sessions.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/playlists:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listPlaylists
      summary: The caller's playlists, newest first, without their tracks
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Playlists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      operationId: createPlaylist
      summary: Create a playlist
      description: |
        At most 100 playlists per user (`409` `limit_reached`). Sends `playlists_updated` to the caller's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePlaylistRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Created playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/playlists/{playlist_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/PlaylistId"
    get:
      tags: [me]
      operationId: getPlaylist
      summary: A playlist with its tracks
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [me]
      operationId: renamePlaylist
      summary: Rename a playlist
      description: Sends `playlists_updated` to the caller's sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenamePlaylistRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Renamed playlist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaylistSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deletePlaylist
      summary: Delete a playlist
      description: Sends `playlists_updated` to the caller's sessions.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/playlists/{playlist_id}/tracks:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/PlaylistId"
    put:
      tags: [me]
      operationId: replacePlaylistTracks
      summary: Replace the tracks of a playlist
      description: |
        The full ordered list, so adding, removing and moving tracks are one call. `version` must be the playlist's
        current version; otherwise `409` `conflict` and nothing changes (load the playlist again and reapply the
        change). At most 1000 tracks and each attachment once (`422`). Sends `playlists_updated` to the caller's
        sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePlaylistTracksRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Playlist after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playlist" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/password:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the password
      description: "Revokes all other sessions. A wrong current password answers `403` with `code: invalid_credentials`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204":
          description: Password changed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/security:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getSecuritySettings
      summary: Security settings
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateSecuritySettings
      summary: Change the session duration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSecuritySettingsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/storage-key:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: getStorageKey
      summary: The key this device encrypts its offline data with
      description: |
        Returns the key of the current session, creating it on the first call; later calls return the same
        key. It is deleted with the session, so data a device stored can no longer be read once it signs out
        or is signed out from another device.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Key of this session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listSessions
      summary: Signed-in devices
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Sessions of the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: revokeOtherSessions
      summary: Sign out everywhere except this device
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Other sessions revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Sign out one device
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Session revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/2fa/setup:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: setupTwoFactor
      summary: Start two-factor setup
      description: "Returns the secret and an `otpauth://` URI; two-factor stays off until confirmed. A wrong password answers `403` with `code: invalid_credentials`; `409` when two-factor is already on."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/2fa/confirm:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: confirmTwoFactor
      summary: Turn two-factor on with a code
      description: "Returns the recovery codes. They are shown only once, so store them safely."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Two-factor authentication enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorRecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/2fa/disable:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: disableTwoFactor
      summary: Turn two-factor off
      description: "A wrong password or code answers `403` (`invalid_credentials` or `invalid_two_factor_code`); a correct password without `code` answers `401` with `code: two_factor_required`; `409` when two-factor is off."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTwoFactorRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204":
          description: Two-factor authentication disabled
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/privacy:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getPrivacySettings
      summary: Privacy settings and exceptions
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updatePrivacySettings
      summary: Update privacy settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePrivacySettingsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/privacy/exceptions/{setting_key}/{effect}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: setting_key
        in: path
        required: true
        schema:
          type: string
          enum: [avatar_visibility, profile_visibility, presence_visibility, last_seen_visibility, birthday_visibility, group_invites, direct_messages, search_visibility, calls_from, voice_video_messages, forward_link]
      - name: effect
        in: path
        required: true
        schema:
          type: string
          enum: [allow, deny]
    put:
      tags: [me]
      operationId: replacePrivacyExceptions
      summary: Replace the exception list of one setting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyExceptionsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/blocked-users:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listBlockedUsers
      summary: Blocked users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of blocked users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/blocked-users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [me]
      operationId: blockUser
      summary: Block a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Blocked (also when already blocked)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [me]
      operationId: unblockUser
      summary: Unblock a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Unblocked (also when not blocked)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- users
  /users:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [users]
      operationId: searchUsers
      summary: Search users by username or display name
      description: Users whose `search_visibility` is `nobody` are not returned.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /usernames/{username}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [users]
      operationId: getUserByUsername
      summary: Profile by username
      description: |
        Like `GET /users/{user_id}`: a user whose `search_visibility` hides them from the current user (`nobody`
        without an `allow` exception, or a `deny` exception) is `404` unless the two share a chat. Lookups are
        rate limited per user.
      parameters:
        - name: username
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user, as visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/connections:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listMyConnections
      summary: Your connected accounts
      description: In your order. At most 15.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Connected accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/connections/order:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: reorderMyConnections
      summary: Order your connected accounts
      description: "`ids` must name every connected account once (`422` otherwise)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionOrderRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Connected accounts in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: connection_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    delete:
      tags: [me]
      operationId: deleteMyConnection
      summary: Remove a connected account
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/connections/{provider}/start:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ConnectionProviderPath"
    post:
      tags: [me]
      operationId: startConnection
      summary: Start connecting an account at a provider that signs you in
      description: |
        For the providers that sign the user in (GitHub, Spotify, Steam, Xbox, Discord, Twitch, YouTube, Reddit,
        Roblox, TikTok). Send the browser to `redirect_url`; it comes back through `GET /connections/callback/{provider}`,
        which ends on the web app with `?provider=` and `result=` (`connected`, `denied`, `failed`, `limit`). The link
        is valid for 10 minutes. `404` when the provider is not enabled on this server, `422` for a provider that is
        verified with `claim` and `verify` instead.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Where to send the browser
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionStart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/connections/{provider}/claim:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ConnectionProviderPath"
    post:
      tags: [me]
      operationId: claimConnection
      summary: Start verifying a Bluesky handle, a Mastodon account or a website
      description: |
        Returns a code the user puts where only the owner can: the Bluesky profile description, the Mastodon bio
        or a profile field, or for a website a DNS TXT record on the domain or a
        `<meta name="messenger-verification" content="...">` tag on its home page. Then call `verify` within an
        hour. A new claim replaces the previous one for the same provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionClaimRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The code to publish
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionChallenge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/connections/{provider}/verify:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ConnectionProviderPath"
    post:
      tags: [me]
      operationId: verifyConnection
      summary: Check the published code and connect the account
      description: "`422` when there is no open claim or the code was not found; the claim stays open until it expires."
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /connections/callback/{provider}:
    parameters:
      - $ref: "#/components/parameters/ConnectionProviderPath"
    get:
      tags: [me]
      operationId: connectionCallback
      summary: Where a provider sends the browser back
      description: |
        No authentication: the one-time `state` from `start` names the user. Always answers with a redirect to the
        web app (`?provider=` and `result=`).
      security: []
      responses:
        "302":
          description: Back to the web app
          headers:
            Location:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{user_id}/connections:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: user_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      tags: [users]
      operationId: listUserConnections
      summary: A user's connected accounts
      description: Visible like the bio (`profile_visibility`); empty when hidden.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "200":
          description: Connected accounts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectionList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/common-groups:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: user_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Id" }
    get:
      tags: [users]
      operationId: listCommonGroups
      summary: Groups the caller and the user are both in
      description: Newest activity first. Empty for the caller's own id.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommonGroupPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: Profile by ID
      description: |
        A user whose `search_visibility` hides them from the current user (`nobody` without an `allow` exception,
        or a `deny` exception) is `404` unless the two share a chat. Your own profile is always found. Lookups are
        rate limited per user.
      responses:
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user, as visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{user_id}/report:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [users]
      operationId: reportUser
      summary: Report a user
      description: |
        One active report per reporter and user; reporting again changes the reason and the note. The reported user
        never learns who reported them. `block` (default `true`) also blocks the user, like
        `PUT /me/blocked-users/{user_id}`. Reporting yourself is `422`. At most 20 reports a day (`429`).
        Reports drive the reported user's account status automatically (`GET /me/account-status`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUserRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reported
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [users]
      operationId: unreportUser
      summary: Withdraw a report
      description: Withdraws the current user's report on the user. Withdrawing a report that does not exist is fine.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Withdrawn
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/account-status:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getAccountStatus
      summary: The current user's account status
      description: |
        The status follows the reports on the account automatically (`docs/moderation.md`), unless a person on the
        moderation team decided it (`decided_by: staff`, with `reason_code` and `reason_text`). `restrictions` lists
        what the status blocks. The WebSocket event `account_status` carries the same object when it changes.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The account status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/account-status/appeal:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: appealAccountStatus
      summary: Appeal the account status
      description: |
        Automatic appeal (probation): the status drops one level for 14 days. Without a new weighted report in that
        time the lower level stays; a new one restores the status and blocks appeals for 90 days. Allowed once per
        30 days and only when `can_appeal` is `true`, otherwise `409`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The new account status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/report-outcomes:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listReportOutcomes
      summary: Outcomes of the current user's reports
      description: |
        Short notices about reports the current user made: the moderation team took action or found no violation.
        They never say what action was taken. Newest first, at most 50, kept for 90 days. A new one also arrives as
        the WebSocket event `report_outcome`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The report outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportOutcomeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/report-outcomes/{outcome_id}/read:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ReportOutcomeId"
    post:
      tags: [me]
      operationId: markReportOutcomeRead
      summary: Mark a report outcome as read
      description: Marking an outcome that is already read is fine.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Marked as read
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/account-status/review:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: requestAccountReview
      summary: Ask for a review of the account status by a person
      description: |
        Stores the request with the user's text and the current status for the moderation team, who review the
        account and decide; the decision arrives as an account status with `decided_by: staff` and the reason. Allowed while the
        status is not `good` and no request is open (`can_request_review`), otherwise `409`; at most 3 requests in
        30 days, otherwise `429`. A request closes when a person decides or when the status returns to `good`. The
        answer and the WebSocket event `account_status` carry `review_requested_at`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountReviewRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The account status with the open request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{user_id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserAvatar
      summary: Current avatar image
      description: |
        Respects the avatar visibility of the user; falls back to the default avatar. With `version`, an
        earlier avatar of the history (`AvatarVersion.url`). `avatar_url` carries `rev`, the revision of the
        current avatar: while it matches, the answer may be cached for a year (`immutable`), because a new
        avatar gets a new `rev` and so a new URL.
      parameters:
        - name: version
          in: query
          description: "`id` of an `AvatarVersion` of this user."
          schema: { $ref: "#/components/schemas/Id" }
        - name: rev
          in: query
          description: Revision of the current avatar, as given in `avatar_url`.
          schema: { type: string, maxLength: 64 }
        - name: size
          in: query
          description: |
            The size the client shows the avatar at, in device pixels. The answer is the smallest stored WebP of
            64, 128 or 256 px that is at least that large, or the original when there is none.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range (`Range` header)
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "416":
          description: The requested range is outside the file
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/avatars:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: listUserAvatars
      summary: Avatar history
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of previous avatars, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvatarVersion" }
                  next_cursor: { $ref: "#/components/schemas/Cursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/contact-name:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setContactName
      summary: Set your own display name for a user
      description: |
        Follows the rules of `GET /users/{user_id}`: a user whose `search_visibility` hides them from you is `404`
        unless the two of you share a chat, and the calls count against the same per-user limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactNameRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user with the contact name applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [users]
      operationId: removeContactName
      summary: Remove your display name for a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------- attachments
  /attachments:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload a file, image, audio or voice message
      description: |
        The server checks the content, not the file name or the client's content type. The
        returned `attachment_id` is used in messages (`type: file` or `voice`) or for
        avatars. Attachments that are not used within 24 hours are deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadAttachmentRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /attachments/{attachment_id}/content:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: Download an attachment
      description: |
        Only the uploader and members of a chat in which a message using the attachment is visible to them can
        download it. The answer is the file, or a `302` redirect to a short-lived signed URL of the object
        storage. Images, audio and video are sent `inline`; everything else as a download
        (`Content-Disposition: attachment`, `application/octet-stream`), always with
        `X-Content-Type-Options: nosniff`.

        Without a bearer token the request needs `pt`, a playback token from
        `POST /attachments/{attachment_id}/playback`, so a `<video>` or `<audio>` element can stream the file with
        range requests.

        Without `variant`, a video or audio file the server optimized (it then has a `source_url`) is answered
        with the optimized copy (H.264/AAC MP4 or AAC M4A); `variant=source` returns the file as uploaded.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: variant
          in: query
          description: |
            `thumbnail`: a WebP of at most 480 px (older uploads: a JPEG of at most 320 px); `thumbnail_url`.
            `display`: at most 1600 px for viewing a large still image (`display_url`); the original otherwise.
            `source`: the file as uploaded (`source_url`).
            `panel`, `message`: a sticker as a still 128 px or a 320 px WebP (`panel_url`, `message_url`).
            `animation`: a GIF as a muted, looping MP4 (`animation_url`).
            `inline`: a custom emoji at 64 px.
            `avatar_64`, `avatar_128`, `avatar_256`: a group avatar at that size.
            A variant the attachment does not have answers with the default content.
          schema:
            type: string
            enum: [thumbnail, display, source, panel, message, animation, inline, avatar_64, avatar_128, avatar_256]
        - name: pt
          in: query
          description: Playback token (`PlaybackUrl.url` carries it); only for requests without a bearer token.
          schema: { type: string, maxLength: 256 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range (`Range` header); players use it to seek
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "416":
          description: The requested range is outside the file
        "302":
          description: Redirect to a short-lived signed URL of object storage (`MEDIA_SIGNED_URLS`); not cached
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /attachments/{attachment_id}/playback:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/AttachmentId"
    post:
      tags: [attachments]
      operationId: createAttachmentPlayback
      summary: A short-lived URL to stream an attachment
      description: |
        Same access as `GET /attachments/{attachment_id}/content`. The answer is a URL that works without a bearer
        token for five minutes and only for this attachment, so media elements can stream it with range requests.
        Ask again when it expires (a `401` from the URL); the client keeps the playback position.
      parameters:
        - name: variant
          in: query
          schema:
            type: string
            enum: [source, animation]
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Playback URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /upload-sessions:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [attachments]
      operationId: createUploadSession
      summary: Start a resumable upload
      description: |
        For large files: the client sends the file in chunks of `chunk_size` bytes with
        `PUT /upload-sessions/{upload_id}/chunks`, can ask how much arrived with `GET`, and finishes with
        `POST /upload-sessions/{upload_id}/complete`, which checks the file like `POST /attachments`. Sessions
        without progress for 24 hours are deleted. At most 5 open sessions per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadSessionRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /upload-sessions/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UploadId"
    get:
      tags: [attachments]
      operationId: getUploadSession
      summary: How much of a resumable upload arrived
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [attachments]
      operationId: deleteUploadSession
      summary: Cancel a resumable upload
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /upload-sessions/{upload_id}/chunks:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UploadId"
    put:
      tags: [attachments]
      operationId: putUploadChunk
      summary: Send the next chunk of a resumable upload
      description: |
        `offset` must equal `received`; every chunk but the last is exactly `chunk_size` bytes. A chunk sent again
        after a lost answer gets `409` with the session, whose `received` tells where to continue.
      parameters:
        - name: offset
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Session after the chunk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`offset` is not where the upload stands"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /upload-sessions/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UploadId"
    post:
      tags: [attachments]
      operationId: completeUploadSession
      summary: Finish a resumable upload
      description: Checks and stores the file like `POST /attachments` and deletes the session.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Not all chunks arrived yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadSession" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # --------------------------------------------------------------- chats
  /chats:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [chats]
      operationId: listChats
      summary: My chats with last message and unread count
      description: |
        One request replaces `GET /chats/list/{username}` and `GET /groups/list/{username}`.
        Pinned chats come first (by `pin_position`), then the others by their last
        message (newest first). `last_message` is the newest message the caller can see; in
        direct chats its `read_by` holds the other user once they read it (with read receipts
        on), in groups it is empty. `unread_count` stops at 999.

        Direct chats that a stranger opened with the caller are in the caller's Requests folder
        (`is_request`). Without `folder` the answer holds only the main list, so the Requests
        folder needs `folder=requests` (or `folder=all` for both in one list).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
        - name: archived
          in: query
          required: false
          description: "`true`: only archived chats, `false`: only chats that are not archived. Without it, every chat."
          schema: { type: boolean }
        - name: folder
          in: query
          required: false
          description: "`main`: chats that are not requests (the default). `requests`: the caller's Requests folder. `all`: both."
          schema:
            type: string
            enum: [main, requests, all]
            default: main
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [chats]
      operationId: createChat
      summary: Start a direct chat
      description: |
        Respects the other user's `direct_messages` privacy setting. When approval is needed
        the answer is `202` with the pending request instead of a chat. Returns the existing
        chat (`200`) if there already is one. `user_id` may be the caller's own id: that opens
        their "Saved Messages" chat, a direct chat with the caller as its only member and as
        its `peer`.

        When the other user does not count the caller as a contact (no shared chat they took
        part in, no allow exception), the new chat lands in their Requests folder
        (`is_request: true` for them only) and its messages send them no push notification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChatRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The chat already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "201":
          description: Chat created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "202":
          description: Waiting for the other user's approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: getChat
      summary: One chat
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [chats]
      operationId: deleteChat
      summary: Delete a direct chat
      description: |
        `scope=everyone` (the default) deletes the chat and its messages for both users (as v1 did); both get
        `chat_deleted`. `scope=me` deletes it only for the caller: the chat leaves their list and its history up to
        now is hidden for them (as `POST /chats/{chat_id}/clear` with `scope: me`); only the caller's devices get
        `chat_deleted`. When a newer message arrives the chat comes back for the caller with only the newer messages.
        For groups use `DELETE /groups/{chat_id}` (owner) or `POST /groups/{chat_id}/leave`;
        a group here is `422`.
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [me, everyone]
            default: everyone
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /chats/{chat_id}/pin:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [chats]
      operationId: pinChat
      summary: Pin a chat
      description: |
        At most 10 chats can be pinned (`409` beyond that). A newly pinned chat goes to the top of the pinned
        chats and leaves the archive. Pinning a pinned chat changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Pinned
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [chats]
      operationId: unpinChat
      summary: Unpin a chat
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Unpinned
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/clear:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [chats]
      operationId: clearChatHistory
      summary: Clear the history of a chat
      description: |
        Clears every message up to the newest one now. `scope: me` hides them only for the caller (any member).
        `scope: everyone` removes them for every member: in a direct chat either user may do it, in a group the
        owner and admins (`403` for others). The chat itself stays. The caller's devices (`me`) or every member's
        (`everyone`) get `history_cleared`; messages up to `before_message_id` are no longer listed, counted as
        unread, found by search or shown as media.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClearHistoryRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Cleared
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /chats/{chat_id}/archive:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [chats]
      operationId: archiveChat
      summary: Archive a chat
      description: |
        Only for the caller. The chat leaves the pinned chats and stays archived when new messages arrive,
        until `DELETE` unarchives it. Archiving an archived chat changes nothing. The caller's devices get
        `chat_list_update`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Archived
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [chats]
      operationId: unarchiveChat
      summary: Move a chat out of the archive
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Not archived
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/requests/count:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [chats]
      operationId: countChatRequests
      summary: Number of chats in my Requests folder
      description: Chats deleted for the caller only count again once a newer message arrives.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The number of request chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatRequestCount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chats/{chat_id}/accept:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [chats]
      operationId: acceptChatRequest
      summary: Move a chat out of the Requests folder
      description: |
        The chat moves to the caller's main list (`is_request: false`) and the caller's devices get
        `chat_list_update`. Sending a message in the chat, pinning it or archiving it does the same.
        Reading it does not. Accepting a chat that is not a request changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Accepted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/pins/order:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [chats]
      operationId: reorderPinnedChats
      summary: Order the pinned chats
      description: |
        `chat_ids` must name every pinned chat of the caller exactly once (`422` otherwise), in the new order,
        top first. The caller's devices get `chat_list_update` for each pinned chat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinOrderRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reordered
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /chats/{chat_id}/read:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [chats]
      operationId: markChatRead
      summary: Mark messages as read up to a message
      description: Replaces the duplicate `/read` and `/read/` routes of v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: New unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listMessages
      summary: Message history
      description: |
        Replaces `GET /messages/history/{chat_id}`. Without a cursor the newest messages are
        returned. Items are always ordered oldest to newest. Send at most one of `before`,
        `after` and `around` (message IDs).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: Messages older than this message ID
          schema: { $ref: "#/components/schemas/Id" }
        - name: after
          in: query
          description: Messages newer than this message ID
          schema: { $ref: "#/components/schemas/Id" }
        - name: around
          in: query
          description: A window containing this message ID
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [chats]
      operationId: sendMessage
      summary: Send a message over HTTP
      description: |
        Same as the WebSocket `message` event, for clients without a connection. Sending the
        same `client_temp_id` again returns the existing message instead of creating a copy.
        A voice message, or a file message with a video, in a direct chat whose peer does not accept them from
        the sender (`voice_video_messages`) is refused with `403` (`forbidden`, field `voice_video_messages`)
        and kept as an unsent message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "200":
          description: Already created for this `client_temp_id`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/unsent:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listUnsentMessages
      summary: The caller's rejected sends of a chat
      description: |
        Sends the server rejected for a reason that may pass later (`forbidden`, `blocked_by_user`, `rate_limited`,
        `internal_error`), oldest first. They belong to the caller and are shown on all of the caller's devices.
        A later send with the same `client_temp_id` that succeeds removes the entry; at most 500 are kept per user.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Kept sends
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UnsentMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/unsent/{client_temp_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - name: client_temp_id
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ClientTempId" }
    delete:
      tags: [chats]
      operationId: deleteUnsentMessage
      summary: Discard a rejected send
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Discarded
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/messages/search:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: searchMessages
      summary: Search messages in a chat
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 256 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/media:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listChatMedia
      summary: Photos, videos, audio, voice messages, files or links of a chat
      description: Replaces `GET /messages/photos/{chat_id}` and `GET /messages/audios/{chat_id}`.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MediaKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Messages with matching attachments, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------ messages
  /messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit your text message or the caption of your file
      description: An empty `content` removes the caption of a file message; a text message needs at least one character.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Edited message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        `scope=me` hides it for the current user only (any message). `scope=everyone` removes
        it for all participants: own messages, any message of a direct chat (either side), and any message
        for group owners, admins and moderators.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [me, everyone]
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /messages/{message_id}/forward:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: forwardMessage
      summary: Forward a message to other chats
      description: |
        A voice message or a video forwarded into a direct chat whose peer does not accept them from the caller
        is refused with `403` (`forbidden`, field `voice_video_messages`), and nothing is forwarded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: One new message per target chat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/{message_id}/report:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: reportMessage
      summary: Report a message
      description: |
        Sends the message to moderation. The report keeps a copy of the message and of up to 5 messages before and
        after it that the reporter can see (sender, time, text and file names); moderators see only this copy, and it
        is deleted after 6 months. One active report per reporter and message; reporting again changes the reason
        and the note but keeps the first copy. `illegal` is a notice of illegal content and needs a `note` that
        explains why (`422` without it). A message the caller cannot see, a deleted message or a chat they are not in
        is `404`; their own messages and system messages are `422`. Reports of users, messages and groups share the
        limit of 20 a day (`429`). Reporting a message does not block anyone and does not change the sender's
        account status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentReportRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reported
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [messages]
      operationId: unreportMessage
      summary: Withdraw a message report
      description: Withdraws the current user's report on the message. Withdrawing a report that does not exist is fine.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Withdrawn
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chats/{chat_id}/messages/{message_id}/pin:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
    put:
      tags: [messages]
      operationId: pinMessage
      summary: Pin a message
      description: |
        `me` pins the message only for the caller. `everyone` pins it for every member: in a direct chat either
        user may, in a group only a moderator, admin or owner (`403` otherwise). Saved Messages, a chat in the
        caller's Requests folder and a direct chat with a block allow only `me` (`403` for `everyone`). System and
        call messages cannot be pinned (`422`); a message the caller cannot see is `404`. A chat holds at most 500
        pins for everyone, and each member at most 500 own pins in it (`409` `limit_reached`).

        Pinning a pinned message changes nothing, except that `me` shows a pin for everyone again that the caller
        hid. Pinning for everyone a message the caller pinned for themselves keeps their own pin underneath: it
        shows again when the pin for everyone is removed. Pinning or unpinning for everyone posts a system message
        (`message_pinned`, `message_unpinned`) without a push notification. Every change sends `pin_update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The pin as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedMessage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [messages]
      operationId: unpinMessage
      summary: Unpin a message
      description: |
        `me` removes the caller's own pin, or hides a pin for everyone only for the caller (it stays pinned for the
        others). `everyone` removes the pin for everyone: in a direct chat either user may; in a group a moderator,
        admin or owner whose role is at least the role the pinner has now (owner > admin > moderator; a pinner who
        left or is a member counts as member), otherwise `403`. `PinnedMessage.can_unpin_for_everyone` tells the
        client in advance. Unpinning a message that is not pinned changes nothing.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { $ref: "#/components/schemas/PinScope" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Unpinned
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/pins:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [messages]
      operationId: listPinnedMessages
      summary: The pinned messages of a chat as the caller sees them
      description: |
        Pins for everyone the caller did not hide, and the caller's own pins, newest pin first. A message pinned
        both ways appears once, as `everyone`. Messages the caller cannot see (deleted, deleted for them, cleared
        from their history) are left out. `Chat.pinned_message_count` counts the same pins.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Pinned messages, newest pin first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinnedMessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/messages/{message_id}/poll/votes:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
    put:
      tags: [messages]
      operationId: votePoll
      summary: Vote in a poll, change the vote or take it back
      description: |
        Replaces the caller's vote with `options` (indexes into `Poll.options`). An empty list takes the vote back.
        More than one option needs `multiple_answers` (`422`). A quiz takes one option, and its first answer is
        final (`409` `quiz_answered`). A closed poll answers `409` `poll_closed`. Members only; in a direct chat
        with a block `403`. Every change sends `poll_updated` to the members of the chat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PollVoteRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The poll as the caller sees it after the vote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Poll" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/{message_id}/poll/close:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: closePoll
      summary: Close a poll
      description: |
        The creator may close the poll; in a group also the owner and admins (`Poll.can_close`, `403` otherwise).
        Closing a closed poll changes nothing. A closed poll shows its results and the quiz answer to everyone and
        takes no more votes. Sends `poll_updated`; no system message and no push.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The closed poll as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Poll" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/messages/{message_id}/poll/voters:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [messages]
      operationId: listPollVoters
      summary: Who voted for an option of a public poll
      description: |
        Only for polls with `anonymous: false`, and only when the caller sees the results (`PollOption.voter_count` is
        not `null`); `403` otherwise. Newest vote first. Users appear as the caller may see them.
      parameters:
        - name: option
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 9 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Voters of the option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/imports:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [imports]
      operationId: listChatImports
      summary: The imported histories of a chat
      description: |
        Imports that are running or done, oldest period first. A sender the importer assigned to a member is
        `pending` or `declined` only for the importer and that member; everyone else sees it as `unassigned`
        without `user_id` until the member confirms.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The imports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImportList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [imports]
      operationId: startChatImport
      summary: Start importing a history from another messenger
      description: |
        The client parses the export (Telegram Desktop JSON or a WhatsApp chat export) on the device, uploads the
        files with `POST /attachments`, then sends the messages in order with `PUT /imports/{import_id}/messages`
        and ends with `POST /imports/{import_id}/finish`.

        In a direct chat either user may import, not in a chat in the Requests folder or with a block (`403`). In a
        group only an admin or the owner may (`403`). One import per chat runs at a time, and one per user: a user
        with a running import in any chat gets `409` until it is finished or removed. The messages are placed above
        the oldest message of the chat, in their original order; a second import goes next to the imports whose
        periods it follows, and an import whose period overlaps an existing one is `409`.

        A running import that gets no batch for 24 hours is removed like `DELETE /imports/{import_id}`
        (`import_update` with `removing`). Clients send the files of each batch right before the batch, so a long
        upload keeps the import alive.

        `senders` lists every name of the export. `me: true` marks the caller's own messages. `user_id` suggests a
        member of the chat for a name; that member confirms it after the import is finished. Every other name is
        shown as text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartChatImportRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The import, running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /imports/{import_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ImportId"
    get:
      tags: [imports]
      operationId: getChatImport
      summary: One import, for resuming it or showing its senders
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [imports]
      operationId: removeChatImport
      summary: Remove an imported history
      description: |
        The importer, or the owner of a group, removes every message of the import for everyone. The messages
        disappear at once (`import_update` with state `removing`); the worker deletes them afterwards.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "202":
          description: Removing
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /imports/{import_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ImportId"
    put:
      tags: [imports]
      operationId: addImportedMessages
      summary: Add the next batch of messages to a running import
      description: |
        Only the importer. `from_index` must be the import's `next_index`; a batch that was stored already answers
        with the current `next_index`, so a retry after a lost answer is safe. Another `from_index` is `409`.
        Attachments must be the importer's own uploads. Imported messages send no push and count as read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddImportedMessagesRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /imports/{import_id}/finish:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [imports]
      operationId: finishChatImport
      summary: Finish an import once every message is stored
      description: |
        Only the importer, once `next_index` equals `message_count` (`422` before). Adds the closing system
        message, tells every member to load the chat again (`import_update`, sync change `history_imported`) and
        asks each assigned member to confirm their messages (`import_sender_update`).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The finished import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /imports/{import_id}/senders/{sender_key}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ImportId"
      - $ref: "#/components/parameters/ImportSenderKey"
    put:
      tags: [imports]
      operationId: assignImportSender
      summary: Suggest a member for a name of the export, or take the suggestion back
      description: |
        Only the importer. `user_id` must be another member of the chat; `null` makes the name text again. A name
        that is `me` or `confirmed` cannot be reassigned, and a member who declined or withdrew a name cannot be
        suggested for it again (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignImportSenderRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The sender
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImportSender" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /imports/{import_id}/senders/{sender_key}/decision:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ImportId"
      - $ref: "#/components/parameters/ImportSenderKey"
    post:
      tags: [imports]
      operationId: decideImportSender
      summary: Confirm or decline that a name of the export is you, or withdraw a confirmation
      description: |
        Only the member the importer suggested, once the import is finished. `confirm` links the messages of the
        name to the caller's account for everyone; `decline` keeps them as text; `withdraw` turns a confirmed name
        back into text. After `decline` or `withdraw` the importer cannot suggest the caller for that name again.
        `404` when the caller is not the suggested member or the name is not in the matching state.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideImportSenderRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The sender
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatImportSender" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /chats/{chat_id}/messages/forward:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [messages]
      operationId: forwardMessages
      summary: Forward several messages of a chat to other chats
      description: |
        Copies up to 20 messages of the chat, oldest first, into every target chat, at most 20 copies in all. Every
        copy counts against the sender's message rate. Every message and target is checked before anything is
        written, so a refused one forwards nothing. Voice messages and videos follow the target peer's
        `voice_video_messages` (`403`, field `voice_video_messages`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardMessagesRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new messages, per target chat oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/delete:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [messages]
      operationId: deleteMessages
      summary: Delete several messages of a chat
      description: |
        Deletes up to 100 messages of the chat with the rules of `DELETE /messages/{message_id}`. Every message
        is checked first: when one may not be deleted, none is. With `scope` everyone, messages that are already
        deleted for everyone count as done, so a retry after a partial failure finishes the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteMessagesRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # -------------------------------------------------------------- search
  /search/messages:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: searchAllMessages
      summary: Search messages in all my chats
      description: |
        Full-text search across every chat the caller is in, newest first. Only chats the caller
        is a member of are searched, messages they deleted for themselves are left out, and every
        hit is checked against the message store before it is returned (a deleted message never
        shows, even when the index lags behind). Edits and deletions reach the results within a
        few seconds.

        With `kind`, only messages with that kind of attachment or with a web link are found, and `q` may be
        left out to list them newest first. Without `kind`, `q` is required (`422` otherwise).
      parameters:
        - name: q
          in: query
          description: Words to find; optional with `kind`
          schema: { type: string, minLength: 2, maxLength: 256 }
        - name: kind
          in: query
          description: Only messages with this kind of attachment, or with a web link (`link`)
          schema: { $ref: "#/components/schemas/MediaKind" }
        - name: chat_id
          in: query
          description: Only this chat
          schema: { $ref: "#/components/schemas/Id" }
        - name: sender_id
          in: query
          description: Only messages of this user
          schema: { $ref: "#/components/schemas/Id" }
        - name: type
          in: query
          schema:
            type: string
            enum: [text, file, voice, sticker]
        - name: from
          in: query
          description: Messages created at or after this time
          schema: { $ref: "#/components/schemas/Timestamp" }
        - name: to
          in: query
          description: Messages created before this time
          schema: { $ref: "#/components/schemas/Timestamp" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /sync/changes:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: listSyncChanges
      summary: What changed in my chats since a cursor
      description: |
        For clients that keep messages offline. Returns edits, reaction changes, deletions (for everyone or
        only for the caller), pin changes, cleared histories and chats the caller deleted for themselves,
        oldest first. New messages are not listed: load them with `after` from each chat's last stored message.
        Chats the caller left, was removed from or that were deleted are not listed either; they are missing
        from `GET /chats`.

        Call without `cursor` once to get the current position, then keep `next_cursor`. Several changes of one
        message come as one entry with its current state. Entries are kept for 30 days; an older cursor answers
        `reset_required: true` with a fresh `next_cursor`, and the client drops what it stored and loads again.
      parameters:
        - name: cursor
          in: query
          description: "`next_cursor` of the previous answer"
          schema: { type: string, pattern: "^[0-9]{1,19}$" }
        - name: limit
          in: query
          description: Page size
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Changes after the cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncChangesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------ requests
  /requests:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [requests]
      operationId: listApprovalRequests
      summary: Inbox of approval requests
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of pending requests
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalRequest" }
                  next_cursor: { $ref: "#/components/schemas/Cursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /requests/{request_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      operationId: approveRequest
      summary: Approve a request
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Approved; the chat or group membership now exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /requests/{request_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      operationId: rejectRequest
      summary: Reject a request
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Rejected
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------------- groups
  /groups:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [groups]
      operationId: listGroups
      summary: My groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of group chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      description: |
        Members whose `group_invites` setting requires approval get an approval request instead of being added.
        If any of them does not allow invitations from the caller at all, nothing is created (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /groups/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: getGroup
      summary: Group details and members
      responses:
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Change name or description
      description: A new name posts a `group_renamed` system message; the same name posts nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Delete the group (owner only)
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted for all members
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [groups]
      operationId: setGroupAvatar
      summary: Set the group avatar from an uploaded attachment
      description: |
        The attachment must be an image the caller uploaded with purpose `avatar` (`422` otherwise). Posts a
        `group_avatar_changed` system message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: deleteGroupAvatar
      summary: Remove the group avatar
      description: |
        Same permission as setting it. Posts a `group_avatar_changed` system message with `avatar_removed: true`;
        removing an avatar the group does not have changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/background:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [groups]
      operationId: setGroupBackground
      summary: Set the group background
      description: |
        Owner and admins. For `media`, the caller uploads the file with purpose `profile_background` first.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetBackgroundRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: deleteGroupBackground
      summary: Remove the group background
      description: Owner and admins.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/participants:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: listGroupMembers
      summary: Members of a group, page by page
      description: |
        Owner first, then admins, moderators and members, each by display name. `q` keeps members whose username starts
        with it or whose display name contains it (case-insensitive). `total` counts every member that matches.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of members
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMemberPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [groups]
      operationId: addGroupParticipant
      summary: Add a participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddParticipantRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group (the user may still be pending approval)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /groups/{chat_id}/participants/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [groups]
      operationId: updateGroupParticipantRole
      summary: Change a participant's role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: removeGroupParticipant
      summary: Remove a participant
      description: |
        The removed user is also banned from the group (`GET /groups/{chat_id}/bans`): they cannot rejoin by invite
        link or public name and cannot be added again until an admin lifts the ban.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/transfer-owner:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: transferGroupOwnership
      summary: Make another member the owner
      description: |
        The previous owner becomes an admin. Transferring to yourself is `422`. Posts an `owner_transferred` system
        message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnerRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /groups/{chat_id}/leave:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Leave the group
      description: The owner has to transfer ownership first.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Left
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /groups/{chat_id}/report:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: reportGroup
      summary: Report a group
      description: |
        Sends the group to moderation for its name, description or picture. The report keeps a copy of them; it is
        deleted after 6 months. Only members can report a group (`404` otherwise, also for direct chats). One active
        report per reporter and group; reporting again changes the reason and the note but keeps the first copy.
        `illegal` needs a `note` (`422` without it). Shares the limit of 20 reports a day with user and message
        reports (`429`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentReportRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reported
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [groups]
      operationId: unreportGroup
      summary: Withdraw a group report
      description: Withdraws the current user's report on the group. Withdrawing a report that does not exist is fine.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Withdrawn
        "401": { $ref: "#/components/responses/Unauthorized" }
  /groups/{chat_id}/role-log:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: getGroupRoleLog
      summary: Role changes of the group's members
      description: Who made whom an admin or a member, or transferred ownership, and when. Members only.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Role changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupRoleLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/invite-links:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: listGroupInviteLinks
      summary: Invite links of the group
      description: Owner and admins only (`403` for other members). Newest first, revoked and expired links included.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The links
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLinkList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [groups]
      operationId: createGroupInviteLink
      summary: Create an invite link
      description: |
        Owner and admins only. Anyone with the link joins the group directly, unless banned from it. At most 50
        active links per group (`409` `limit_reached`). Accounts at `limited` or above get `403`
        `account_restricted` (`share_group`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInviteLinkRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /groups/{chat_id}/invite-links/{link_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/InviteLinkId"
    patch:
      tags: [groups]
      operationId: updateGroupInviteLink
      summary: Rename an invite link or change its expiry or use limit
      description: Owner and admins only. A revoked link cannot be changed (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInviteLinkRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The updated link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: revokeGroupInviteLink
      summary: Revoke an invite link
      description: Owner and admins only. The link stops working at once; it stays in the list as revoked. Idempotent.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/public-name:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [groups]
      operationId: setGroupPublicName
      summary: Make the group public under a name, or change that name
      description: |
        Owner and admins only. A public group can be found in `GET /public-groups` and joined by anyone through
        `/@name`, unless banned. The name shares one name space with usernames, ignoring case: a name in use is
        `409` `already_exists`, a reserved name `422`. The old name is free at once. Accounts at `limited` or above
        get `403` `account_restricted` (`share_group`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPublicNameRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [groups]
      operationId: clearGroupPublicName
      summary: Make the group private again
      description: Owner and admins only. The name is free at once; members and invite links stay. Idempotent.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/bans:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: listGroupBans
      summary: Users banned from the group
      description: |
        Owner and admins only. Removing a member (`DELETE /groups/{chat_id}/participants/{user_id}`) bans them: they
        cannot rejoin by invite link or public name and cannot be added again until an admin lifts the ban. Leaving
        the group yourself does not ban. Newest first.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of bans
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupBanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/bans/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [groups]
      operationId: unbanGroupUser
      summary: Lift a ban
      description: Owner and admins only. The user is not added back; they can join again by link or be added. Idempotent.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Lifted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /invites/{token}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [groups]
      operationId: getInvite
      summary: The group behind an invite link
      description: |
        `404` when the token is unknown, revoked, expired or used up. `chat_id` is set when the caller is already a
        member. Rate limited per user.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /invites/{token}/join:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/InviteToken"
    post:
      tags: [groups]
      operationId: joinByInvite
      summary: Join a group through an invite link
      description: |
        Joins directly and posts a `member_joined` system message. A member gets the chat back without a change.
        `404` for an unknown, revoked, expired or used-up link; `403` `forbidden` when banned from the group; `403`
        `account_restricted` (`join_by_link`) at `restricted` or above. At most 20 joins by link or public name per
        hour (`429`).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public-groups:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [groups]
      operationId: searchPublicGroups
      summary: Search public groups by public name or group name
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of public groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupPreviewPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /public-groups/{public_name}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/PublicNameParam"
    get:
      tags: [groups]
      operationId: getPublicGroup
      summary: A public group by its public name
      description: "`chat_id` is set when the caller is a member. Rate limited per user."
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public-groups/{public_name}/join:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/PublicNameParam"
    post:
      tags: [groups]
      operationId: joinPublicGroup
      summary: Join a public group
      description: The same rules as `POST /invites/{token}/join`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public-names/{public_name}/availability:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/PublicNameParam"
    get:
      tags: [groups]
      operationId: getPublicNameAvailability
      summary: Whether a public name is free for a group
      description: Rate limited per user.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNameAvailability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/mentions:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listUnreadMentions
      summary: The caller's unread mentions in a chat
      description: |
        IDs of the messages that mention the caller (by `@username`, or `@all` from an owner or admin) and are newer
        than the caller's read marker, oldest first, at most 100. `Chat.unread_mentions_count` counts them; reading
        past a message removes it.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Unread mentions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MentionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- public
  /public/names/{public_name}:
    parameters:
      - $ref: "#/components/parameters/PublicNameParam"
    get:
      tags: [public]
      operationId: getPublicName
      summary: What a public link `/@name` shows to someone without an account
      description: |
        No authentication. A user is `user` only when their `web_profile_visibility` is `everyone`, their
        `search_visibility` is `everyone` and their account is not `restricted` or `suspended`; a group is `group` only
        when it has this public name. Everything else, including unknown names, is `unavailable`, so the answer does
        not tell whether a name exists. Rate limited per IP. `X-Robots-Tag: noindex`.
      security: []
      responses:
        "200":
          description: The public card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicNameLookup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public/invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [public]
      operationId: getPublicInvite
      summary: What an invite link shows to someone without an account
      description: |
        No authentication. `404` when the token is unknown, revoked, expired or used up. Rate limited per IP.
        `X-Robots-Tag: noindex`.
      security: []
      responses:
        "200":
          description: The group card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicGroup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public/names/{public_name}/avatar:
    parameters:
      - $ref: "#/components/parameters/PublicNameParam"
    get:
      tags: [public]
      operationId: getPublicNameAvatar
      summary: Avatar of a public user or group
      description: |
        No authentication. For a user: only while `GET /public/names/{public_name}` shows them and their
        `avatar_visibility` is `everyone`. For a public group: its avatar. `404` otherwise (no default image).
        `avatar_url` in `PublicUser` and `PublicGroup` carries `rev`; while it matches, the answer may be cached for
        a day. Rate limited per IP.
      security: []
      parameters:
        - name: rev
          in: query
          schema: { type: string, maxLength: 64 }
        - name: size
          in: query
          description: As in `GET /users/{user_id}/avatar`.
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /public/invites/{token}/avatar:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [public]
      operationId: getPublicInviteAvatar
      summary: Avatar of the group behind an invite link
      description: No authentication. `404` when the link does not work or the group has no avatar. Rate limited per IP.
      security: []
      parameters:
        - name: rev
          in: query
          schema: { type: string, maxLength: 64 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 4096 }
      responses:
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /og/names/{public_name}:
    parameters:
      - $ref: "#/components/parameters/PublicNameParam"
    get:
      tags: [public]
      operationId: getOpenGraphName
      summary: Link preview page for `/@name`, for crawlers
      description: |
        No authentication. A small HTML page with Open Graph and Twitter tags (`og:title`, `og:description`,
        `og:image`, `og:url`) built from the same card as `GET /public/names/{public_name}`, and
        `<meta name="robots" content="noindex">`. The web server sends link-preview crawlers of other apps here;
        people get the web app. An unavailable name gets a generic Messenger card. Rate limited per IP.
      security: []
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /og/invites/{token}:
    parameters:
      - $ref: "#/components/parameters/InviteToken"
    get:
      tags: [public]
      operationId: getOpenGraphInvite
      summary: Link preview page for `/join/{token}`, for crawlers
      description: Like `GET /og/names/{public_name}`, for an invite link. A link that does not work gets a generic card.
      security: []
      responses:
        "200":
          description: HTML page
          content:
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /stickers/packs:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [stickers]
      operationId: listStickerPacks
      summary: The user's sticker packs
      description: |
        The packs of the sticker panel: packs the user added, most recently added first, then the built-in default
        packs the user has not removed. Each pack lists its stickers in order. At most 200 packs. With
        `owned=true`, the packs the user made instead, newest first, whether in the panel or not.
      parameters:
        - name: owned
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPackList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [stickers]
      operationId: createStickerPack
      summary: Create a sticker pack
      description: |
        A new, empty pack owned by the user, added to the top of their panel. Its `slug` is the share link
        (`/stickers/links/{slug}`). At most 50 packs per user (`409 limit_reached`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStickerPackRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /stickers/packs/{pack_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
    get:
      tags: [stickers]
      operationId: getStickerPack
      summary: A sticker pack
      description: |
        A built-in pack, the user's own pack, or a user pack the user opened by its link before (`404` otherwise,
        so packs cannot be found by guessing IDs). To preview the pack of a sticker someone sent, open
        `Sticker.pack_slug` with `GET /stickers/links/{slug}` instead. `is_installed` tells whether it is in the
        user's panel. A hidden pack is found only by its owner.
      responses:
        "304":
          description: Not modified; the response's `ETag` matches `If-None-Match`.
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [stickers]
      operationId: updateStickerPack
      summary: Rename a sticker pack
      description: Only the owner of the pack (`403` otherwise). Built-in packs cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStickerPackRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [stickers]
      operationId: deleteStickerPack
      summary: Delete a sticker pack
      description: |
        Only the owner. The pack leaves every panel and its link stops working; stickers already sent from it keep
        showing in chats.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stickers/packs/{pack_id}/installation:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
    put:
      tags: [stickers]
      operationId: addStickerPack
      summary: Add a sticker pack to the user's panel
      description: |
        Adding a pack the user has moves it to the top of the panel. User packs can be added only after opening
        them by their link (`404` otherwise).
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Added
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [stickers]
      operationId: removeStickerPack
      summary: Remove a sticker pack from the user's panel
      description: |
        Built-in default packs can be removed too and come back only when added again. Stickers already sent from
        the pack keep showing in chats.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stickers/packs/{pack_id}/stickers:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
    post:
      tags: [stickers]
      operationId: addSticker
      summary: Add a sticker to a pack
      description: |
        Only the owner. Upload the image with `POST /attachments` (`purpose: sticker`) first; the server has already
        fitted it into 512 x 512 px. The sticker goes to the end of the pack. At most 120 stickers per pack
        (`409 limit_reached`). `422` when the image is not a sticker upload of the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddStickerRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new sticker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sticker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /stickers/packs/{pack_id}/stickers/{sticker_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
      - $ref: "#/components/parameters/StickerId"
    patch:
      tags: [stickers]
      operationId: updateSticker
      summary: Change the emoji of a sticker
      description: Only the owner of the pack.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStickerRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The sticker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sticker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [stickers]
      operationId: deleteSticker
      summary: Remove a sticker from a pack
      description: Only the owner of the pack. Messages that sent the sticker keep showing it.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /stickers/packs/{pack_id}/order:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
    put:
      tags: [stickers]
      operationId: reorderStickers
      summary: Reorder the stickers of a pack
      description: |
        Only the owner of the pack. `sticker_ids` lists every sticker of the pack exactly once, in the new order
        (`422` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReorderStickersRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reordered
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /stickers/packs/{pack_id}/report:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackId"
    post:
      tags: [stickers]
      operationId: reportStickerPack
      summary: Report a sticker pack
      description: |
        One report per user and pack; reporting again changes nothing. After 5 reports from different users the
        pack is hidden until a moderator restores it: it leaves every panel, cannot be added or sent from, and only
        its owner still sees it (`is_hidden`). Stickers already sent keep showing. Built-in packs and the user's own
        packs cannot be reported (`403`). User packs can be reported only after opening them by their link (`404`
        otherwise). At most 20 new reports per user a day (`429`); reporting a pack again changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportStickerPackRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Reported
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /stickers/links/{slug}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/StickerPackSlug"
    get:
      tags: [stickers]
      operationId: getStickerPackByLink
      summary: A sticker pack by its share link
      description: |
        The same as `GET /stickers/packs/{pack_id}`, found by the pack's `slug`. Opening a link lets the user use
        the pack by its ID from then on: add it, report it and send its stickers.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StickerPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /emoji/packs:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [emoji]
      operationId: listEmojiPacks
      summary: The custom emoji the user can use
      description: |
        The user's own packs, the packs they added, and the group emoji of every group they are in (`chat_id`
        set). Each pack lists its emoji in order. At most 100 packs.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The packs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmojiPackList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [emoji]
      operationId: createEmojiPack
      summary: Create an emoji pack
      description: A new, empty pack owned by the user. Its `slug` is the share link (`/emoji/links/{slug}`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmojiPackTitleRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmojiPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /emoji/packs/{pack_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/EmojiPackId"
    get:
      tags: [emoji]
      operationId: getEmojiPack
      summary: An emoji pack
      description: |
        The user's own pack, a pack they added, or the group emoji of a group they are in (`404` otherwise, so
        packs cannot be found by guessing IDs). Open other packs with `GET /emoji/links/{slug}`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }

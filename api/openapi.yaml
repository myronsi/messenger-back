openapi: 3.1.0
info:
  title: Messenger API
  version: 2.1.0-alpha.16
  summary: REST contract of the Messenger backend (v2).
  description: |
    Contract for the Go backend. The WebSocket protocol is described in `websocket/` and
    `websocket.md`; the entity schemas below are shared by both.

    ## Conventions

    - Base path `/api/v2`. Breaking changes need a new MAJOR version with a new base path
      (see `docs/api-compatibility.md`).
    - All IDs are **strings** in JSON. Message IDs are 64-bit Snowflake IDs, larger than
      JavaScript's safe integer limit (2^53), so they must never be parsed as numbers.
    - Timestamps are RFC 3339 UTC (`2026-10-04T12:00:00Z`).
    - Errors are `application/problem+json` (RFC 9457) with a stable `code`; clients switch on
      `code`, never on `title` or `detail`.
    - Lists use cursor pagination: `limit` plus `before`, `after` or `around`, and responses
      return `next_cursor` (and `prev_cursor` for messages). Cursors are opaque to clients
      except for message history, where they are message IDs.
    - Enums can grow in a MINOR version; clients must handle unknown values with a fallback.
    - Clients send `X-Client-Version` (app version) and `X-Client-Api-Version` (the contract
      version they were built with). A different MAJOR or a version below
      `min_client_api_version` gets `426` with `code: client_outdated`.
    - Files are never referenced by a client-supplied URL: upload with `POST /attachments`,
      then refer to the returned `attachment_id`.
    - Statuses any operation may answer, not repeated per operation: `413` (body over the size
      limit, `payload_too_large`) and `415` (a body that is not `application/json`,
      `unsupported_media_type`) for operations with a body; `500` (a bug) and `503` (a store is
      away; retry after `Retry-After`) for all.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v2
    description: Same origin as the web app (reverse proxy)
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Versions of the backend and the contract
  - name: auth
    description: Registration, login, tokens and account recovery
  - name: me
    description: The current user's profile, security and privacy
  - name: users
    description: Other users
  - name: chats
    description: Direct chats, pinning, read state and message history
  - name: groups
    description: Group chats and their members
  - name: messages
    description: Edit, delete and forward messages
  - name: attachments
    description: File and voice uploads
  - name: requests
    description: Approval requests (direct messages and group invites)
  - name: websocket
    description: Realtime connection (see `websocket.md`)
  - name: calls
    description: Audio calls (see `docs/calls.md` and `docs/calls-e2ee.md`)

paths:
  /meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Backend and contract versions
      description: No authentication. Cacheable for 60 seconds.
      security: []
      responses:
        "200":
          description: Versions
          headers:
            Cache-Control:
              description: "`public, max-age=60`"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------- auth
  /auth/register:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      description: Answers with a login challenge instead of tokens when two-factor authentication is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Signed in, or a two-factor challenge
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/login/2fa:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: loginTwoFactor
      summary: Finish a login with a two-factor code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorLoginRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/refresh:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Get a new access token
      description: Uses the HttpOnly refresh cookie and rotates it.
      security:
        - cookieAuth: []
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: New access token
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Signed out; the refresh cookie is cleared
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/recover/key:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [auth]
      operationId: recoverWithKey
      summary: Reset password with a single-use recovery key
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoverWithKeyRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/recovery-key:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [auth]
      operationId: getRecoveryKey
      summary: Get recovery-key status without revealing its hash
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryKeyStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: [auth]
      operationId: replaceRecoveryKey
      summary: Create or regenerate a recovery key after password and second-factor confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceRecoveryKeyRequest" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryKeyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/security-events:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [auth]
      operationId: listSecurityEvents
      summary: List the last 50 security events of this account
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /ws/ticket:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [websocket]
      operationId: createWebSocketTicket
      summary: Get a one-time ticket for the WebSocket
      description: |
        The ticket is valid for a few seconds and can be used once at
        `/api/v2/ws?ticket=…`; it replaces tokens in the URL.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: Ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebSocketTicket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ me
  /me:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getMe
      summary: Current user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the profile
      description: Replaces `PUT /me` and `POST /me/bio` of v1. Only the sent fields change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [me]
      operationId: deleteMe
      summary: Delete the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Account deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: setMyAvatar
      summary: Set the avatar from an uploaded attachment
      description: "Replaces both avatar routes of v1. Upload the image with `POST /attachments` (`purpose: avatar`) first."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/avatars/{avatar_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: avatar_id
        in: path
        required: true
        description: "`id` of an `AvatarVersion` of the caller."
        schema: { $ref: "#/components/schemas/Id" }
    delete:
      tags: [me]
      operationId: deleteMyAvatar
      summary: Delete one of your avatars
      description: |
        Removes the avatar from your history. When it is the current one, the newest remaining avatar becomes
        current again; without one you get the default avatar. The image is deleted from storage once nothing
        uses it any more.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/password:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    put:
      tags: [me]
      operationId: changePassword
      summary: Change the password
      description: "Revokes all other sessions. A wrong current password answers `403` with `code: invalid_credentials`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204":
          description: Password changed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/security:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getSecuritySettings
      summary: Security settings
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateSecuritySettings
      summary: Change the session duration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSecuritySettingsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/sessions:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listSessions
      summary: Signed-in devices
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Sessions of the current user
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: revokeOtherSessions
      summary: Sign out everywhere except this device
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Other sessions revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [me]
      operationId: revokeSession
      summary: Sign out one device
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Session revoked
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/2fa/setup:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: setupTwoFactor
      summary: Start two-factor setup
      description: "Returns the secret and an `otpauth://` URI; two-factor stays off until confirmed. A wrong password answers `403` with `code: invalid_credentials`; `409` when two-factor is already on."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/2fa/confirm:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: confirmTwoFactor
      summary: Turn two-factor on with a code
      description: "Returns the recovery codes. They are shown only once, so store them safely."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorCode" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: Two-factor authentication enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorRecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/2fa/disable:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [me]
      operationId: disableTwoFactor
      summary: Turn two-factor off
      description: "A wrong password or code answers `403` (`invalid_credentials` or `invalid_two_factor_code`); a correct password without `code` answers `401` with `code: two_factor_required`; `409` when two-factor is off."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTwoFactorRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "204":
          description: Two-factor authentication disabled
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /me/privacy:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: getPrivacySettings
      summary: Privacy settings and exceptions
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updatePrivacySettings
      summary: Update privacy settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePrivacySettingsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/privacy/exceptions/{setting_key}/{effect}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - name: setting_key
        in: path
        required: true
        schema:
          type: string
          enum: [avatar_visibility, profile_visibility, presence_visibility, group_invites, direct_messages, search_visibility]
      - name: effect
        in: path
        required: true
        schema:
          type: string
          enum: [allow, deny]
    put:
      tags: [me]
      operationId: replacePrivacyExceptions
      summary: Replace the exception list of one setting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyExceptionsRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /me/blocked-users:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [me]
      operationId: listBlockedUsers
      summary: Blocked users
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of blocked users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/blocked-users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [me]
      operationId: blockUser
      summary: Block a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Blocked (also when already blocked)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [me]
      operationId: unblockUser
      summary: Unblock a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Unblocked (also when not blocked)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- users
  /users:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [users]
      operationId: searchUsers
      summary: Search users by username or display name
      description: Users whose `search_visibility` is `nobody` are not returned.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 64 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /usernames/{username}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [users]
      operationId: getUserByUsername
      summary: Profile by username
      description: |
        Like `GET /users/{user_id}`: a user whose `search_visibility` hides them from the current user (`nobody`
        without an `allow` exception, or a `deny` exception) is `404` unless the two share a chat. Lookups are
        rate limited per user.
      parameters:
        - name: username
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user, as visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: Profile by ID
      description: |
        A user whose `search_visibility` hides them from the current user (`nobody` without an `allow` exception,
        or a `deny` exception) is `404` unless the two share a chat. Your own profile is always found. Lookups are
        rate limited per user.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user, as visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /users/{user_id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUserAvatar
      summary: Current avatar image
      description: |
        Respects the avatar visibility of the user; falls back to the default avatar. With `version`, an
        earlier avatar of the history (`AvatarVersion.url`). `avatar_url` carries `rev`, the revision of the
        current avatar: while it matches, the answer may be cached for a year (`immutable`), because a new
        avatar gets a new `rev` and so a new URL.
      parameters:
        - name: version
          in: query
          description: "`id` of an `AvatarVersion` of this user."
          schema: { $ref: "#/components/schemas/Id" }
        - name: rev
          in: query
          description: Revision of the current avatar, as given in `avatar_url`.
          schema: { type: string, maxLength: 64 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range (`Range` header)
          content:
            image/*:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "416":
          description: The requested range is outside the file
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/avatars:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: listUserAvatars
      summary: Avatar history
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of previous avatars, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvatarVersion" }
                  next_cursor: { $ref: "#/components/schemas/Cursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{user_id}/contact-name:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setContactName
      summary: Set your own display name for a user
      description: |
        Follows the rules of `GET /users/{user_id}`: a user whose `search_visibility` hides them from you is `404`
        unless the two of you share a chat, and the calls count against the same per-user limit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactNameRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The user with the contact name applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [users]
      operationId: removeContactName
      summary: Remove your display name for a user
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------- attachments
  /attachments:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload a file, image, audio or voice message
      description: |
        The server checks the content, not the file name or the client's content type. The
        returned `attachment_id` is used in messages (`type: file` or `voice`) or for
        avatars. Attachments that are not used within 24 hours are deleted.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadAttachmentRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Uploaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /attachments/{attachment_id}/content:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: Download an attachment
      description: |
        Only the uploader and members of a chat in which a message using the attachment is visible to them can
        download it. The answer is the file, or a `302` redirect to a short-lived signed URL of the object
        storage. Images, audio and video are sent `inline`; everything else as a download
        (`Content-Disposition: attachment`, `application/octet-stream`), always with
        `X-Content-Type-Options: nosniff`.
      parameters:
        - name: variant
          in: query
          description: |
            `thumbnail`: a JPEG of at most 320 px (images only; `thumbnail_url` of the attachment).
            `display`: a JPEG of at most 1600 px for viewing a large still image (`display_url` of the attachment);
            the original for any other attachment.
          schema:
            type: string
            enum: [thumbnail, display]
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range (`Range` header); players use it to seek
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "416":
          description: The requested range is outside the file
        "302":
          description: Redirect to a short-lived signed URL of object storage (`MEDIA_SIGNED_URLS`); not cached
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- chats
  /chats:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [chats]
      operationId: listChats
      summary: My chats with last message and unread count
      description: |
        One request replaces `GET /chats/list/{username}` and `GET /groups/list/{username}`.
        Pinned chats come first (most recently pinned first), then the others by their last
        message (newest first). `last_message` is the newest message the caller can see; in
        direct chats its `read_by` holds the other user once they read it (with read receipts
        on), in groups it is empty. `unread_count` stops at 999.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [chats]
      operationId: createChat
      summary: Start a direct chat
      description: |
        Respects the other user's `direct_messages` privacy setting. When approval is needed
        the answer is `202` with the pending request instead of a chat. Returns the existing
        chat (`200`) if there already is one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChatRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "200":
          description: The chat already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "201":
          description: Chat created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "202":
          description: Waiting for the other user's approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: getChat
      summary: One chat
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [chats]
      operationId: deleteChat
      summary: Delete a direct chat
      description: |
        Deletes the chat and its messages for both users (as v1 did); both get `chat_deleted`.
        For groups use `DELETE /groups/{chat_id}` (owner) or `POST /groups/{chat_id}/leave`;
        a group here is `422`.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /chats/{chat_id}/pin:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [chats]
      operationId: pinChat
      summary: Pin a chat
      description: At most 10 chats can be pinned (`409` beyond that). Pinning a pinned chat changes nothing.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Pinned
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [chats]
      operationId: unpinChat
      summary: Unpin a chat
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Unpinned
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/read:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [chats]
      operationId: markChatRead
      summary: Mark messages as read up to a message
      description: Replaces the duplicate `/read` and `/read/` routes of v1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: New unread count
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chats/{chat_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listMessages
      summary: Message history
      description: |
        Replaces `GET /messages/history/{chat_id}`. Without a cursor the newest messages are
        returned. Items are always ordered oldest to newest. Send at most one of `before`,
        `after` and `around` (message IDs).
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: before
          in: query
          description: Messages older than this message ID
          schema: { $ref: "#/components/schemas/Id" }
        - name: after
          in: query
          description: Messages newer than this message ID
          schema: { $ref: "#/components/schemas/Id" }
        - name: around
          in: query
          description: A window containing this message ID
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    post:
      tags: [chats]
      operationId: sendMessage
      summary: Send a message over HTTP
      description: |
        Same as the WebSocket `message` event, for clients without a connection. Sending the
        same `client_temp_id` again returns the existing message instead of creating a copy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Message created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "200":
          description: Already created for this `client_temp_id`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/search:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: searchMessages
      summary: Search messages in a chat
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 128 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/media:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [chats]
      operationId: listChatMedia
      summary: Photos, videos or audio of a chat
      description: Replaces `GET /messages/photos/{chat_id}` and `GET /messages/audios/{chat_id}`.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: "#/components/schemas/MediaKind" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Messages with matching attachments, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # ------------------------------------------------------------ messages
  /messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [messages]
      operationId: editMessage
      summary: Edit your text message or the caption of your file
      description: An empty `content` removes the caption of a file message; a text message needs at least one character.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Edited message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        `scope=me` hides it for the current user only (any message). `scope=everyone` removes
        it for all participants: own messages, any message of a direct chat (either side), and any message
        for group owners, admins and moderators.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [me, everyone]
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /messages/{message_id}/forward:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [messages]
      operationId: forwardMessage
      summary: Forward a message to other chats
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardMessageRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: One new message per target chat
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/forward:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [messages]
      operationId: forwardMessages
      summary: Forward several messages of a chat to other chats
      description: |
        Copies up to 20 messages of the chat, oldest first, into every target chat, at most 20 copies in all. Every
        copy counts against the sender's message rate. Every message and target is checked before anything is
        written, so a refused one forwards nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForwardMessagesRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "201":
          description: The new messages, per target chat oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /chats/{chat_id}/messages/delete:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [messages]
      operationId: deleteMessages
      summary: Delete several messages of a chat
      description: |
        Deletes up to 100 messages of the chat with the rules of `DELETE /messages/{message_id}`. Every message
        is checked first: when one may not be deleted, none is. With `scope` everyone, messages that are already
        deleted for everyone count as done, so a retry after a partial failure finishes the rest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteMessagesRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }

  # -------------------------------------------------------------- search
  /search/messages:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: searchAllMessages
      summary: Search messages in all my chats
      description: |
        Full-text search across every chat the caller is in, newest first. Only chats the caller
        is a member of are searched, messages they deleted for themselves are left out, and every
        hit is checked against the message store before it is returned (a deleted message never
        shows, even when the index lags behind). Edits and deletions reach the results within a
        few seconds.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 128 }
        - name: chat_id
          in: query
          description: Only this chat
          schema: { $ref: "#/components/schemas/Id" }
        - name: sender_id
          in: query
          description: Only messages of this user
          schema: { $ref: "#/components/schemas/Id" }
        - name: type
          in: query
          schema:
            type: string
            enum: [text, file, voice]
        - name: from
          in: query
          description: Messages created at or after this time
          schema: { $ref: "#/components/schemas/Timestamp" }
        - name: to
          in: query
          description: Messages created before this time
          schema: { $ref: "#/components/schemas/Timestamp" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Matches, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSearchPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------ requests
  /requests:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [requests]
      operationId: listApprovalRequests
      summary: Inbox of approval requests
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of pending requests
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalRequest" }
                  next_cursor: { $ref: "#/components/schemas/Cursor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /requests/{request_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      operationId: approveRequest
      summary: Approve a request
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Approved; the chat or group membership now exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /requests/{request_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      tags: [requests]
      operationId: rejectRequest
      summary: Reject a request
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Rejected
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # -------------------------------------------------------------- groups
  /groups:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [groups]
      operationId: listGroups
      summary: My groups
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: A page of group chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [groups]
      operationId: createGroup
      summary: Create a group
      description: |
        Members whose `group_invites` setting requires approval get an approval request instead of being added.
        If any of them does not allow invitations from the caller at all, nothing is created (`403`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /groups/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: getGroup
      summary: Group details and members
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [groups]
      operationId: updateGroup
      summary: Change name or description
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: deleteGroup
      summary: Delete the group (owner only)
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Deleted for all members
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/avatar:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    put:
      tags: [groups]
      operationId: setGroupAvatar
      summary: Set the group avatar from an uploaded attachment
      description: The attachment must be an image the caller uploaded with purpose `avatar` (`422` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetAvatarRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /groups/{chat_id}/participants:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: addGroupParticipant
      summary: Add a participant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddParticipantRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group (the user may still be pending approval)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /groups/{chat_id}/participants/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [groups]
      operationId: updateGroupParticipantRole
      summary: Change a participant's role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRoleRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
    delete:
      tags: [groups]
      operationId: removeGroupParticipant
      summary: Remove a participant
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Removed
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups/{chat_id}/transfer-owner:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: transferGroupOwnership
      summary: Make another member the owner
      description: The previous owner becomes an admin. Transferring to yourself is `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnerRequest" }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Updated group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /groups/{chat_id}/leave:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [groups]
      operationId: leaveGroup
      summary: Leave the group
      description: The owner has to transfer ownership first.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "204":
          description: Left
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /groups/{chat_id}/role-log:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [groups]
      operationId: getGroupRoleLog
      summary: Role changes of the group's members
      description: Who made whom an admin or a member, or transferred ownership, and when. Members only.
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Role changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupRoleLog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /link-preview:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: getLinkPreview
      summary: Preview of a web page for a link in a message
      description: |
        Reads the page's Open Graph data (`og:title`, `og:description`, `og:site_name`, `og:image`; falling back to
        `<title>`, `description` and `twitter:image`). Only public `http`/`https` addresses on ports 80 and 443
        are fetched. Answers are cached for a day (a page without a preview for an hour). `image.url` points to
        `GET /link-preview/image`, so clients never load third-party images directly. `404` when the page has
        no preview or cannot be fetched.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /link-preview/image:
    parameters:
      - $ref: "#/components/parameters/ClientVersion"
      - $ref: "#/components/parameters/ClientApiVersion"
    get:
      tags: [messages]
      operationId: getLinkPreviewImage
      summary: The image of a link preview, through the server
      description: |
        Use the `image.url` of a link preview as it is; `sig` proves the server made it. PNG, JPEG, GIF and WebP
        up to 5 MB, sent with `X-Content-Type-Options: nosniff`.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: sig
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "426": { $ref: "#/components/responses/ClientOutdated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "200":
          description: Image content
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/notifications:
    get:
      tags:
        - me
      operationId: getNotificationSettings
      summary: Notification preferences and supported push platforms
      responses:
        "200":
          description: Notification settings or registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    put:
      tags:
        - me
      operationId: updateNotificationSettings
      summary: Replace notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /notifications/avatar/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: "`avatar_token` of a push notification."
        schema: { type: string, maxLength: 256 }
    get:
      tags: [me]
      operationId: getNotificationAvatar
      summary: Sender avatar for a push notification
      description: |
        For the service worker, which has no session: the token in the push payload names the recipient
        and the sender and expires after an hour. Follows the sender's avatar visibility for the recipient.
      security: []
      responses:
        "200":
          description: Image
          content:
            image/*:
              schema: { type: string, format: binary }
        "206":
          description: The requested byte range (`Range` header)
          content:
            image/*:
              schema: { type: string, format: binary }
        "302":
          description: Redirect to a short-lived signed storage URL (with `MEDIA_SIGNED_URLS`)
        "304":
          description: Not modified (`If-None-Match` with the `ETag` of an earlier answer)
        "416":
          description: The requested range is outside the file
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications/read/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: "`read_token` of a push notification."
        schema: { type: string, maxLength: 256 }
    post:
      tags: [me]
      operationId: markNotificationRead
      summary: Mark a chat read from a push notification
      description: |
        For the notification's "Mark as read" action: marks the chat read up to the notified message for
        the recipient the token names. The token expires after seven days.
      security: []
      responses:
        "204":
          description: Marked as read
        "404": { $ref: "#/components/responses/NotFound" }
  /me/notification-devices:
    post:
      tags:
        - me
      operationId: registerNotificationDevice
      summary: Register a push destination for the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationDeviceRequest"
      responses:
        "200":
          description: Notification settings or registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeviceRegistered"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /me/notification-devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - me
      operationId: deleteNotificationDevice
      summary: Unregister a push destination for the current session
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":

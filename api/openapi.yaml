        name: requestId
        in: path
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        description: Secret one-time recovery request capability. Never log or persist
          it in browser storage.
    get:
      tags:
        - auth
      operationId: deviceRecoveryStatus
      summary: Poll the status of a secret recovery request
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecoveryStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "426":
          $ref: "#/components/responses/ClientOutdated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/recovery-requests/{requestId}/approve:
    parameters:
      - *a1
      - *a2
      - &a4
        name: requestId
        in: path
        required: true
        schema:
          type: string
          minLength: 32
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        description: Approval handle from the recovery_request event. It is different from the
          requester's capability and cannot poll or complete the request.
    post:
      tags:
        - auth
      operationId: approveDeviceRecovery
      summary: Approve a recovery request using number matching, user verification and the second factor
      description: |
        Approval does not need the current password, which the user may have forgotten. The checks run in this
        order: the request must belong to the caller and `match_number` must match (a wrong number denies the
        request), then user verification, then the second factor.

        User verification follows `POST /auth/recovery-requests/{requestId}/approve/options`. When the account
        has passkeys, `passkey` must carry an assertion with user verification for the challenge from that call
        (`403 user_verification_required` without it, `403 invalid_credentials` for a failed assertion,
        `400 invalid_request` for an unknown, used or expired challenge). A missing `code` answers
        `401 two_factor_required` before the challenge is used, so the request can be repeated with the same
        assertion and the code. A wrong code is checked after the passkey and uses up the challenge.
        Without passkeys the approving session must be at least as old as the minimum session age
        (`RECOVERY_APPROVAL_MIN_SESSION_AGE`, 72 hours by default), otherwise `403 session_too_new`.

        `password` is ignored and only accepted so that older clients keep working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRecoveryApproval"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecoveryStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401": { $ref: "#/components/responses/TwoFactorRequired" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "426":
          $ref: "#/components/responses/ClientOutdated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/recovery-requests/{requestId}/approve/options:
    parameters:
      - *a1
      - *a2
      - *a4
    post:
      tags:
        - auth
      operationId: deviceRecoveryApprovalOptions
      summary: Tell the approving device how to verify its user
      description: |
        `method: passkey` when the account has passkeys: `challenge_id` and `public_key` (WebAuthn request
        options with `userVerification: required`) are for `navigator.credentials.get`, and the result goes to
        the approval as `passkey`. The challenge is bound to this session and request, is single use and expires
        after 5 minutes or with the request. `method: session` otherwise; `approvable_from` is set while the
        session is younger than the minimum session age and tells when it may approve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRecoveryApprovalOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":

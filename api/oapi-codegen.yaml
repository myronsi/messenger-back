# oapi-codegen configuration for the Go server (strict server interfaces).
# Run by `go generate ./...` (the directive is in internal/httpapi/generate.go), so the output path is
# relative to internal/httpapi. Keep the generated file committed: CI runs
# `go generate ./... && git diff --exit-code`.
package: httpapi
output: api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  skip-prune: true
